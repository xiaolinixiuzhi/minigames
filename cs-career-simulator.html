// LIFE SYSTEM
// ============================================================
function processLife(){
  const p=G.player;
   const l=G.life;
  // Rest reduces fatigue（小幅辅助：月末统一结算是主渠道——旧 rest*3 每月白送 -12 起步，叠加月末恢复后疲劳常年为 0）
  p.fatigue=clamp(p.fatigue-Math.floor(l.rest/3),0,100);
  const comfort=getComfort();
  p.fatigue=clamp(p.fatigue-comfort.fatigueRec,0,100); // 住房+房产+座驾综合舒适度（第 52/53 轮）
  // Entertainment affects mental
  p.mentalState=clamp(p.mentalState+l.entertainment*2-l.training*0.3,0,100);
  if(G.life&&G.life.psychologist){p.mentalState=clamp(p.mentalState+2,0,100);G.pressure=clamp(G.pressure-2,0,100);} // 心理教练订阅（第 52 轮）
  p.mentalState=clamp(p.mentalState+(comfort.mentalRec||0),0,100); // 住房+座驾心态加成（第 52/53 轮）
  if(G.life.car&&CAR_TIERS[G.life.car].fameGain)G.fame=clamp(G.fame+CAR_TIERS[G.life.car].fameGain,0,100); // 跑车：圈内关注度（第 53 轮）
  // Fitness affects physical（上限跟随年龄曲线：18-30 平台，30+ 衰退期不可逆推）
  const physCapAge=Math.min(p.potential.physical,getMaxPhysical(p.age,p.physicalCap||85));
  if(l.fitness>=3){
    p.attrs.physical=clamp(p.attrs.physical+0.5,10,physCapAge);
  } else if(l.fitness>=1){
    p.attrs.physical=clamp(p.attrs.physical+0.1,10,physCapAge);
  } else {
    p.attrs.physical=clamp(p.attrs.physical-0.1,10,physCapAge);
  }
  // High training without rest = danger
  if(l.training>10&&l.rest<4){
    p.fatigue=clamp(p.fatigue+10,0,100);
    p.mentalState=clamp(p.mentalState-5,0,100);
  }
}

// FINANCIAL SYSTEM
// ============================================================
const FAN_MILESTONES=[
  {t:10000,label:'1万',fame:3},
  {t:100000,label:'10万',fame:8},
  {t:1000000,label:'100万',fame:15},
  {t:10000000,label:'1000万',fame:25}
];

function processFinance(){
  let income=0,expense=0;
  if(G.team){
    income+=G.team.contract.salary;
  }
  // 直播：每月统一固定 30 场天梯（消耗 15 体力）
  let streamIncome=0;
  let ladderMatches=0;
  if(G.streaming.active!==false){
    ladderMatches=30;
    // 直播消耗体力：每月统一 15 点
    const streamSpent=Math.min(G.stamina,15);
    G.stamina-=streamSpent;
    G.staminaConsumed=(G.staminaConsumed||0)+streamSpent;
    G.player.fatigue=clamp(G.player.fatigue+3*getFatigueAgeRate(G.player.age),0,100); // 30 场直播天梯同样是负荷
    const marketAttention=G.marketAttention||0;
    const attraction=G.streaming.attraction||0;
    const baseViewers=Math.round(marketAttention*2+attraction*0.3);
    const levelBonus=G.careerLevel==='amateur'?1.0:G.careerLevel==='semiPro'?1.5:G.careerLevel==='pro'?2.5:4.0;
    const formBonus=1+(G.player.form-50)*0.005;
    const ladderBonus=1+ladderMatches*0.05;
    const avgViewers=Math.max(5000,Math.round(baseViewers*levelBonus*formBonus*ladderBonus*(0.8+Math.random()*0.4))); // 保底 5000 观众
    streamIncome=Math.round(avgViewers*randf(0.02,0.08)*getFameStreamingBonus());
    income+=streamIncome;
    const followerGrowth=Math.round(avgViewers*0.3*(0.5+Math.random())+ladderMatches*2);
    const beforeFollowers=G.streaming.followers;
    G.streaming.followers+=followerGrowth;
    // 粉丝里程碑：跨过阈值入队（advanceMonth 弹窗链消费）
    (FAN_MILESTONES||[]).forEach(mi=>{
      if(beforeFollowers<mi.t&&G.streaming.followers>=mi.t){
        G._pendingFanMilestones=G._pendingFanMilestones||[];
        G._pendingFanMilestones.push(mi);
        G.eventLog.push({text:`✨ 粉丝数突破 ${mi.t.toLocaleString()}！`,type:'positive',month:G.month,year:G.year});
      }
    });
    G.streaming.avgViewers=avgViewers;
    G.streaming.totalDonations+=streamIncome;
    G.streaming.monthlyIncome=streamIncome;
    G.streaming.ladderMatches=ladderMatches;
    if(avgViewers>0){
      const attentionGain=avgViewers/100*randf(0.1,0.3);
      G.marketAttention=Math.min(100,(G.marketAttention||0)+attentionGain);
    }
    if(ladderMatches>0){
      G.streaming.attraction=(G.streaming.attraction||0)+ladderMatches*0.5;
    }
  } else {
    G.streaming.monthlyIncome=0;
    G.streaming.avgViewers=0;
    G.streaming.ladderMatches=0;
  }
  // 品牌收入（R07）：限期 12 个月，到期自动结束
  if(G._brandIncome){
    const now=G.year*12+G.month;
    if(!G._brandIncomeUntil||now<G._brandIncomeUntil){
      income+=G._brandIncome;
    }else{
      delete G._brandIncome;
      delete G._brandIncomeUntil;
      G.eventLog.push({text:'品牌合作到期，额外收入结束。',type:'neutral',month:G.month,year:G.year});
    }
  }
  // 订阅服务结算（第 52 轮经济系统一期）：私教 2000/月、心理教练 1500/月，存款不足自动暂停
  if(G.life&&G.life.coach){
    if(G.money>=2000)expense+=2000;
    else{G.life.coach=false;G.eventLog.push({text:'💰 存款不足，私教订阅已暂停',type:'negative',month:G.month,year:G.year});}
  }
  if(G.life&&G.life.psychologist){
    if(G.money>=1500)expense+=1500;
    else{G.life.psychologist=false;G.eventLog.push({text:'💰 存款不足，心理教练订阅已暂停',type:'negative',month:G.month,year:G.year});}
  }
  // Living expenses（第 52 轮：住房分档取代固定房租；公寓/豪宅签长约免疫涨租）
  expense+=getHomeRent()+((!G.life.house&&['shared','studio'].includes(G.life.housing||'shared'))?(G._rentIncrease||0):0); // 房产免房租（第 53 轮）
  if(G.careerLevel==='pro'||G.careerLevel==='semiPro')expense+=300;
  const trainingIntensity=G.training.intensity||'moderate';
  const trainingExpense={high:300,moderate:200,light:100}[trainingIntensity]||200;
  expense+=trainingExpense;
  G.money+=income-expense;
  if(G.money<0)G.money=0;
  return {income,expense,streamIncome,ladderMatches};
}

// MONTHLY ADVANCEMENT
// ============================================================
function advanceMonth(){
  if(G.retired){showToast('职业生涯已结束','info');return}
  // 结算重入保护：正常结算瞬间完成；若上次结算中断，10 秒后允许重试
  if(G._advanceActive&&Date.now()-(G._advanceStartedAt||0)<10000){
    showToast('本月正在结算，请稍候','info');return;
  }
  const logs=[];
  const logYear=G.year;
  const logMonth=G.month;
  G._advanceActive=true;
  G._advanceStartedAt=Date.now();
  delete G._trainEffMod; // 训练效率事件修正只维持一个月（第 51 轮）
  G._pendingAchPopups=G._pendingAchPopups||[];
  initMonthlyStamina();
  const recoveryLogs=processPendingFatigueRecovery();
  recoveryLogs.forEach(l=>logs.push(l));
  G._preMonthMatches=G.career.totalMatches;
  if(G.player.fatigue===undefined)G.player.fatigue=0;
  if(G.player.mentalState===undefined)G.player.mentalState=70;
  if(G.player.form===undefined)G.player.form=50;
  if(G.staminaMax===undefined)G.staminaMax=100;
  // 积分月度结算（第 35 轮）：向档位基准回归 5% + 快照，赛事表现随后在其所在月结算
  applyPointsMonthlyTick();
  // 本月赛历：页面与结算共用同一份，不在结算时重新生成
  const schedule=ensureMonthSchedule(false);
  // 赛历中的正式赛事数：供随机事件在比赛结算前判断“本月有比赛”
  G._monthScheduledEvents=schedule.events.filter(e=>e.kind==='event'&&e.registered).length;
  // 随机事件提前到训练/比赛前结算，使“本月训练效率”等修正真正作用于本月（第 84 轮）
  const events=processRandomEvents();
  events.forEach(e=>logs.push(`事件：${e.name}`));
  if(G._suggestRest){logs.push('💡 身心状态告急：建议下月减少训练和比赛安排。');delete G._suggestRest;}
  if(G._newTeammate){G._newTeammatePending=true;delete G._newTeammate;} // 新援磨合期顺延至下月
  const budget=getScheduleEstimate();
  logs.push(`体力初始化：上限 ${G.staminaMax.toFixed(0)}，当前疲劳 ${G.player.fatigue.toFixed(0)}`);
  logs.push(`月度计划：报名 ${schedule.events.filter(e=>e.registered).length} 项（每系列赛耗 4 体力），训练 ${budget.training}，直播 ${G.streaming.active!==false?'30 场（耗 15 体力、疲劳+3）':'关闭'}`);
  // 1. Training
  const intensityLabel={high:'高强度',moderate:'适量',light:'轻度'}[G.training.intensity||'moderate'];
  if(G._forcedRest){
    logs.push('🛌 强制休息：本月训练暂停，让身体彻底恢复');
    delete G._forcedRest;
  } else if(G.injury){
    // 伤病中训练暂停（保留计划，伤愈后继续执行）
    logs.push(`🤕 伤病中（${G.injury.name}），本月训练暂停`);
  } else {
    // 按小时折算训练课：4 小时=1 课，体力不足自动中断（一键计划已取消，第 64 轮）
    const times=getTrainingSessions();
    let totalGain=0,anyCap=false,anyBreak=false,executed=0;
    for(let i=0;i<times;i++){
      if(G.stamina<(TRAINING_PARAMS[G.training.intensity||'moderate']||TRAINING_PARAMS.moderate).stamina)break;
      const r=processTraining();
      totalGain+=parseFloat(r.gain)||0;
      executed++;
      if(r.hitCap)anyCap=true;
      if(r.breakthrough)anyBreak=true;
    }
    G.monthTrainingHours=(G.monthTrainingHours||0)+executed*4;
    logs.push(`训练[${intensityLabel}]：${ATTR_SHORT[G.training.selected]} +${totalGain.toFixed(2)}${anyBreak?' ⚡突破上限！':anyCap?' [瓶颈]':''}`);
  }
  // 2. Life
  processLife();
  // 3. Official events & league matches (all consume before streaming)
  const matchResult=processMatches();
  if(matchResult.mapCount>0){
    logs.push(`比赛：${matchResult.seriesCount} 个系列赛，${matchResult.wins}胜${matchResult.losses}负，地图均分Rating ${matchResult.avgRating}（${matchResult.mapCount}张地图）`);
  }else if(matchResult.ladder&&matchResult.ladder.series>0){
    // 第 68 轮：只打天梯/联赛时不再谎报"无出场记录"
    const L=matchResult.ladder;
    logs.push(`比赛：天梯/联赛 ${L.series} 场，${L.wins}胜${L.losses}负，均分Rating ${L.avgRating}（不计入正式战绩）`);
  }else{
    logs.push('比赛：本月无出场记录');
  }
  matchResult.events.forEach(ev=>{
    const res=ev.result||{};
    if(res.qualified===false){
      logs.push(`${ev.name}：未获参赛资格${res.stage==='benched'?'（替补未出场）':''}`);
    }else{
      logs.push(`${ev.name}：${PLACEMENT_TEXT[res.placement]||'参赛'}${res.score?' ('+res.score+')':''}`);
    }
  });
  // 本月赛事 MVP/EVP（finishEvent 评选）
  (G._monthEventAwards||[]).forEach(aw=>logs.push(aw));
  G._monthEventAwards=[];
  // 3b. 系列赛 MVP 日志（逐场评选在 recordSeries 完成）
  if(matchResult.mvps>0){
    logs.push(`🏆 获得系列赛 MVP ×${matchResult.mvps}！`);
  }
  // 4. Random events（已在月初结算，见上方）
  const t20rank=logMonth===12?checkTop20(logYear,G._yearStats):0;
  const rewriteEvents=checkRewriteHistory();
  const histEvents=processHistoricalEvents();
  histEvents.forEach((e,i)=>logs.push(`历史事件：${e.name}（${e.status==='participant'?'当事人':e.status==='topTier'?'一线':'旁观'}）${i>=MAX_HIST_POPUPS_PER_MONTH?` · ${e.desc}`:''}`));
  rewriteEvents.forEach(e=>logs.push(`✨ 改写历史：${e.name}！`));
  const allPopupEvents = [
    ...rewriteEvents.map(e => ({...e,type:'rewrite'})),
    ...histEvents.slice(0,MAX_HIST_POPUPS_PER_MONTH).map(e => ({...e,type:'historical'})),
    ...events.filter(e=>e.cat==='rare').map(e=>({...e,severity:e.type,type:'rare'}))
  ];
  // 现实赛场回顾只在月度总结中完整展示，避免弹窗链与总结重复（第 84 轮）
  // 5. Finance (streaming is fixed 30 matches/month; costs 15 stamina + 3 fatigue)
  const finance=processFinance();
  if(G.streaming.active!==false){
    logs.push(`直播：本月统一 30 场天梯，收入 ${formatMoney(finance.streamIncome)}`);
  }
  // 6. Contract
  processContract();
  // 7. Benching check
  if(G.team&&!G.team.isStarter){G._monthsBenched=(G._monthsBenched||0)+1;}else{G._monthsBenched=0;} // 替补翻身计数
  checkBenching();
  checkUnbenching();
  // 8. Pressure
  const pressureMsg=processPressure(matchResult);
  logs.push(`压力：${pressureMsg.msg}`);
  // 9. Career progression
  const progEvents=checkCareerProgression();
  progEvents.forEach(e=>{
    if(G.careerLevel!==e.level){
      logs.push(`突破：${e.text}`);
      G.careerLevel=e.level;
      G.career.achievements.push(`${G.year}.${G.month} 晋升为${getCareerLabel(e.level)}`);
    }
  });
  // 10. Team offers：新邀约与本期内旧邀约合并，同队去重，过期（>2 个月）自动清理
  const offers=generateTeamOffers();
  const offerStamp=logYear*12+logMonth;
  const freshOffers=(G._pendingOffers||[]).filter(o=>o&&o.team&&(!o.stamp||offerStamp-o.stamp<=2)&&(!G.team||o.team!==G.team.id));
  offers.forEach(o=>{o.stamp=offerStamp;});
  const mergedOffers=[];
  const seenOfferTeams=new Set();
  [...offers,...freshOffers].forEach(o=>{
    if(!o||!o.team||seenOfferTeams.has(o.team))return;
    if(G.team&&o.team===G.team.id)return;
    seenOfferTeams.add(o.team);
    mergedOffers.push(o);
  });
  G._pendingOffers=mergedOffers.slice(0,6);
  if(offers.length>0){
    logs.push(G.team?`收到 ${offers.length} 个转会邀约！`:`收到 ${offers.length} 个战队邀约！`);
  }
  // 11. End-of-month stamina: leftover recovery + overdraft report
  const staminaLogs=processEndOfMonthStamina();
  staminaLogs.forEach(l=>logs.push(l));
  logs.push(`体力结算（训练/直播）：消耗 ${G.staminaConsumed.toFixed(0)}，剩余 ${G.stamina.toFixed(0)}，疲劳 ${G.player.fatigue.toFixed(0)}`);
  // 11.6 Injury processing
  const injuryResult=processInjury();
  if(injuryResult){
    if(injuryResult.recovered){
      logs.push(`✅ 伤病恢复：${injuryResult.name} 已痊愈`);
    } else {
      logs.push(`⚠️ 伤病中：${G.injury.name}，还需 ${injuryResult.monthsLeft} 个月`);
    }
  } else if(!G.injury&&Math.random()<0.05){
    triggerInjury();
  }
  // 11.7 Team chemistry update
  if(G.team){
    if(G._newTeammatePending){
      G.teamChemistry=Math.max(0,(G.teamChemistry||50)-3);
      logs.push('🤝 新援磨合期：队伍默契-3');
      delete G._newTeammatePending;
    }
    updateTeamChemistry('training');
    if(matchResult.wins>matchResult.losses){
      updateTeamChemistry('win');
    } else if(matchResult.losses>matchResult.wins){
      updateTeamChemistry('loss');
    }
    // 连胜计数：胜 +1，负清零，平局/无比赛不变化（旧逻辑平局会 -1）
    if(matchResult.wins>matchResult.losses)G._winStreak=(G._winStreak||0)+1;
    else if(matchResult.losses>matchResult.wins)G._winStreak=0;
    if(G._winStreak>=3){
      updateTeamChemistry('winStreak3');
      G._winStreak=0;
      logs.push('🔥 三连胜！队伍默契+5');
    }
    logs.push(`队伍默契：${G.teamChemistry}/100`);
  }
  // 11.8 Fame events
  const fameEvents=checkFameEvents();
  fameEvents.forEach(e=>logs.push(`🌟 ${e.text}`));
  // 12. Age
  if(G.month===12){
    // 年度回顾：在年份递增前捕获刚结束年份的统计
    const endedYear=G.year;
    const ys=G._yearStats;
    if(ys&&(ys.maps>0||ys.series>0)){
      G._yearReviewPending={
        year:endedYear,
        rank:t20rank,
        series:ys.series||0,maps:ys.maps||0,
        wins:ys.wins||0,losses:ys.losses||0,
        winRate:(ys.wins||0)+(ys.losses||0)>0?Math.round((ys.wins||0)/((ys.wins||0)+(ys.losses||0))*100):0,
        avgRating:(ys.maps>0?(ys.ratingSum/ys.maps):0).toFixed(2),
        bestMap:ys.bestMap?ys.bestMap.toFixed(2):'—',
        bestMapOpp:ys.bestMapOpp||'',
        mvps:ys.mvps||0,
      };
    }
    G._yearStats={wins:0,losses:0,series:0,maps:0,ratingSum:0,bestMap:0,bestMapOpp:'',mvps:0};
    rotateTeamEra(); // 队伍纪元轮转：老兵衰退 / 新人上位（第 36 轮）
    G.player.age++;
    G.year++;
    G.month=1;
    logs.push(`年龄增长：${G.player.age}岁`);
    G._pendingOffers=[];
    logs.push(`跨年：旧邀约已清除`);
    const maxPhysical=getMaxPhysical(G.player.age,G.player.physicalCap||85);
    // 简化：体能全年段都向年龄曲线目标靠拢（低于则成长，高于则衰退）
    if(G.player.attrs.physical<maxPhysical){
      const gap=maxPhysical-G.player.attrs.physical;
      const growth=Math.max(0.5,gap*0.1);
      G.player.attrs.physical=Math.min(maxPhysical,G.player.attrs.physical+growth);
      logs.push(`体能成长：${Math.round(G.player.attrs.physical)}/${maxPhysical}`);
    }else if(G.player.attrs.physical>maxPhysical){
      const excess=G.player.attrs.physical-maxPhysical;
      const decline=Math.max(0.5,excess*0.3);
      G.player.attrs.physical=Math.max(maxPhysical,G.player.attrs.physical-decline);
      logs.push(`体能衰退：${Math.round(G.player.attrs.physical)}/${maxPhysical}`);
    }
    if(G.player.age>28){
      const cap=G.player.fourDimCaps?G.player.fourDimCaps.gameSense:null;
      G.player.attrs.gameSense=Math.min(cap||G.player.potential.gameSense,G.player.attrs.gameSense+0.5);
    }
    if(t20rank===1)logs.push(`👑 获得年度 TOP1！`);
    else if(t20rank)logs.push(`🌟 入选年度 TOP20！排名第 ${t20rank} 位`);
    if(t20rank){ // 年度获奖提升心理（第 49 轮）
      const topGain=t20rank===1?3:(t20rank<=5?2:1);
      G.player.attrs.mental=Math.min(G.player.potential.mental,G.player.attrs.mental+topGain);
      logs.push(`🧘 心理 +${topGain}（年度排名荣誉）`);
    }
    // 跨年：年度荣誉桶在 TOP20 判定之后重置
    G._yearHonors={eventMVP:0,eventEVP:0,majorChampion:0,majorRunnerUp:0,majorTop4:0,superEliteChampion:0,tier1Champion:0};
    const ageLogs=processAgeEffects();
    ageLogs.forEach(l=>logs.push(l));
  } else {
    G.month++;
  }
  // 13. Monthly log
  // 第 83 轮：现实赛场回顾并入月度日志（弹窗保留全文，日志留一行摘要以便历史翻查）
  {
    const hl=(typeof MONTHLY_HISTORICAL_HIGHLIGHTS!=='undefined')?(MONTHLY_HISTORICAL_HIGHLIGHTS[`${logYear}-${logMonth}`]||[]):[];
    if(hl.length)logs.push(`📜 现实回顾：${hl.map(h=>h.name).join(' / ')}`);
  }
  G.career.monthlyLog.push(`${logYear}年${logMonth}月 | ${logs.join(' | ')}`);
  // 14. Retirement
  if(G.player.age>=35&&Math.random()<0.3){
    G._retirePromptPending=true;
  }
  if(G.pressure>=95&&G.player.attrs.mental<30&&Math.random()<0.2){
    G._retirePromptPending=true;
  }
  // Build next month's calendar before saving
  G.monthSchedule=null;
  ensureMonthSchedule(false);
  G._advanceActive=false;
  G._advanceStartedAt=0;
  // 年度回顾：跨年捕获已完成（跨年块在本函数步骤 12），注入弹窗链最前
  if(G._yearReviewPending){
    allPopupEvents.unshift({name:`📅 ${G._yearReviewPending.year} 年度回顾`,desc:buildYearReviewText(G._yearReviewPending),type:'historical'});
    G._yearReviewPending=null;
  }
  // 粉丝里程碑：跨阈值弹窗（可能一次跨多个，按从小到大弹出）
  const fanMiles=settleFanMilestones();
  if(fanMiles.length){
    allPopupEvents.unshift(...fanMiles.map(mi=>({name:`✨ 粉丝里程碑：${mi.label}粉`,desc:buildFanMilestoneText(mi),type:'rewrite'})));
  }
  if(!saveGame('autosave',true))logs.push('自动保存失败。当前进度仍在本页面，请打开存档管理重试。');
  const monthOffers=logMonth===12?[]:offers;
  const afterAllPopups=()=>showPendingAchievementsThen(()=>{
    showMonthSummary(logs,matchResult,events,pressureMsg,monthOffers,{year:logYear,month:logMonth});
  });
  if(allPopupEvents.length > 0){
    showEventPopupsSequentially(allPopupEvents, afterAllPopups);
  } else {
    afterAllPopups();
  }
  renderAll();
}


function retire(){
  G.retired=true;
  G.careerLevel='retired';
  G.eventLog.push({text:`${G.player.name} 在 ${G.player.age} 岁时宣布退役。`,type:'neutral',month:G.month,year:G.year});
  G.career.achievements.push(`${G.year}.${G.month} 退役`);
  checkAchievement('retire');
  closeModal();
  showRetirementSummary();
  renderAll();
}

function showRetirementSummary(){

  const bestMapText=bestMap?bestMap.toFixed(2):'—';
  const winRate=c.totalMatches?Math.round(c.wins/c.totalMatches*100):0;

    </div>
    <div class="card">
      <h3>${escapeHtml(G.player.name)}（${escapeHtml(G.player.ign)}）</h3>
      <div class="stat-row"><span class="stat-label">国籍 / 位置</span><span class="stat-value">${G.player.nationality} · ${G.player.role}</span></div>
      <div class="stat-row"><span class="stat-label">职业生涯</span><span class="stat-value">${years} 年（${G.player.age-years}岁 → ${G.player.age}岁）</span></div>
      <div class="stat-row"><span class="stat-label">总比赛</span><span class="stat-value">${c.totalMatches} 场（胜率 ${winRate}%）</span></div>
      <div class="stat-row"><span class="stat-label">生涯平均 Rating</span><span class="stat-value">${c.avgRating}</span></div>
      <div class="stat-row"><span class="stat-label">单场最高 Rating</span><span class="stat-value">${bestMapText}</span></div>
      <div class="stat-row"><span class="stat-label">Major 冠军</span><span class="stat-value">${majors}</span></div>
      <div class="stat-row"><span class="stat-label">残局 1v4 / 1v5</span><span class="stat-value">${G.career.clutch4Count||0} / ${G.career.clutch5Count||0}</span></div>
      <div class="stat-row"><span class="stat-label">比赛 MVP / 赛事 MVP / EVP</span><span class="stat-value">${h.matchMVP||0} / ${h.eventMVP||0} / ${h.eventEVP||0}</span></div>
      <div class="stat-row"><span class="stat-label">TOP20 / TOP1</span><span class="stat-value">${h.top20.length} 次${top20RanksText(h.top20)}${h.top1?' / 🏆':''}</span></div>
      <div class="stat-row"><span class="stat-label">声望 / 市场关注度</span><span class="stat-value">${Math.round(G.fame||0)} / ${Math.round(G.marketAttention||0)}</span></div>

  `);
}

function updateTabVisibility(){
  const level=G.careerLevel;
  const hasTeam=!!G.team;
  const isPro=level==='pro'||level==='benched';
  const hasBeenPro=level==='pro'||level==='benched'||level==='freeAgent';
  const hasBeenSemiPro=hasBeenPro||level==='semiPro';
  // Streaming & Training: always visible (路人阶段)
  // Dashboard: always visible（含路人期）
  // Matches: visible from semiPro+
  // Career: visible from semiPro+
  // Teams: visible from semiPro+
  // Life: visible from pro+
  // History: visible from semiPro+
  const tabs={
    streaming:true,
    training:true,
    dashboard:true,
    matches:true,
    career:hasBeenSemiPro,
    teams:hasBeenSemiPro,
    life:hasBeenPro,
    history:hasBeenSemiPro
  };
  for(let tab in tabs){
    const btn=document.querySelector(`.nav-tab[data-tab="${tab}"]`);
    if(btn)btn.style.display=tabs[tab]?'':'none';
  }
  const activeTab=document.querySelector('.nav-tab.active');
  if(activeTab&&activeTab.style.display==='none'){
    switchTab('streaming');
  }
}

function renderAll(){
  if(!G)return;
  // Top bar
  document.getElementById('g-month').textContent=`${G.year}年${G.month}月`;
  document.getElementById('g-career').textContent=getCareerLabel(G.careerLevel);
  document.getElementById('g-money').textContent=formatMoney(G.money);
  // Update tab visibility
  updateTabVisibility();
  // Render active tab
  const activeTab=document.querySelector('.nav-tab.active')?.dataset.tab||'streaming';
  renderTab(activeTab);
}

function renderTab(tab){
  const el=document.getElementById('tab-'+tab);
  if(!el)return;
  switch(tab){
    case 'streaming':el.innerHTML=renderStreaming();break;
    case 'dashboard':el.innerHTML=renderDashboard();break;
    case 'training':el.innerHTML=renderTraining();break;
    case 'matches':el.innerHTML=renderMatches();break;
    case 'career':el.innerHTML=renderCareer();break;
    case 'teams':el.innerHTML=renderTeamRanking();break;
    case 'life':el.innerHTML=renderLife();break;
    case 'history':el.innerHTML=renderHistory();break;
  }
}

function renderTraining(){
  const p=G.player;
  if(G.training.selected==='consistency')G.training.selected='aim'; // 稳定不再单独开课（第 63 轮）
  const selected=G.training.selected;
  const intensity=G.training.intensity||'moderate';
  const ac=ageCoeff(p.age);
  const fourDims=['aim','utility','communication','gameSense'];
  const t=TRAINING_PARAMS[intensity];
  const isFourDim=fourDims.includes(selected);
  const cap=isFourDim?(p.fourDimCaps?.[selected]||p.potential[selected]):p.potential[selected];
  const atCap=p.attrs[selected]>=cap;
  const sessions=getTrainingSessions();
  const teamTrainingBonus=getTeamBonus().training;
  const coachBonus=G.life&&G.life.coach?1.15:1;
  const effMod=Math.max(0.2,G._trainEffMod||1);
  const isResting=!!(G.injury||G._forcedRest);
  
  // Calculate gain preview（与 processTraining 完全同口径：团队训练加成/私教/事件修正/成长期保底）
  const gap=Math.max(p.age<=28?0.1:0,1-(p.attrs[selected]/cap));
  let perSessionGain=atCap?0:Math.max(p.age<=24?0.1:0,t.stamina*0.25*ac*gap*t.multiplier*effMod*(G['_'+selected+'MotivationMod']||1)*coachBonus*teamTrainingBonus);
  const cappedByAge=p.age>28&&fourDims.includes(selected)&&selected!=='gameSense';
  if(cappedByAge)perSessionGain=0;
  const gainPreview=isResting?0:perSessionGain*sessions;
  
  // 训练在下月开始时结算，此时体力已重置为满值
  const nextMonthStamina=getMonthlyStamina(p.attrs.physical);
  const trainingBudget=getScheduleTrainingCost();

  // 疲劳预览：本月全部训练课的疲劳总和（月末统一恢复）
  const fatiguePreview=isResting?0:+(t.fatigue*getFatigueAgeRate(p.age)*sessions).toFixed(1);
  
  // Check if enough stamina
  const canTrain=!isResting&&nextMonthStamina>=trainingBudget;
  
  return `
    <div class="card">
      <h3>🏋️ 训练方向（四维基础属性）</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px">选择训练方向，提升四维基础属性。稳定性随四维训练自然提升，不单独开课。</p>
      ${TRAIN_TYPES.filter(t=>fourDims.includes(t.attr)).map(t=>{
        const tCap=p.fourDimCaps?.[t.attr]||p.potential[t.attr];
        const tAtCap=p.attrs[t.attr]>=tCap;
        return `
        <div class="train-option ${selected===t.key?'selected':''}" onclick="trainAttribute('${t.key}')">
          <div>
            <div class="train-name">${t.icon} ${t.name}</div>
            <div class="train-info">${t.desc} | 当前 ${Math.round(p.attrs[t.attr])}/${Math.round(tCap)}${tAtCap?' <span style="color:var(--red)">[瓶颈]</span>':''}</div>
          </div>
          <div>
            ${selected===t.key?'<span class="badge badge-green">已选择</span>':''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <h3>🎚️ 训练强度（下月可用体力：${Math.round(nextMonthStamina)}）</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:8px">训练在进入下月时优先结算体力；比赛每系列赛耗 4 点、开直播每月耗 15 点，同一份体力竞争。</p>
      <div style="display:flex;gap:8px;margin:12px 0">
        <button class="${intensity==='high'?'btn-primary':'btn-secondary'}" onclick="setTrainingIntensity('high')" style="flex:1">
          🔥 高强度<br><span style="font-size:11px">每课 ${TRAINING_PARAMS.high.stamina} 体力 × ${sessions} 课 | 能力 ×${TRAINING_PARAMS.high.multiplier}</span>
        </button>
        <button class="${intensity==='moderate'?'btn-primary':'btn-secondary'}" onclick="setTrainingIntensity('moderate')" style="flex:1">
          ⚖️ 适量<br><span style="font-size:11px">每课 ${TRAINING_PARAMS.moderate.stamina} 体力 × ${sessions} 课 | 能力 ×${TRAINING_PARAMS.moderate.multiplier}</span>
        </button>
        <button class="${intensity==='light'?'btn-primary':'btn-secondary'}" onclick="setTrainingIntensity('light')" style="flex:1">
          🌿 轻度<br><span style="font-size:11px">每课 ${TRAINING_PARAMS.light.stamina} 体力 × ${sessions} 课 | 能力 ×${TRAINING_PARAMS.light.multiplier}</span>
        </button>
      </div>
      ${G._forcedRest?`<div style="font-size:13px;color:var(--yellow);margin-top:8px">🛌 本月处于强制休息期，训练暂停（不消耗体力）。</div>`
      :G.injury?`<div style="font-size:13px;color:var(--red);margin-top:8px">🤕 伤病中（${G.injury.name}），训练暂停。</div>`
      :!canTrain?`<div style="font-size:13px;color:var(--red);margin-top:8px">⚠ 下月体力不足以完成当前训练计划（需 ${trainingBudget} 点，可用 ${Math.round(nextMonthStamina)} 点）</div>`:''}
      ${atCap?`<div style="font-size:13px;color:var(--red);margin-top:8px">⚠ ${ATTR_SHORT[selected]} 已达上限，训练无法提升。${p.hasHitCapBefore?'比赛中可能触发「超越极限」事件。':''}</div>`
      :cappedByAge?`<div style="font-size:13px;color:var(--red);margin-top:8px">🧓 ${ATTR_SHORT[selected]} 已生理定型（29 岁后枪法/道具/沟通无法再练）。老将靠意识和经验立足。</div>`
      :`<div style="font-size:12px;color:var(--text2);margin-top:8px">预计本月提升：<span style="color:var(--green);font-weight:600">+${gainPreview.toFixed(2)}</span>（每课 +${perSessionGain.toFixed(2)} × ${sessions} 课，已含团队/私教/事件加成） | 疲劳：<span style="color:${fatiguePreview>0?'var(--red)':'var(--green)'};font-weight:600">${fatiguePreview>0?'+':''}${fatiguePreview}</span></div>`}
      <div style="font-size:11px;color:var(--text2);margin-top:8px;opacity:0.8">💡 月末恢复疲劳：基础 ${RECOVERY_PARAMS.baseFlat} + 体能×${RECOVERY_PARAMS.baseRate} + 剩余体力每 ${RECOVERY_PARAMS.surplusPer} 点 1；休整月（训练≤4小时）额外 -30%；疲劳会挤占下月体力（疲劳 50 ≈ -25%）</div>
    </div>
  `;
}

// ============================================================
// MONTH CALENDAR GRID（第 56 轮：日历网格 + 下月预告 + 体力热度 + 预选晋级关联）
// ============================================================
const CAL_TIER_COLOR={major:'#a855f7',superElite:'#a855f7',tier1:'#3b82f6',tier2:'#eab308',qualifier:'#22c55e',league:'#94a3b8'};
function calEventDay(e){ // 稳定起始日：自带 day 用之，否则名字哈希落 3..27（跨刷新不变）
  if(e.event&&e.event.day)return Math.min(28,Math.max(1,e.event.day));
  let h=0;const n=e.name||'';
  for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
  return 3+(h%25);
}
function calEventSpan(e){ // 赛事持续多日：按真实赛史（第 59 轮核实 Liquipedia/ESL 官方）分纪元 + 名字哈希取值
  const y=G.year,n=e.name||'';
  let range;
  if(e.tier==='major')range=y<=2016?[3,4]:(y<=2017?[7,8]:[13,15]); // 早期 Major 3-4 天→2017 过渡 7-8 天→现代 2 周（如 Copenhagen 3/17-31）
  else if(e.tier==='superElite')range=y<2020?[3,6]:[11,12]; // 早期 IEM 3-6 天→现代 Katowice/Cologne 12 天（1/29-2/9、8/7-18）
  else if(e.tier==='tier1')range=(y>=2020&&/Pro League/.test(n))?[15,18]:(y<2020?[3,6]:[6,10]); // 现代三周 EPL 15-18 天，其余 6-10 天（IEM Dallas 7 天等）
  else if(e.tier==='tier2')range=[2,3]; // DreamHack Open/ESL Challenger 周五-周日
  else if(e.tier==='tier3'||e.tier==='qualifier')range=[2,2];
  else range=[1,1];
  let h=0;
  for(let i=0;i<n.length;i++)h=(h*131+n.charCodeAt(i))>>>0;
  return range[0]+(h%(range[1]-range[0]+1));
}
function calDateRange(e){const dim=new Date(G.year,G.month,0).getDate(),d=calEventSpan(e),s=Math.min(calEventDay(e),dim-d+1);return `<span style="font-size:11px;color:var(--text2)">${s}–${s+d-1}日</span>`;} // 明细行日期区间（长赛事钳制落月，第 60 轮）
function calEventHue(name){ // 课表专属色：名字哈希→色相（第 60 轮）
  let h=0;const n=name||'';
  for(let i=0;i<n.length;i++)h=(h*137+n.charCodeAt(i))>>>0;
  return h%360;
}
function isTourLan(e){ // 线下赛判定：Major/超级精英/S级/A级（B级以下与预选赛为线上）
  return e.tier==='major'||e.tier==='superElite'||e.tier==='tier1'||e.tier==='tier2';
}
function calRangeOf(e,dim){ // 课表时间块 [起,止日]
  let start=calEventDay(e);
  const dur=calEventSpan(e);
  if(start+dur-1>dim)start=Math.max(1,dim-dur+1);
  return [start,Math.min(dim,start+dur-1)];
}
function findLanConflicts(){ // 线下赛撞档检测：已报名 LAN 时间块重叠（不同主办方撞档，以真实赛历为准，同时只能参加一场）
  const s=ensureMonthSchedule();
  const dim=new Date(s.year,s.month,0).getDate();
  const lans=s.events.filter(e=>e.kind==='event'&&isTourLan(e)&&e.registered).map(e=>({e,r:calRangeOf(e,dim)}));
  const pairs=[];
  for(let i=0;i<lans.length;i++)for(let j=i+1;j<lans.length;j++){
    const a=lans[i],b=lans[j];
    if(a.r[0]<=b.r[1]&&b.r[0]<=a.r[1])pairs.push([a.e,b.e]);
  }
  return pairs;
}
function buildMonthCalendar(schedule){
  const y=schedule.year,m=schedule.month;
  const dim=new Date(y,m,0).getDate();
  const off=(new Date(y,m-1,1).getDay()+6)%7; // 周一为首列
  const cells=[];for(let d=1;d<=dim;d++)cells.push({d,st:0,items:[]});
  const confNames=new Set();findLanConflicts().forEach(p=>{confNames.add(p[0].name);confNames.add(p[1].name);}); // 线下赛撞档集合（第 60 轮）
  schedule.events.forEach(e=>{
    let start=calEventDay(e);
    const dur=calEventSpan(e);
    if(start+dur-1>dim)start=Math.max(1,dim-dur+1); // 长赛事（现代 Major/EPL）起始日前移，整段落月
    const st=Math.round(e.estStamina||0);
    const per=st/dur; // 体力按天分摊（第 57 轮）
    for(let d=start;d<start+dur&&d<=dim;d++){
      const c=cells[d-1];if(!c)break;
      c.st+=per;
      c.items.push({name:e.name,kind:e.kind,tier:e.tier,color:CAL_TIER_COLOR[e.tier]||CAL_TIER_COLOR.tier2,st:per,cont:d>start,q:e.event&&e.event.isQualifier?e.event:null,range:start+"–"+Math.min(dim,start+dur-1)+"日",conflict:confNames.has(e.name)&&isTourLan(e)});
    }
  });
  const peak=Math.max(1,...cells.map(c=>c.st));
  const heat=c=>{if(!c.st)return"";const t=Math.min(1,c.st/Math.max(G.staminaMax*0.35,peak*0.6));return `background:rgba(229,72,77,${(0.10+t*0.35).toFixed(2)});`;};
  let rows='';
  for(let r=0;r<6;r++){
    rows+='<tr>';
    for(let col=0;col<7;col++){
      const idx=r*7+col-off;
      if(idx<0||idx>=dim){rows+='<td style="border:none"></td>';continue;}
      const c=cells[idx];
      const chips=c.items.map(it=>{const hue=calEventHue(it.name);const lan=isTourLan({tier:it.tier});const bar=lan?`border-left:3px solid hsla(${hue},70%,55%,.95);padding-left:3px;background:hsla(${hue},70%,50%,.16);border-radius:2px;`:'';
return `<div title=\"${it.conflict?'⚠️ 撞档 · ':''}${it.name}（${TOUR_TIER_LABEL[it.tier]||it.tier} · ${it.range}）${it.q?` → 晋级 ${it.q.qualifiesFor}（${it.q.qualifiesForMonth}月）`:''} · 本日体力 ${Math.round(it.st)}\" style=\"font-size:10px;line-height:1.35;color:${it.color};${bar}white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${it.cont?'opacity:.55;':''}\">${it.cont?'↳ ':(it.kind==='league'?'🎯':'🏆')+' '}${it.conflict?'⚠️ ':''}${it.name}</div>`;}).join('');
      rows+=`<td style="border:1px solid var(--border);vertical-align:top;padding:3px 4px;${heat(c)}"><div style="font-size:10px;color:var(--text2);margin-bottom:2px">${c.d}${c.st?` <span style="color:var(--red)">⚡${Math.round(c.st)}</span>`:''}</div>${chips}</td>`;
    }
    rows+='</tr>';
  }
  return `<table style="width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:4px">

function leaveTeam(){
  if(!G.team)return;
  if(G.team.contract.remaining>0){
    const buyout=contractBuyout(G.team.contract);
    if(G.money<buyout){
      showToast(`买断费 ${formatMoney(buyout)} 不足`,'error');
      return;
    }
    if(!confirm(`确定离开 ${G.team.name}？需支付 ${formatMoney(buyout)} 买断费。`))return;
    G.money-=buyout;
    G.eventLog.push({text:`支付 ${formatMoney(buyout)} 离开 ${G.team.name}`,type:'negative',month:G.month,year:G.year});
  } else {
    if(!confirm(`确定离开 ${G.team.name}？`))return;
    G.eventLog.push({text:`合同到期，离开 ${G.team.name}`,type:'neutral',month:G.month,year:G.year});
  }
  closeTeamHistoryEntry();
  G.team=null;
  G.careerLevel='freeAgent';
  ensureMonthSchedule(false);
  saveGame('autosave',true);
  renderAll();
}

      </div>
      <div class="life-slider">
        <label><span>🏃 健身时间</span><span id="life-fitness-val">${l.fitness}h/天</span></label>
        <input type="range" min="0" max="5" value="${l.fitness}" oninput="onLifeSliderInput('fitness',this.value)" onchange="onLifeSliderCommit()">

    <div class="card">
      <h3>❤️ 身心状态</h3>
      <div class="stat-row"><span class="stat-label">疲劳度</span><span class="stat-value" style="color:${p.fatigue>70?'var(--red)':p.fatigue>40?'var(--yellow)':'var(--green)'}">${Math.round(p.fatigue)}/100</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.fatigue}%;background:${p.fatigue>70?'var(--red)':p.fatigue>40?'var(--yellow)':'var(--green)'}"></div></div>
      <div class="stat-row"><span class="stat-label">心态</span><span class="stat-value" style="color:${p.mentalState>60?'var(--green)':p.mentalState>30?'var(--yellow)':'var(--red)'}">${Math.round(p.mentalState)}/100</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.mentalState}%;background:${p.mentalState>60?'var(--green)':p.mentalState>30?'var(--yellow)':'var(--red)'}"></div></div>
      <div class="stat-row"><span class="stat-label">体能</span><span class="stat-value">${Math.round(p.attrs.physical)}/100</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.attrs.physical}%;background:var(--blue)"></div></div>

      <h3>💡 状态提示</h3>
      <div style="font-size:13px;color:var(--text2);line-height:1.8">

        ${p.mentalState<30?'<p style="color:var(--red)">⚠️ 心态低落！建议增加娱乐和休息。</p>':''}
        ${p.fatigue<30&&p.mentalState>60?'<p style="color:var(--green)">✅ 状态良好，适合高强度训练。</p>':''}
        ${l.training>10&&l.rest<4?'<p style="color:var(--yellow)">⚠️ 训练过度而休息不足，注意伤病风险！</p>':''}

}

function renderHistory(){
  const achievements=G.career.achievements;
  const events=G.eventLog.slice(-30).reverse();
  return `
    <div class="card">
      <h3>🏆 职业成就</h3>
      ${achievements.length===0?'<div class="empty-state">暂无成就</div>':
      achievements.map(a=>`<div class="log-entry positive">• ${escapeHtml(a)}</div>`).join('')}
    </div>
    <div class="card">
      <h3>📜 职业日志</h3>
      ${events.length===0?'<div class="empty-state">暂无日志</div>':
      events.map(e=>`<div class="log-entry ${e.type}">[${e.year}.${e.month}] ${escapeHtml(e.text)}</div>`).join('')}
    </div>
    <div class="card">
      <h3>📅 月度总结</h3>
      ${G.career.monthlyLog.slice(-12).reverse().map(l=>`<div class="log-entry">${escapeHtml(l)}</div>`).join('')}
    </div>
  `;
}

function renderTeamRanking(){
  const rosters=getTeamRostersByYear(G.year);
  const teams=Object.values(rosters);
  const tiers=[
    {key:'topTier',label:'🏆 顶级',badge:'purple'},
    {key:'tier1',label:'⭐ 一线',badge:'blue'},
    {key:'tier2',label:'📋 二线',badge:'yellow'},
    {key:'tier3',label:'🌱 三线',badge:'green'}
  ];
  let html='';
  // Current team section
  if(G.team&&G.team.roster&&G.team.roster.length>0){
    html+=`<div class="card" style="border-color:var(--accent)"><h3>👥 我的队伍 - ${G.team.name}</h3>`;
    html+=`<div class="stat-row"><span class="stat-label">等级</span><span class="stat-value">${getTierLabel(G.team.tier)}</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${G.team.region}</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">位置</span><span class="stat-value">${G.team.isStarter?'★ 首发':'🪑 替补'}</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">默契</span><span class="stat-value">${G.teamChemistry}/100</span></div>`;
    html+=`<table style="width:100%;font-size:13px;margin-top:12px">`;
    html+=`<tr style="color:var(--text2)"><th style="text-align:left;padding:6px">选手</th><th style="text-align:left">位置</th><th style="text-align:center">枪法</th><th style="text-align:center">道具</th><th style="text-align:center">沟通</th><th style="text-align:center">意识</th><th style="text-align:center">OVR</th></tr>`;
    getMyLineupForMatch(G.team.isStarter).forEach(p=>{
      const highlight=p.isPlayer?'style="background:rgba(255,107,53,.15)"':'';
      const name=p.isPlayer?`<strong>${p.name} (你)</strong>`:p.name;
      html+=`<tr ${highlight}>
        <td style="padding:6px;font-weight:500">${name}</td>
        <td style="color:var(--text2)">${p.role}</td>
        <td style="text-align:center">${Math.round(p.aim)}</td>
        <td style="text-align:center">${Math.round(p.utility)}</td>
        <td style="text-align:center">${Math.round(p.communication)}</td>
        <td style="text-align:center">${Math.round(p.gameSense)}</td>
        <td style="text-align:center;font-weight:700;color:var(--accent)">${Math.round((p.aim+p.utility+p.communication+p.gameSense)/4)}</td>
      </tr>`;
    });
    html+=`</table></div>`;
  } else if(G.team){
    html+=`<div class="card" style="border-color:var(--accent)"><h3>👥 我的队伍 - ${G.team.name}</h3>`;
    html+=`<div class="stat-row"><span class="stat-label">等级</span><span class="stat-value">${getTierLabel(G.team.tier)}</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">默契</span><span class="stat-value">${G.teamChemistry}/100</span></div>`;
    html+=`<p style="font-size:12px;color:var(--text2);margin-top:8px">阵容数据加载中...</p></div>`;
  }
  // 世界积分排名（第 35 轮：公开积分榜，暗实力/档位不显示）
  const ptsList=getSortedPointsList();
  const rankMap=rosterMapByYear(G.year);
  html+='<div class="card"><h3>🌍 世界积分排名</h3><p style="font-size:12px;color:var(--text2);margin-bottom:12px">赛事邀请与抽签依据 · 点击队伍查看阵容</p>';
  ptsList.forEach((x,idx)=>{
    const cur=Math.round(x.pts);
    const delta=x.prev!==undefined?cur-x.prev:null;
    const trend=delta===null?'':delta>0?` <span style="color:var(--green);font-size:11px">▲${delta}</span>`:delta<0?` <span style="color:var(--red);font-size:11px">▼${-delta}</span>`:`<span style="color:var(--text2);font-size:11px"> –</span>`;
    const tid=rankMap[x.name];
    const hl=x.isOwn?'background:rgba(255,107,53,.12);':'';
    const hover=x.isOwn?'rgba(255,107,53,.18)':'var(--bg)';
    const leave=x.isOwn?'rgba(255,107,53,.12)':'transparent';
    const clickAttrs=tid?` onclick="showTeamDetail('${tid}')" onmouseover="this.style.background='${hover}'" onmouseout="this.style.background='${leave}'"`:'';
    html+=`<div class="stat-row" style="${hl}cursor:pointer;padding:8px;border-radius:6px;transition:background 0.2s"${clickAttrs}><span style="width:28px;color:var(--text2);font-weight:600">${idx+1}</span><span style="font-weight:${x.isOwn?'700':'500'}">${x.name}${x.isOwn?' (你)':''}</span><span style="font-size:12px">${cur} 分${trend}</span></div>`;
  });
  html+='</div>';
  return html;
}

function calculateHonorPoints(honors){
  if(!honors)return 0;
  return (honors.majorWin||0)*100+(honors.majorFinal||0)*60+(honors.superEliteWin||0)*50+(honors.tier1Win||0)*30+(honors.tier2Win||0)*15;
}

function showTeamDetail(teamId){
  const rosters=getTeamRostersByYear(G.year);
  const team=rosters[teamId];
  if(!team)return;
  const ptsNow=G.teamPoints&&G.teamPoints[team.name]?Math.round(G.teamPoints[team.name].pts):0;
  let html=`<h2>🏆 ${team.name}</h2>`;
  html+=`<p style="color:var(--text2);font-size:13px;margin-bottom:16px">${team.region} · 积分 ${ptsNow}</p>`;
  html+=`<div class="card"><h3>👥 首发阵容</h3><table style="width:100%;font-size:13px">`;
  html+=`<tr style="color:var(--text2)"><th style="text-align:left;padding:6px">选手</th><th style="text-align:left">位置</th><th style="text-align:center">枪法</th><th style="text-align:center">道具</th><th style="text-align:center">沟通</th><th style="text-align:center">意识</th><th style="text-align:center">OVR</th></tr>`;
  team.players.forEach(p=>{
    html+=`<tr>
      <td style="padding:6px;font-weight:500">${p.name}</td>
      <td style="color:var(--text2)">${p.role}</td>
      <td style="text-align:center;color:${p.aim>=90?'var(--green)':p.aim>=75?'var(--yellow)':'var(--text2)'}">${p.aim}</td>
      <td style="text-align:center;color:${p.utility>=90?'var(--green)':p.utility>=75?'var(--yellow)':'var(--text2)'}">${p.utility}</td>
      <td style="text-align:center;color:${p.communication>=90?'var(--green)':p.communication>=75?'var(--yellow)':'var(--text2)'}">${p.communication}</td>
      <td style="text-align:center;color:${p.gameSense>=90?'var(--green)':p.gameSense>=75?'var(--yellow)':'var(--text2)'}">${p.gameSense}</td>
      <td style="text-align:center;font-weight:700;color:${p.aim>=90?'var(--accent)':'var(--text)'}">${Math.round((p.aim+p.utility+p.communication+p.gameSense)/4)}</td>
    </tr>`;
  });
  html+=`</table></div>`;
  if(team.honors){
    const h=team.honors;
    html+=`<div class="card"><h3>🏆 荣誉</h3>`;
    if(h.majorWin)html+=`<div class="stat-row"><span>Major 冠军</span><span class="stat-value">× ${h.majorWin}</span></div>`;
    if(h.majorFinal)html+=`<div class="stat-row"><span>Major 亚军</span><span class="stat-value">× ${h.majorFinal}</span></div>`;
    if(h.superEliteWin)html+=`<div class="stat-row"><span>超级精英赛 冠军</span><span class="stat-value">× ${h.superEliteWin}</span></div>`;
    if(h.tier1Win)html+=`<div class="stat-row"><span>一线赛 冠军</span><span class="stat-value">× ${h.tier1Win}</span></div>`;
    if(h.tier2Win)html+=`<div class="stat-row"><span>二线赛 冠军</span><span class="stat-value">× ${h.tier2Win}</span></div>`;
    html+=`<div class="stat-row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-weight:600">荣誉积分</span><span class="stat-value" style="color:var(--accent)">${calculateHonorPoints(h)}</span></div>`;
    html+=`</div>`;
  }
  if(G.player){
    const playerAvg=Math.round((G.player.attrs.aim+G.player.attrs.utility+G.player.attrs.communication+G.player.attrs.gameSense)/4);
    const teamAvg=Math.round(team.players.reduce((s,p)=>s+(p.aim+p.utility+p.communication+p.gameSense)/4,0)/5);
    html+=`<div class="card"><h3>📊 你对比 ${team.name}</h3>`;
    html+=`<div class="stat-row"><span>你的实力</span><span class="stat-value" style="color:${playerAvg>=teamAvg?'var(--green)':'var(--red)'}">${playerAvg}</span></div>`;
    html+=`<div class="stat-row"><span>队伍平均</span><span class="stat-value">${teamAvg}</span></div>`;
    const diff=playerAvg-teamAvg;
    html+=`<div style="margin-top:8px;font-size:12px;color:${diff>=0?'var(--green)':'var(--yellow)'}">`;
    if(diff>=10)html+=`✅ 你的实力超过该队平均水平，可以胜任首发！`;
    else if(diff>=0)html+=`⚠️ 你接近该队平均水平，可能作为替补或边缘首发。`;
    else html+=`❌ 你与该队有差距，需要继续提升实力。`;
    html+=`</div></div>`;
  }
  html+=`<div class="modal-buttons"><button class="btn-primary" onclick="closeModal()">关闭</button></div>`;
  showModal(html);
}

function showModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('active');
}

function renderMonthlyHistoricalHighlights(year,month){
  const highlights=MONTHLY_HISTORICAL_HIGHLIGHTS[`${year}-${month}`]||[];
  return highlights.map(({name,desc,source})=>`<div class="event-text"><strong>${name}</strong><br>${desc} <a href="${source}" target="_blank" rel="noopener noreferrer" style="color:var(--accent2)">HLTV 报道</a></div>`).join('');
}

function showMonthSummary(logs,matchResult,events,pressureMsg,offers,period){
  const p=G.player;
  const py=period?period.year:G.year;
  const pm=period?period.month:G.month;
  let html=`<h2>📅 ${py}年${pm}月 结算</h2>`;
  html+=`<div class="card"><h3>📊 本月概要</h3>`;
  logs.forEach(l=>html+=`<div class="log-entry">${l}</div>`);
  const monthlyHistory=renderMonthlyHistoricalHighlights(py,pm);
  if(monthlyHistory){
    html+=`<h3>📜 现实赛场回顾</h3>${monthlyHistory}`;
  }
  html+=`</div>`;
  html+=`<div class="card"><h3>🎮 比赛结果</h3>`;
  html+=`<div class="stat-row"><span class="stat-label">系列赛战绩</span><span class="stat-value">${matchResult.wins}胜 ${matchResult.losses}负（${matchResult.seriesCount||0} 个系列赛）</span></div>`;
  const rl=getRatingLabel(matchResult.avgRating);
  html+=`<div class="stat-row"><span class="stat-label">地图平均Rating</span><span class="stat-value" style="color:${rl.color}">${matchResult.avgRating} (${rl.label})</span></div>`;
  html+=`<div class="stat-row"><span class="stat-label">出场地图</span><span class="stat-value">${matchResult.mapCount||0} 张</span></div>`;
  html+=`<div class="stat-row"><span class="stat-label">体力消耗</span><span class="stat-value">${Math.round(G.staminaConsumed)} / 上限 ${Math.round(G.staminaMax)}</span></div>`;
  html+=`</div>`;
  // 天梯战绩（第 68 轮）：天梯单独成表——三线队看这栏，二线及以上只看上面的比赛数据
  const ladderRep=matchResult.ladder;
  if(ladderRep&&ladderRep.series>0){
    const rl2=getRatingLabel(ladderRep.avgRating);
    const ladAll=G.career.ladderRating||0;
    const ladN=G.career.ladderMatches||0;
    const ladW=G.career.ladderWins||0;
    const ladL=G.career.ladderLosses||0;
    const recent5=getRecentLadderAvgRating(5);
    const scout=recent5>0.95;
    html+=`<div class="card"><h3>🎯 天梯战绩</h3>`;
    html+=`<div class="stat-row"><span class="stat-label">本月天梯</span><span class="stat-value">${ladderRep.series} 场（${ladderRep.wins}胜 ${ladderRep.losses}负）</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">本月均分Rating</span><span class="stat-value" style="color:${rl2.color}">${ladderRep.avgRating} (${rl2.label})</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">累计天梯</span><span class="stat-value">${ladN} 场（${ladW}胜 ${ladL}负）· 均分 ${ladAll}</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">近 5 场天梯均分</span><span class="stat-value" style="color:${scout?'var(--green)':'var(--text2)'}">${recent5.toFixed(2)}${scout?' · 三线队球探在关注':''}</span></div>`;
    html+=`<div style="font-size:12px;color:var(--text2);margin-top:6px">天梯不计入正式战绩：三线队会看天梯表现，二线队及以上只看正式比赛数据。</div>`;
    html+=`</div>`;
  }
  if(matchResult.events&&matchResult.events.length>0){
    html+=`<div class="card"><h3>🏆 赛事战报</h3>`;
    matchResult.events.forEach(ev=>{
      const res=ev.result||{};
      if(res.qualified===false){
        html+=`<div class="stat-row"><span class="stat-label">${ev.name}</span><span class="stat-value" style="color:var(--red)">未获资格</span></div>`;
      }else{
        const rounds=(res.rounds||[]).map(r=>`${r.stage} vs ${r.opponent} ${r.score}`).join('；');
        html+=`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="font-weight:600">${ev.name} <span class="badge badge-purple">${PLACEMENT_TEXT[res.placement]||'参赛'}</span></div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px">${rounds||'无出场'}</div>
          ${res.mapsText?`<div style="font-size:12px;color:var(--text2);margin-top:2px">地图：${res.mapsText}</div>`:''}
        </div>`;
      }
    });
    html+=`</div>`;
  }
  if(events.length>0){
    html+=`<div class="card"><h3>🎲 随机事件</h3>`;
    events.forEach(e=>html+=`<div class="event-text"><strong>${e.name}</strong><br>${e.desc}<br><span style="color:var(--accent2)">${e.effects.join('，')}</span></div>`);
    html+=`</div>`;
  }
  html+=`<div class="card"><h3>🧠 压力状态</h3><p style="color:${pressureMsg.type==='positive'?'var(--green)':pressureMsg.type==='negative'?'var(--red)':'var(--text2)'}">${pressureMsg.msg}</p></div>`;
  if(offers&&offers.length>0){
    const offerTitle=G.team?'📨 转会邀约':'📨 战队邀约';
    const offerDesc=G.team?'有战队想签下你！接受将自动买断当前合同（费用由新战队承担）。':'有战队对你感兴趣！';
    html+=`<div class="card" style="border-color:var(--accent)"><h3>${offerTitle}</h3><p style="color:var(--text2);margin-bottom:12px;font-size:13px">${offerDesc}</p>`;
    offers.forEach((o,i)=>{
      const rosters=getTeamRostersByYear(G.year);
      const teamId=Object.keys(rosters).find(k=>rosters[k].name===o.teamName);
      html+=`
        <div class="contract-card">
          <h4>${o.teamName} <span class="badge badge-${o.teamTier==='topTier'?'purple':o.teamTier==='tier1'?'blue':'yellow'}">${getTierLabel(o.teamTier)}</span>${o.special?' <span class="badge badge-blue">🤝 旧队友</span>':''}${o.worldRank?` <span class="badge badge-gray">🌍 积分第 ${o.worldRank}</span>`:''}</h4>
          <div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${o.teamRegion}</span></div>
          <div class="stat-row"><span class="stat-label">月薪</span><span class="stat-value" style="color:var(--green)">${formatMoney(o.salary)}</span></div>
          <div class="stat-row"><span class="stat-label">合同</span><span class="stat-value">${o.contractLength}个月</span></div>
          <div class="stat-row"><span class="stat-label">位置</span><span class="stat-value">${o.isStarter?'★ 首发':'🪑 替补'}</span></div>
          <div style="margin-top:10px;text-align:right">
            ${teamId?`<button class="btn-secondary btn-small" onclick="showTeamDetail('${teamId}')" style="margin-right:4px">详情</button>`:''}
            <button class="btn-primary btn-small" onclick="showNegotiationModal(G._pendingOffers[${i}])" style="margin-right:4px">谈判</button>
            <button class="btn-success btn-small" onclick="acceptOffer(G._pendingOffers[${i}])">接受</button>
          </div>
        </div>
      `;
    });
    html+=`</div>`;
  }
  html+=`<div class="modal-buttons"><button class="btn-primary" onclick="closeMonthSummary()">确认</button></div>`;
  showModal(html);
}

function closeMonthSummary(){

  if(G&&G._retirePromptPending){
    G._retirePromptPending=false;
    suggestRetirement();

}

function showSaveSlots(){
  const saves=[];
  for(let i=0;i<3;i++){
    const key='cs_career_save_'+i;
    const data=localStorage.getItem(key);
    if(data){
      try{
        const parsed=JSON.parse(data);
        saves.push({slot:i,name:escapeHtml(parsed.player?.name||'Unknown'),date:parsed.savedAt||'未知',level:getCareerLabel(parsed.careerLevel||'amateur'),year:parsed.year,month:parsed.month});
      }catch(e){saves.push({slot:i,empty:true})}
    } else {
      saves.push({slot:i,empty:true});
    }
  }
  // Check autosave
  const auto=localStorage.getItem('cs_career_autosave');
  let autoInfo=null;
  if(auto){
    try{
      const parsed=JSON.parse(auto);
      autoInfo={name:escapeHtml(parsed.player?.name),year:parsed.year,month:parsed.month,level:getCareerLabel(parsed.careerLevel||'amateur')};
    }catch(e){}
  }
  let html=`<h2>💾 存档管理</h2>`;
  if(autoInfo){
    html+=`<div class="save-slot" onclick="loadGame('autosave')"><div><strong>自动存档</strong><br><span class="save-slot-info">${autoInfo.name} | ${autoInfo.year}年${autoInfo.month}月 | ${autoInfo.level}</span></div><div><button class="btn-success btn-small" onclick="event.stopPropagation();loadGame('autosave')" style="margin-right:4px">读取</button><button class="btn-danger btn-small" onclick="event.stopPropagation();deleteSaveSlot('autosave')">删除</button></div></div>`;
  }
  saves.forEach(s=>{
    if(s.empty){
      html+=`<div class="save-slot" onclick="saveGame(${s.slot})"><div><strong>存档位 ${s.slot+1}</strong><br><span class="save-slot-info">空</span></div><span class="badge badge-blue">保存</span></div>`;
    } else {
      html+=`<div class="save-slot"><div><strong>存档位 ${s.slot+1}</strong><br><span class="save-slot-info">${s.name} | ${s.year}年${s.month}月 | ${s.level}</span></div><div><button class="btn-success btn-small" onclick="loadGame(${s.slot})" style="margin-right:4px">读取</button><button class="btn-primary btn-small" onclick="saveGame(${s.slot})" style="margin-right:4px">覆盖</button><button class="btn-danger btn-small" onclick="deleteSaveSlot(${s.slot})">删除</button></div></div>`;
    }
  });
  html+=`<div class="modal-buttons"><button class="btn-secondary" onclick="closeModal()">关闭</button></div>`;
  showModal(html);
}

function deleteSaveSlot(slot){
  if(!confirm('确定删除这个存档吗？删除后无法恢复。'))return;
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  localStorage.removeItem(key);
  showToast('存档已删除','info');
  showSaveSlots();
}

function persistGame(silent){
  return saveGame('autosave',silent);
}
function saveGame(slot,silent){
  if(!G){showToast('没有可保存的游戏','error');return false;}
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  try{
    const data={...G,savedAt:new Date().toLocaleString()};
    localStorage.setItem(key,JSON.stringify(data));
  }catch(error){
    showToast('存档写入失败，当前进度仍在此页面。请保留页面并重试保存。','error');
    return false;
  }
  if(!silent){
    showToast('保存成功！','success');
    if(document.getElementById('modal-overlay').classList.contains('active'))showSaveSlots();
  }
  return true;
}

function migrateSavedResults(){
  if(G.rulesVersion===2)return;
  const shifts=new Map();
  if(G.version==='1.1'){
    const decemberRanks=new Map();
    for(const log of G.career.monthlyLog){
      const date=/^(\d+)年12月\s*\|/.exec(log);
      if(!date)continue;
      const rank=log.includes('获得年度 TOP1！')?1:Number(/入选年度 TOP20！排名第 (\d+) 位/.exec(log)?.[1]||0);
      if(rank)decemberRanks.set(Number(date[1]),rank);
    }
    for(const award of G.honors.top20){
      if(award?.year&&decemberRanks.get(award.year-1)===award.rank)shifts.set(award.year,award.year-1);
    }
  }
  const correctedYear=year=>shifts.get(year)||year;
  G.honors=G.honors||{};
  G.honors.top20=(G.honors.top20||[]).map(award=>award?.year?{...award,year:correctedYear(award.year)}:award);
  G.career=G.career||{};
  G.career.achievements=(G.career.achievements||[]).map(text=>
    text.replace(/^(\d+)(?= HLTV TOP(?:20|1)\b| HLTV TOP1！)/,year=>String(correctedYear(Number(year)))));
  if(G._top20RankYear)G._top20RankYear=correctedYear(G._top20RankYear);
  if(G._top1Years)G._top1Years=[...new Set(G._top1Years.map(correctedYear))];

  const outcomes=G._majorOutcomes=G._majorOutcomes||{};
  const ordinal=(year,month)=>year*12+month;
  const tenureDate=date=>{
    const [year,month]=String(date||'').split('.').map(Number);
    return ordinal(year,month);
  };
  for(const event of G.tournamentResults||[]){
    if(event.tier!=='major'||!event.year||!event.month||!event.placement)continue;
    const key=getMajorKey(event,event.year);
    if(outcomes[key])continue;
    const final=Array.isArray(event.maps)?event.maps.find(round=>round.stage==='决赛'):null;
    const date=ordinal(event.year,event.month);
    const tenure=(G._teamHistory||[]).find(t=>tenureDate(t.from)<date&&(!t.to||tenureDate(t.to)>=date));
    outcomes[key]={year:event.year,month:event.month,placement:event.placement,opponent:final?.opponent||null,team:tenure?.name||null};
  }
  G._consecutiveMajorWins=0;
  for(let year=2013;year<=G.year;year++){
    const past=getTournamentsForYear(year).filter(event=>event.tier==='major'&&ordinal(year,event.month)<ordinal(G.year,G.month));
    past.sort((a,b)=>a.month-b.month).forEach(event=>{
      const key=getMajorKey(event,year);
      G._consecutiveMajorWins=(G.majorWins||[]).includes(key)?G._consecutiveMajorWins+1:0;
    });
  }
  if(G.rewrittenHistory?.W01&&G._disabledHistoricalEvents){
    G._disabledHistoricalEvents=G._disabledHistoricalEvents.filter(id=>id!=='H10');
  }
  const dh=G._disabledHistoricalEvents=G._disabledHistoricalEvents||[];
  for(const rewrite of REWRITE_EVENTS){
    if(!(G.rewrittenHistory||{})[rewrite.id])continue;
    for(const id of rewrite.disabledEvents||[])if(!dh.includes(id))dh.push(id);
  }
  if(G.team?.contract?.releaseClause===true){
    G.team.contract.releaseClause=Math.round(G.team.contract.salary*G.team.contract.length*0.25);
  }
  G.rulesVersion=2;
}

function loadGame(slot){
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  const previous=G;
  try{
    const data=localStorage.getItem(key);
    if(!data){showToast('存档不存在','error');return;}
    const loaded=JSON.parse(data);
    if(!loaded?.player?.attrs||!loaded.career||!loaded.training)throw new Error('存档格式不完整');
    G=loaded;
    // Backward compatibility: 核心容器与数值（老存档缺字段时补齐，避免渲染/结算崩溃）
    if(!G.player.potential)G.player.potential={};
    ATTRS.forEach(a=>{
      if(typeof G.player.attrs[a]!=='number')G.player.attrs[a]=a==='physical'?50:40;
      if(typeof G.player.potential[a]!=='number')G.player.potential[a]=Math.max(80,G.player.attrs[a]);
    });
    if(!G.life)G.life={rest:6,entertainment:3,fitness:2,training:8,housing:'shared',house:false,car:null,coach:false,psychologist:false};
    if(!Array.isArray(G.career.ratingHistory))G.career.ratingHistory=[];
    G.career.ratingHistory=G.career.ratingHistory
      .map(r=>typeof r==='number'?{rating:r,ladderOnly:false}:r)
      .filter(r=>r&&isFinite(r.rating));
    if(!G.training.selected)G.training.selected='aim';
    if(typeof G.teamChemistry!=='number')G.teamChemistry=50;
    if(typeof G.pressure!=='number')G.pressure=0;
    if(typeof G.marketAttention!=='number')G.marketAttention=0;
    if(typeof G.player.ign!=='string')G.player.ign=G.player.name||'player';
    // 事件期限字段迁移：品牌收入 12 个月、低调期 3 个月（旧存档没有截止月）
    const migrateStamp=G.year*12+G.month;
    if(G._brandIncome&&!G._brandIncomeUntil)G._brandIncomeUntil=migrateStamp+12;
    if(G._lowProfile&&!G._lowProfileUntil)G._lowProfileUntil=migrateStamp+3;
    if(typeof G._staminaBonus!=='number')G._staminaBonus=0;
    if(G._newTeammate){G._newTeammatePending=true;delete G._newTeammate;}
    // Backward compatibility: initialize new stamina fields if missing
    if(G.stamina===undefined){
      G.stamina=0;
      G.staminaMax=0;
      G.staminaConsumed=0;
      G.pendingFatigueRecovery=0;
      G.monthTournamentCount=0;
      G.monthTrainingHours=0;
    }
    // Backward compatibility: initialize four-dim caps if missing
    if(!G.player.fourDimCaps){
      const fourDims=['aim','utility','communication','gameSense'];
      const caps=[rand(92,94),rand(92,94),rand(92,94),rand(98,100)];
      for(let i=caps.length-1;i>0;i--){
        const j=rand(0,i);
        [caps[i],caps[j]]=[caps[j],caps[i]];
      }
      G.player.fourDimCaps={};
      fourDims.forEach((dim,i)=>{
        G.player.fourDimCaps[dim]=caps[i];
      });
    }
    if(G.player.hasHitCapBefore===undefined){
      G.player.hasHitCapBefore=false;
    }
    // 积分榜迁移（第 35 轮）：老存档读入时初始化积分排名
    if(!G.teamPoints)ensureTeamPoints();
    if(!G.teamEra)G.teamEra={}; // 纪元迁移（第 36 轮）
    if(!G.pointsHistory)G.pointsHistory=[]; // 快照史迁移（第 36 轮）
    if(!G.training.intensity){
      G.training.intensity='moderate';
    }
    // Backward compatibility: initialize player state fields if missing
    if(G.player.fatigue===undefined)G.player.fatigue=0;
    if(G.player.mentalState===undefined)G.player.mentalState=70;
    if(G.player.form===undefined)G.player.form=50;
    // Sync training hours from intensity
    if(G.training.hours===undefined||G.training.hours<4){
      G.training.hours=getHoursByIntensity(G.training.intensity);
    }
    if(G.life)G.life.training=G.training.hours;
    // 经济系统字段迁移（第 52/53 轮新增，老存档补默认值——第 54 轮）
    if(G.life){
      if(G.life.housing===undefined)G.life.housing='shared';
      if(G.life.house===undefined)G.life.house=false;
      if(G.life.car===undefined)G.life.car=null;
      if(G.life.coach===undefined)G.life.coach=false;
      if(G.life.psychologist===undefined)G.life.psychologist=false;
    }
    // Backward compatibility: initialize log arrays if missing
    if(!G.eventLog)G.eventLog=[];
    if(!G.tournamentResults)G.tournamentResults=[];
    if(!G.career.monthlyLog)G.career.monthlyLog=[];
    if(!G.career.matchLog)G.career.matchLog=[];
    if(!G.career.ratingHistory)G.career.ratingHistory=[];
    if(!G.career.achievements)G.career.achievements=[];
    if(!G._triggeredHistoricalEvents)G._triggeredHistoricalEvents=[];
    if(!G._disabledHistoricalEvents)G._disabledHistoricalEvents=[];
    if(!G.rewrittenHistory)G.rewrittenHistory={};
    if(!G._eventCooldowns)G._eventCooldowns={};
    if(!G.qualifiedEvents)G.qualifiedEvents=[];
    // v1.1 backward compatibility
    if(!G.monthPlan){
      G.monthPlan={trainingIntensity:G.training.intensity||'moderate',streamingCap:0,mapStrategy:'auto',bans:[],picks:[]};
    }else{
      if(G.monthPlan.streamingCap===undefined)G.monthPlan.streamingCap=0;
      if(!G.monthPlan.mapStrategy)G.monthPlan.mapStrategy='auto';
      if(!Array.isArray(G.monthPlan.bans))G.monthPlan.bans=[];
      if(!Array.isArray(G.monthPlan.picks))G.monthPlan.picks=[];
    }
    if(G.career.totalMaps===undefined){
      G.career.totalMaps=G.career.totalMatches||0;
      G.career.ratingSum=(G.career.avgRating||0)*G.career.totalMaps;
    }
    if(G.career.ratingSum===undefined)G.career.ratingSum=0;
    if(!Array.isArray(G.majorWins)){
      G.majorWins=Array.isArray(G._majorWins)?[...G._majorWins]:[];
    }else if(Array.isArray(G._majorWins)){
      G._majorWins.forEach(k=>{if(!G.majorWins.includes(k))G.majorWins.push(k);});
    }

    G.qualifiedEvents=G.qualifiedEvents.map(q=>typeof q==='string'?{eventName:q,eventYear:G.year,eventMonth:G.month,teamId:G.team?G.team.id:null}:q);
    if(!G.streaming)G.streaming={followers:0,avgViewers:0,totalDonations:0,monthlyIncome:0,active:false,attraction:0,matchCount:0};
    if(G.streaming.active===undefined)G.streaming.active=false;
    if(!Array.isArray(G._pendingOffers))G._pendingOffers=[];
    delete G._forceSeriesWins;
    delete G._forceQualified;
    ensureMonthSchedule(false);
    // Backward compatibility: optimization systems
    if(G.fame===undefined)G.fame=0;
    if(!G.injury)G.injury=null;
    if(!G.mapProficiency)G.mapProficiency={Dust2:50,Mirage:50,Inferno:50,Nuke:50,Ancient:50,Anubis:50,Overpass:50};
    if(!G.honors)G.honors={matchMVP:0,eventMVP:0,eventEVP:0,top20:[],top1:false};
    if(!Array.isArray(G.honors.top20))G.honors.top20=[];
    if(G.honors.eventEVP===undefined)G.honors.eventEVP=0;
    migrateSavedResults();
    G.version='1.1';
    if(!G._yearHonors)G._yearHonors={eventMVP:0,eventEVP:0,majorChampion:0,majorRunnerUp:0,majorTop4:0,superEliteChampion:0,tier1Champion:0};
    if(!G.unlockedAchievements)G.unlockedAchievements=[];
    if(!G.pendingNegotiation)G.pendingNegotiation=null;
    if(!G.inheritedAchievements)G.inheritedAchievements=[];
    if(!G.inheritedHonors)G.inheritedHonors=null;
    if(!G.runNumber)G.runNumber=1;
    // 读取时清理中断弹窗链可能遗留的运行时标志，避免污染新会话
    G._advanceActive=false;
    G._advanceStartedAt=0;
    G._pendingAchPopups=[];
    G._eventPopupCallback=null;
    const pendingMilestones=settleFanMilestones();
    closeModal();
    showScreen('game-screen');
    renderAll();
    showToast('读取成功！','success');
    if(pendingMilestones.length&&slot==='autosave')saveGame('autosave',true);
  }catch(e){
    G=previous;
    showToast('读取存档失败','error');
  }
}

function loadAndContinue(){
  const auto=localStorage.getItem('cs_career_autosave');
  if(auto){
    loadGame('autosave');
  } else {
    for(let i=0;i<3;i++){
      const d=localStorage.getItem('cs_career_save_'+i);
      if(d){loadGame(i);return}
    }
    showToast('没有找到存档','error');
  }
}

function confirmQuit(){
  if(confirm('确定返回主页？游戏将自动保存。')){
    if(!saveGame('autosave',true))return;
    // 第 68 轮：存档后必须把「继续游戏」露出来，否则回主页后只能绕存档管理读档
    const cont=document.getElementById('btn-continue');
    if(cont)cont.style.display='block';
    showScreen('home-screen');
  }
}

// ============================================================
// INITIALIZATION
// ============================================================
function init(){
  // Check for existing saves
  let canContinue=false;
  try{
    canContinue=!!localStorage.getItem('cs_career_autosave')||[0,1,2].some(i=>localStorage.getItem('cs_career_save_'+i));
  }catch(e){
    showToast('无法访问浏览器存档，游戏可运行。','error');
  }
  if(canContinue){
    document.getElementById('btn-continue').style.display='block';
  }
  // Tab navigation
  document.querySelectorAll('.nav-tab').forEach(tab=>{
    tab.addEventListener('click',()=>switchTab(tab.dataset.tab));
  });
  // Close modal on overlay click
  document.getElementById('modal-overlay').addEventListener('click',e=>{
    if(e.target===document.getElementById('modal-overlay')){
      if(G&&G._eventPopupCallback){closeEventPopup();}else{closeModal();}
    }
  });
  // Init creation screen defaults
  initCreationScreen();
}

// Start
init();
</script>
</body>
</html>
