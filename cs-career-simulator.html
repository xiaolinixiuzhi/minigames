const MAX_HIST_POPUPS_PER_MONTH=2; // 每月最多弹出的历史事件数（弹窗节流）
// 处理历史事件触发
function processHistoricalEvents(){
  if(!G._triggeredHistoricalEvents)G._triggeredHistoricalEvents=[];
  const triggered=[];
  const currentYear=G.year;
  const candidates=[];

  HISTORICAL_EVENTS.forEach(evt=>{
    // 年份检查
    const yearMatch = evt.year 
      ? currentYear === evt.year 
      : (currentYear >= evt.yearRange[0] && currentYear <= evt.yearRange[1]);
    if(!yearMatch) return;

    // 月份检查（如果指定了月份）
    if(evt.month && G.month !== evt.month) return;

    // 检查是否已触发
    if(G._triggeredHistoricalEvents.includes(evt.id)) return;
    // 检查是否被改写历史禁用
    if(isHistoricalEventDisabled(evt.id)) return;

    // 如果没有指定月份，保持原概率判定；指定月份则必定触发
    if(!evt.month && Math.random() > 0.3) return;

    candidates.push(evt);
  });

  // 弹窗节流：超过上限时，优先保留"窗口最后一 年"的事件（错过不再有机会），其余随机抽样
  let selected=candidates;
  if(candidates.length>MAX_HIST_POPUPS_PER_MONTH){
    const lastChance=candidates.filter(evt=>evt.year?evt.year===currentYear:evt.yearRange[1]===currentYear);
    const others=candidates.filter(evt=>lastChance.indexOf(evt)<0);
    const picked=[];
    while(picked.length<MAX_HIST_POPUPS_PER_MONTH&&lastChance.length){picked.push(lastChance.splice(rand(0,lastChance.length-1),1)[0]);}
    while(picked.length<MAX_HIST_POPUPS_PER_MONTH&&others.length){picked.push(others.splice(rand(0,others.length-1),1)[0]);}
    selected=picked;
  }

  selected.forEach(evt=>{
    // 确定玩家身份
    let status='bystander';
    if(isHistoricalParticipant(evt)){
      status='participant';
    }else if(G.team&&G.team.tier==='topTier'){
      status='topTier';
    }

    // 应用效果（合并身份效果和国籍效果）
    const effects={...(evt.effects[status]||{}),...(evt.effects.bystander||{})};
    
    // 检查国籍加成
    const nationality=G.player.nationality?.toLowerCase()||'';
    const nationalityMap={
      '法国':'french','巴西':'brazilian','瑞典':'swedish','丹麦':'danish',
      '挪威':'norwegian','芬兰':'finnish','波兰':'polish','土耳其':'turkish',
      '美国':'northAmerican','加拿大':'northAmerican','澳洲':'australian',
      '俄罗斯':'cis','乌克兰':'cis','哈萨克斯坦':'cis'
    };
    const natKey=nationalityMap[nationality];
    if(natKey&&evt.effects[natKey]){
      Object.assign(effects,evt.effects[natKey]);
    }
    // 位置加成（第 38 轮接线）：awper/rifler/entry/support/igl/lurker → 玩家实际位置生效
    const roleKey=(G.player.role||'').toLowerCase();
    if(roleKey&&evt.effects[roleKey]){
      Object.assign(effects,evt.effects[roleKey]);
    }
    // 年轻加成：21 岁及以下生效
    if(evt.effects.young&&(G.player.age||0)<=21){
      Object.assign(effects,evt.effects.young);
    }
    
    // 处理"all"效果（适用于所有人）
    if(evt.effects.all){
      Object.assign(effects,evt.effects.all);
    }
    
    const effectDesc=[];

    if(effects.aim){
      G.player.attrs.aim=Math.min(attrCapOf('aim'),G.player.attrs.aim+effects.aim);
      effectDesc.push(`Aim+${effects.aim}`);
    }
    if(effects.gameSense){
      G.player.attrs.gameSense=Math.min(attrCapOf('gameSense'),G.player.attrs.gameSense+effects.gameSense);
      effectDesc.push(`GameSense+${effects.gameSense}`);
    }
    if(effects.utility){
      G.player.attrs.utility=Math.min(attrCapOf('utility'),G.player.attrs.utility+effects.utility);
      effectDesc.push(`Utility+${effects.utility}`);
    }
    if(effects.communication){
      G.player.attrs.communication=Math.min(attrCapOf('communication'),G.player.attrs.communication+effects.communication);
      effectDesc.push(`Comm+${effects.communication}`);
    }
    if(effects.consistency){
      G.player.attrs.consistency=Math.min(G.player.potential.consistency,G.player.attrs.consistency+effects.consistency);
      effectDesc.push(`Consistency+${effects.consistency}`);
    }
    if(effects.mental){
      G.player.mentalState=clamp(G.player.mentalState+effects.mental,0,100);
      effectDesc.push(`心态${effects.mental>0?'+':''}${effects.mental}`);
    }
    if(effects.pressure){
      G.pressure=clamp(G.pressure+effects.pressure,0,100);
      effectDesc.push(`压力+${effects.pressure}`);
    }
    if(effects.fame){
      G.marketAttention=Math.min(100,G.marketAttention+effects.fame);
      effectDesc.push(`知名度+${effects.fame}`);
    }
    if(effects.aimMotivation){
      G._aimMotivationMod=(G._aimMotivationMod||1)+effects.aimMotivation/100;
      effectDesc.push(`Aim训练动力+${effects.aimMotivation}%`);
    }
    if(effects.utilityMotivation){
      G._utilityMotivationMod=(G._utilityMotivationMod||1)+effects.utilityMotivation/100;
      effectDesc.push(`Utility训练动力+${effects.utilityMotivation}%`);
    }
    if(effects.clutchMotivation){
      G._clutchMotivationMod=(G._clutchMotivationMod||1)+effects.clutchMotivation/100;
      effectDesc.push(`残局训练动力+${effects.clutchMotivation}%`);
    }
    if(effects.consistencyMotivation){
      G._consistencyMotivationMod=(G._consistencyMotivationMod||1)+effects.consistencyMotivation/100;
      effectDesc.push(`Consistency训练动力+${effects.consistencyMotivation}%`);
    }
    if(effects.gameSenseMotivation){
      G._gameSenseMotivationMod=(G._gameSenseMotivationMod||1)+effects.gameSenseMotivation/100;
      effectDesc.push(`GameSense训练动力+${effects.gameSenseMotivation}%`);
    }
    if(effects.fatigueRecovery){
      G.player.fatigue=Math.max(0,G.player.fatigue-effects.fatigueRecovery);
      effectDesc.push(`疲劳恢复+${effects.fatigueRecovery}%`);
    }

    // 记录事件
    G._triggeredHistoricalEvents.push(evt.id);
    const statusLabel=status==='participant'?'[当事人]':status==='topTier'?'[一线]':'[旁观]';
    G.eventLog.push({
      text:`📜 历史事件：${evt.name} ${statusLabel} - ${evt.desc} (${effectDesc.join(', ')})`,
      type:effects.mental&&effects.mental>0?'positive':effects.mental&&effects.mental<0?'negative':'neutral',
      month:G.month,year:G.year
    });
    triggered.push({name:evt.name,desc:evt.desc,effects:effectDesc,status});
  });

  return triggered;
}

// 检查改写历史条件
function checkRewriteHistory(){
  if(!G.rewrittenHistory)G.rewrittenHistory={};
  const triggered=[];

  REWRITE_EVENTS.forEach(evt=>{
    // 检查是否已改写
    if(G.rewrittenHistory[evt.id])return;
    
    // 检查条件
    try{
      if(!evt.condition(G))return;
    }catch(e){return}

    // 应用效果
    if(evt.effects.fame){
      G.marketAttention=Math.min(100,G.marketAttention+evt.effects.fame);
    }
    if(evt.effects.mental){
      G.player.mentalState=Math.min(100,G.player.mentalState+evt.effects.mental);
    }
    if(evt.effects.pressure){
      G.pressure=Math.min(100,G.pressure+evt.effects.pressure);
    }

    // 标记为已改写
    G.rewrittenHistory[evt.id]=true;
    
    // 禁用对应历史事件
    if(evt.disabledEvent){
      if(!G._triggeredHistoricalEvents.includes(evt.disabledEvent)){
        G._disabledHistoricalEvents=G._disabledHistoricalEvents||[];
        G._disabledHistoricalEvents.push(evt.disabledEvent);
      }
    }

    // 添加成就
    if(evt.achievement){
      G.career.achievements.push(`${G.year}.${G.month} 🏆 ${evt.achievement}`);
    }

    // 记录事件
    G.eventLog.push({
      text:`✨ 改写历史：${evt.name} - ${evt.desc}`,
      type:'positive',
      month:G.month,year:G.year
    });

    triggered.push({name:evt.name,desc:evt.desc,achievement:evt.achievement});
  });

  return triggered;
}

  if(event.effect && event.effect.length>0){
    html += `<div class="card"><h3>📊 影响</h3>`;
    html += `<p style="color:${event.type==='negative'?'var(--red)':event.type==='positive'?'var(--green)':'var(--accent2)'}">${event.effect.join('，')}</p>`;
    html += `</div>`;
  }
  html += `<div class="modal-buttons">`;
  html += `<button class="btn-secondary" onclick="skipAllEventPopups()">跳过全部</button>`;
  html += `<button class="btn-primary" onclick="closeEventPopup()">知道了</button>`;
  html += `</div>`;

  showModal(html);

  // 存储回调，关闭时继续
  G._eventPopupCallback = onClose;
}

function closeEventPopup(){
  closeModal();
  if(G._eventPopupCallback){
    const cb = G._eventPopupCallback;
    G._eventPopupCallback = null;
    cb();
  }
}

function showPendingAchievementsThen(next){
  const ids=(G._pendingAchPopups=G._pendingAchPopups||[]).splice(0);
  if(!ids.length){next();return}
  let idx=0;
  const showNextId=()=>{
    if(idx>=ids.length){G._eventPopupCallback=null;next();return}
    G._eventPopupCallback=showNextId;
    showAchievementPopup(ids[idx++]);
  };
  showNextId();
}

function showEventPopupsSequentially(eventList, onAllClosed){
  let index = 0;
  _skipAllEventPopups=false;

  function showNext(){
    if(_skipAllEventPopups){
      _skipAllEventPopups=false;
      index = eventList.length;
      if(onAllClosed) onAllClosed();
      return;
    }
    if(index >= eventList.length){
      if(onAllClosed) onAllClosed();
      return;
    }
    const evt = eventList[index];
    index++;
    showEventPopup(evt, showNext);
  }

  showNext();
}

function showAchievementPopup(achievementId) {
  const ach = ACHIEVEMENTS[achievementId];

  if (!G.unlockedAchievements) G.unlockedAchievements = [];
  if (!G.unlockedAchievements.includes(achievementId)) G.unlockedAchievements.push(achievementId);

function checkAchievement(achievementId) {
  if (!G.unlockedAchievements) G.unlockedAchievements = [];
  if (G.unlockedAchievements.includes(achievementId)) return false;
  if (G._advanceActive){
    G.unlockedAchievements.push(achievementId);
    (G._pendingAchPopups=G._pendingAchPopups||[]).push(achievementId);
    return true;
  }
  showAchievementPopup(achievementId);
  return true;
}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function randf(min,max){return Math.random()*(max-min)+min}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function weightedAvg(attrs,weights){let s=0,w=0;for(let k in weights){s+=(attrs[k]||0)*weights[k];w+=weights[k]}return w>0?s/w:0}
function ageCoeff(age){if(age<=20)return 1.2;if(age<=24)return 1.0;if(age<=28)return 0.7;return 0.15}
// 统一属性上限口径：四维用 fourDimCaps（与训练一致），其他用 potential
// 修复：事件加成 clamp 用 potential，属性练超 potential 后吃到事件加成会被腰斩回 potential
function attrCapOf(a){const p=G.player;return ['aim','utility','communication','gameSense'].includes(a)?(p.fourDimCaps&&p.fourDimCaps[a]||p.potential[a]):p.potential[a]}
function mentalAgeCoeff(age){return 0.5+(Math.min(Math.max(age,15),35)-15)*0.05}
function formatMoney(n){if(n>=1000000)return '$'+(n/1000000).toFixed(1)+'M';if(n>=1000)return '$'+(n/1000).toFixed(1)+'K';return '$'+n}
function getMonthName(m){const names=['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];return names[m]||''}

function getTierLabel(tier){return TIERS[tier]||tier}
function getPlayerSkill(){
  if(!G)return 0;
  const p=G.player, w=ROLE_WEIGHTS[p.role];
  let base=weightedAvg(p.attrs,w);
  let mentalMod=(p.attrs.mental-50)*0.3;
  let fatiguePen=Math.max(0,(p.fatigue-60)*0.3);
  let formMod=(p.form-50)*0.2;
  return clamp(base+mentalMod+formMod-fatiguePen,10,100);
}
// New power system: calculate match power for a single match
// Design: amateur avg = 30, TOP1 = 97-100+ (can exceed 100 on good days)
// Uses multiplicative modifiers with small ranges
function calculateMatchPower(attrs, role, matchStage, matchesThisMonth, form, fatigue, isPlayoff, isFinal, mapOverride, mapBonusOverride){
  const cw=CORE_WEIGHTS[role]||CORE_WEIGHTS.Rifler;
  const baseAbility=attrs.aim*cw.aim+attrs.utility*cw.utility+attrs.communication*cw.communication+attrs.gameSense*cw.gameSense;
  const consistencyBonus=1+(attrs.consistency/100)*0.05;
  const variance=(1-attrs.consistency/100)*0.05;
  const stateFactor=1+randf(-variance,variance);
  // Mental base: use MENTAL_BASE_BY_TIER for tournaments, fallback to MENTAL_BASE
  let mentalBase;
  const tierMental=MENTAL_BASE_BY_TIER[matchStage];
  if(tierMental){
    if(isFinal)mentalBase=tierMental.final;
    else if(isPlayoff)mentalBase=tierMental.playoff;
    else mentalBase=tierMental.group;
  } else {
    mentalBase=MENTAL_BASE[matchStage]||MENTAL_BASE.amateur;
  }
  // Team tier bonus for mental base
  const teamBonus=getTeamBonus();
  mentalBase=Math.max(0,mentalBase-teamBonus.mental);
  const mentalFactor=1+(attrs.mental-mentalBase)/100*0.10;
  const formFactor=1+(form-50)*0.002;
  // Fatigue multiplier: no penalty below 30, increasing penalty above
  // ≤30 → 1.00, 50 → 0.90, 70 → 0.80, 100 → 0.65
  const fatigueFactor=1-Math.max(0,(fatigue-30)/200);
  // Map bonus from map proficiency system (override keeps veto/result maps consistent)
  const currentMap=mapOverride||getRandomMap();
  const mapBonus=mapBonusOverride!==undefined?mapBonusOverride:getMapBonus(currentMap);
  const finalPower=baseAbility*consistencyBonus*stateFactor*mentalFactor*formFactor*fatigueFactor*(1+mapBonus);
  return finalPower;
}

// === Stamina System ===
function getMonthlyStamina(physical){
  const teamBonus=getTeamBonus();
  const bonusPhysical=teamBonus.physical||0;
  // 新体力体系：基础 100 + 体能×0.5；疲劳挤占行动力（疲劳 50 ≈ -25%，疲劳 100 ≈ 减半）
  return Math.floor((100+(physical+bonusPhysical)*0.5)*(1-G.player.fatigue/200));
}

    heavy_training_month:5,injury:15,dense_schedule:5
  };
  const gain=(eventFatigueMap[eventType]||0)*getFatigueAgeRate(G.player.age);
  if(gain>0){
    G.player.fatigue=Math.min(100,G.player.fatigue+gain);
  }
}
function initMonthlyStamina(){
  G.staminaMax=getMonthlyStamina(G.player.attrs.physical);
  G.stamina=G.staminaMax;
  G.staminaConsumed=0;
  G.monthTournamentCount=0;
  G.monthTrainingHours=0;
}
function processEndOfMonthStamina(){
  const logs=[];
  if(G.monthTrainingHours>=40){
    addEventFatigue('heavy_training_month');
    logs.push('高强度训练月（≥40小时），疲劳+5');
  }
  if(G.monthTournamentCount>=2){
    addEventFatigue('dense_schedule');
    logs.push('赛程密集（同月≥2场一线赛），疲劳+5');
  }
  // 月末统一恢复：基础 5 + 体能×0.1 + 剩余体力每 20 点 1（练得越满恢复越少，轻练月大回血）
  const leftover=Math.max(0,G.stamina);
  let recovery=RECOVERY_PARAMS.baseFlat+Math.floor((G.player.attrs.physical||0)*RECOVERY_PARAMS.baseRate)+Math.floor(leftover/RECOVERY_PARAMS.surplusPer);
  // 透支回补：疲劳>60 时身体强制恢复（+疲劳/10）——破解"高疲劳净收入恒正"的死亡螺旋
  if(G.player.fatigue>60)recovery+=Math.floor(G.player.fatigue/10);
  const before=G.player.fatigue;
  G.player.fatigue=Math.max(0,G.player.fatigue-recovery);
  // 纯休整月（本月 0 训练课，含伤病月）：额外削减 30% 疲劳——高疲劳陷阱态的有效轮休手段
  let restBonus=0;
  if((G.monthTrainingHours||0)<=4&&G.player.fatigue>0){
    restBonus=Math.ceil(G.player.fatigue*0.3);
    G.player.fatigue=Math.max(0,G.player.fatigue-restBonus);
    logs.push(`🛌 休整月（训练≤4小时），额外恢复 ${restBonus}`);
  }
  logs.push(`月末恢复：基础+体能+剩余体力 ${Math.round(leftover)}，疲劳 -${(before-G.player.fatigue).toFixed(0)}（当前 ${Math.round(G.player.fatigue)}）`);
  G.stamina=0;
  // 简化：透支报告与“实际高于预估”警告已随透支机制一起移除
  G._staminaOverdraft=[];
  G.pendingFatigueRecovery=0; // 跨月待恢复机制已移除，月末一次性结算
  return logs;
}
function processPendingFatigueRecovery(){
  // 简化：跨月待恢复已移除，统一由月末剩余体力与训练结算处理
  G.pendingFatigueRecovery=0;
  return [];
}

// === Contract Negotiation System ===
function calculateNegotiationSuccessRate(offer, demands){
  let rate=50; // Base 50%
  const playerSkill=getPlayerSkill();
  const teamAvg=offer.teamPlayers?offer.teamPlayers.reduce((s,p)=>(p.aim+p.utility+p.communication+p.gameSense)/4+s,0)/5:50;
  // Player skill higher than team average
  if(playerSkill>teamAvg)rate+=20;
  // Fame bonus
  if(G.fame>70)rate+=15;
  // Recent rating bonus
  const recentRating=getRecentAvgRating(3)||0;
  if(recentRating>1.2)rate+=10;
  // Demand penalties
  let demandCount=0;
  if(demands.salaryIncrease)demandCount++;
  if(demands.starterGuarantee)demandCount++;
  if(demands.releaseClause)demandCount++;
  if(demands.signingBonus)demandCount++;
  rate-=demandCount*10;
  return clamp(rate,5,95);
}

function submitNegotiation(offerIdx){
  const offer=G._pendingOffers[offerIdx];
  if(!offer){closeModal();return;}
  const demands={
    salaryIncrease:document.getElementById('neg-salary').checked,
    starterGuarantee:document.getElementById('neg-starter').checked,
    releaseClause:document.getElementById('neg-release').checked,
    signingBonus:document.getElementById('neg-bonus').checked
  };
  const successRate=calculateNegotiationSuccessRate(offer, demands);
  const success=Math.random()*100<successRate;
  closeModal();

    // Apply demands to offer
    if(demands.salaryIncrease)offer.salary=Math.round(offer.salary*1.1);
    if(demands.starterGuarantee)offer.isStarter=true;
    if(demands.releaseClause)offer.releaseClause=true;
    if(demands.signingBonus){
      const bonus=Math.round(offer.salary*offer.contractLength*0.2);
      offer.signingBonus=bonus;

    showToast(`谈判成功！成功率 ${successRate}%`,'success');

    renderAll();

}

// === Map Pool System ===
const MAPS=['Dust2','Mirage','Inferno','Nuke','Ancient','Anubis','Overpass'];

function getMapBonus(map){
  const prof=G.mapProficiency[map]||50;
  return (prof-50)/200; // ±0.25
}

function improveMapProficiency(map,amount=0.5){
  if(!G.mapProficiency[map])G.mapProficiency[map]=50;
  G.mapProficiency[map]=Math.min(100,G.mapProficiency[map]+amount);
}

function getRandomMap(){
  return MAPS[Math.floor(Math.random()*MAPS.length)];
}

function simulateBanPick(){
  // Simplified: player bans 2 weakest maps, opponent bans 2 strongest
  const maps=[...MAPS];
  const playerProf=maps.map(m=>({map:m,prof:G.mapProficiency[m]||50}));
  playerProf.sort((a,b)=>a.prof-b.prof);
  // Player bans 2 weakest
  const playerBans=[playerProf[0].map,playerProf[1].map];
  // Opponent bans player's 2 strongest
  playerProf.sort((a,b)=>b.prof-a.prof);
  const opponentBans=[playerProf[0].map,playerProf[1].map];
  // Remaining maps
  const remaining=maps.filter(m=>!playerBans.includes(m)&&!opponentBans.includes(m));
  // Player picks strongest remaining
  remaining.sort((a,b)=>(G.mapProficiency[b]||50)-(G.mapProficiency[a]||50));
  const playerPick=remaining[0];
  // Opponent picks next
  const opponentPick=remaining[1]||remaining[0];
  // Decider
  const decider=remaining[2]||remaining[0];
  return {playerBans,opponentBans,playerPick,opponentPick,decider};
}

function checkTop20(yearEndRating){
  // 数据分（60%）：年度 Rating 映射到 1.05~1.35 区间
  const ratingScore=clamp((yearEndRating-1.05)/0.30*100,0,100);
  // 荣誉分（40%）：Major 冠军 40 / 亚军 30 / 四强 15；赛事 MVP 15 / EVP 8；SuperElite 冠军 18 / Tier1 冠军 10（封顶 100）
  const yh=G._yearHonors||{eventMVP:0,eventEVP:0,majorChampion:0,majorRunnerUp:0,majorTop4:0,superEliteChampion:0,tier1Champion:0};
  const honorsScore=Math.min(100,
    yh.majorChampion*40+yh.majorRunnerUp*30+yh.majorTop4*15+
    yh.eventMVP*15+yh.eventEVP*8+
    yh.superEliteChampion*18+yh.tier1Champion*10);
  const total=ratingScore*0.6+honorsScore*0.4;
  let rank=0;
  if(total>=78)rank=1;
  else if(total>=68)rank=rand(2,5);
  else if(total>=58)rank=rand(6,10);
  else if(total>=45)rank=rand(11,20);
  if(!rank)return 0;
  G._top20Rank=rank; // 供 W02/W13/W14 改写事件判定
  G._top20RankYear=G.year; // 排名所属年份（评选发生在跨年块，改写事件按下一年初的检查回溯此年份）
  G.honors.top20.push({year:G.year,rank});
  addFame(rank===1?20:10);
  G.career.achievements.push(`${G.year} HLTV TOP20 第${rank}名`);
  if(rank===1){
    G.honors.top1=true;
    G._top1Years=G._top1Years||[];if(!G._top1Years.includes(G.year))G._top1Years.push(G.year); // 年度第一年份（第 39 轮）
    G.career.achievements.push(`${G.year} HLTV TOP1！`);
    checkAchievement('top1');
  }else{
    checkAchievement('top20');
  }
  return rank;
}

// === Age & Retirement System ===
function processAgeEffects(){
  const logs=[];
  const age=G.player.age;
  const p=G.player;
  // Age-based attribute changes
  if(age>=16&&age<=22){
    // Growth period（clamp 口径与训练一致：四维用 fourDimCaps——修复跨年把练上去的属性腰斩回 potential 的 bug）
    const fd=['aim','utility','communication','gameSense'];
    ATTRS.forEach(a=>{
      if(a!=='mental'){
        const cap=fd.includes(a)?(p.fourDimCaps?.[a]||p.potential[a]):p.potential[a];
        p.attrs[a]=Math.min(cap,p.attrs[a]+0.1);
      }
    });
    logs.push('成长期：四维+0.1');
  } else if(age>=28&&age<=30){
    // Decline starts
    ATTRS.forEach(a=>{
      if(a!=='mental')p.attrs[a]=Math.max(30,p.attrs[a]-0.15);
    });
    logs.push('年龄增长：四维-0.15');
  } else if(age>=31&&age<=33){
    ATTRS.forEach(a=>{
      if(a!=='mental')p.attrs[a]=Math.max(30,p.attrs[a]-0.3);
    });
    logs.push('年龄增长：四维-0.3');
  } else if(age>=34){
    ATTRS.forEach(a=>{
      if(a!=='mental')p.attrs[a]=Math.max(30,p.attrs[a]-0.5);
    });
    logs.push('年龄增长：四维-0.5');
  }
  return logs;
}

// Calculate opponent per-player power on a specific map
function calculateOpponentPower(opponentSkill, matchStage, teamRoster, map){
  const mapName=map||getRandomMap();
  let ability=opponentSkill;
  let oppName='';
  if(teamRoster&&teamRoster.players&&teamRoster.players.length>=5){
    oppName=teamRoster.name||'';
    ability=teamRoster.players.reduce((s,p)=>s+calcPlayerAbility(p),0)/teamRoster.players.length;
  }
  const mapBonus=oppName?getOpponentMapBonus(oppName,mapName):getMapBonus(mapName);
  let mentalBase;
  const tierMental=MENTAL_BASE_BY_TIER[matchStage];
  if(tierMental)mentalBase=tierMental.group;
  else mentalBase=MENTAL_BASE[matchStage]||MENTAL_BASE.amateur;
  const mentalFactor=1+(50-mentalBase)/100*0.10;
  return ability*mentalFactor*(1+mapBonus)*(0.98+Math.random()*0.04);
}
// 玩家有效属性：受伤时枪法按 aimPenalty 扣除（比赛模拟与展示口径一致）
function getPlayerEffectiveAttrs(){
  const attrs={...G.player.attrs};
  const pen=getInjuryAimPenalty();
  if(pen)attrs.aim=Math.max(10,Math.round(attrs.aim-pen));
  return attrs;
}
function getPlayerRating(){
  if(!G)return 0;
  // Use calculateMatchPower for consistency with actual match calculations
  const p=G.player;
  const matchStage=G.team?.tier||(G.careerLevel==='amateur'?'amateur':'tier2');
  const matchesThisMonth=G.careerLevel==='amateur'?4:G.careerLevel==='semiPro'?6:8;
  const power=calculateMatchPower(getPlayerEffectiveAttrs(),p.role,matchStage,matchesThisMonth,p.form,p.fatigue);
  // Convert power to rating scale (power ~30-100+, rating ~0.6-1.5+)
  return power/100;
}

const TALENT_TIERS=[

   desc:'平凡的天赋。这条路会更难，但并非没有奇迹。'}
];
let creationTalent=null;
let talentRerollsLeft=3;

function getCreationAge(){
  const el=document.getElementById('c-age');
  return el?parseInt(el.value):18;
}
// 体能由年龄与天赋（physicalCap 80-90）决定，不参与可分配预算；18-30 岁开档即处于平台水平
function getCreationPhysicalValue(age,cap){
  return Math.round(cap*getPhysicalAgeCoeff(age));
}
function fitCreationToBudget(){
  // 第 41 轮：年龄变化后若六维分配超出预算（低龄档预算更少），按比例收缩到预算内；盈余则留给玩家自由分配
  if(creationRemaining()>=0)return;
  const factor=getCreateBudget()/creationAllocated();
  CREATE_ATTRS.forEach(a=>{creationAttrs[a]=Math.max(CREATE_MIN,Math.min(CREATE_MAX,Math.round(creationAttrs[a]*factor)));});
  let guard=24;
  while(creationRemaining()<0&&guard-->0){
    const cands=CREATE_ATTRS.filter(x=>creationAttrs[x]>CREATE_MIN);
    if(!cands.length)break;
    const a=cands.reduce((m,x)=>creationAttrs[x]>creationAttrs[m]?x:m);
    creationAttrs[a]--;
  }
  // 取整造成的小额盈余也补齐（仅收缩场景会走到这里），让低龄档默认态恰好贴满预算
  let guard2=24;
  while(creationRemaining()>0&&guard2-->0){
    const cands2=CREATE_ATTRS.filter(x=>creationAttrs[x]<CREATE_MAX);
    if(!cands2.length)break;
    const a2=cands2.reduce((m,x)=>creationAttrs[x]<creationAttrs[m]?x:m);
    creationAttrs[a2]++;
  }
}
function onCreationAgeChange(){
  creationAttrs.physical=getCreationPhysicalValue(getCreationAge(),creationPhysicalCap);
  fitCreationToBudget();
  renderAttrAlloc();
}
function creationAllocated(){return CREATE_ATTRS.reduce((s,a)=>s+creationAttrs[a],0)}
// 开局预算=基础 300 + 天赋加成（S +40 / A +28 / B +16 / C +6 / D +0）
function getAgeBudgetBonus(age){return (age-18)*8;} // 第 41 轮：年龄预算加成（每 ±1 岁 ±8 点；年长开档生涯窗口更短，以更多点数补偿）
function getCreateBudget(){return CREATE_BUDGET+((creationTalent&&creationTalent.budgetBonus)||0)+getAgeBudgetBonus(getCreationAge());}
function creationRemaining(){return getCreateBudget()-creationAllocated()}

function drawTalent(auto){
  if(!auto&&talentRerollsLeft<=0){showToast('重抽机会已用完，天赋已锁定','info');return}
  if(!auto)talentRerollsLeft--;
  const roll=Math.random();
  let acc=0,tier=TALENT_TIERS[TALENT_TIERS.length-1];
  for(const t of TALENT_TIERS){
    acc+=t.prob;
    if(roll<acc){tier=t;break}
  }
  creationTalent={
    id:tier.id,name:tier.name,color:tier.color,desc:tier.desc,
    physicalCap:rand(tier.physicalCap[0],tier.physicalCap[1]),
    bonus:tier.bonus,otherCap:tier.otherCap,budgetBonus:tier.budgetBonus||0,
    capsLow:[rand(tier.capsLow[0],tier.capsLow[1]),rand(tier.capsLow[0],tier.capsLow[1]),rand(tier.capsLow[0],tier.capsLow[1])],
    capsHigh:rand(tier.capsHigh[0],tier.capsHigh[1]),
  };
  creationPhysicalCap=creationTalent.physicalCap;
  creationAttrs.physical=getCreationPhysicalValue(getCreationAge(),creationPhysicalCap);
  // 重抽到更低预算档位时，削减已分配点数到新预算内
  let over=creationAllocated()-getCreateBudget();
  while(over>0){
    const cand=CREATE_ATTRS.filter(a=>creationAttrs[a]>CREATE_MIN);
    if(!cand.length)break;
    const a=cand[rand(0,cand.length-1)];
    creationAttrs[a]--;over--;
  }
  renderTalentDraw();
  renderAttrAlloc();
}

      </div>
      <div style="margin-top:10px;display:flex;gap:10px;justify-content:center">

function initCreationScreen(){
  talentRerollsLeft=3;

  creationAttrs={aim:63,gameSense:52,utility:55,communication:50,consistency:38,mental:42,physical:0};
  drawTalent(true); // 进入捏人页自动抽取一次天赋

function renderAttrAlloc(){
  const c=document.getElementById('attr-alloc-container');
  if(!c)return;
  c.innerHTML=CREATE_ATTRS.map(a=>`
    <div class="attr-alloc">
      <span class="attr-name">${ATTR_SHORT[a]}</span>

  `).join('')+`

    </div>
  `;
  document.getElementById('c-points').textContent=creationRemaining();
  document.getElementById('c-allocated').textContent=creationAllocated();
  const bEl=document.getElementById('c-budget');
  if(bEl)bEl.textContent=getCreateBudget();
}

function adjustAttr(attr,delta){
  if(!CREATE_ATTRS.includes(attr))return;
  const next=creationAttrs[attr]+delta;
  if(next<CREATE_MIN||next>CREATE_MAX)return;
  if(delta>0&&creationRemaining()<=0)return;
  creationAttrs[attr]=next;
  renderAttrAlloc();
}

function randomizeAttrs(){
  // 与手动分配使用完全相同的预算与范围
  const vals={};
  CREATE_ATTRS.forEach(a=>vals[a]=CREATE_MIN);
  let remaining=getCreateBudget()-CREATE_MIN*CREATE_ATTRS.length;
  while(remaining>0){
    const open=CREATE_ATTRS.filter(a=>vals[a]<CREATE_MAX);
    if(!open.length)break;
    const k=open[rand(0,open.length-1)];
    const add=Math.min(remaining,rand(1,6),CREATE_MAX-vals[k]);
    vals[k]+=add;
    remaining-=add;
  }
  creationAttrs={...vals,physical:getCreationPhysicalValue(getCreationAge(),creationPhysicalCap)};
  renderAttrAlloc();
}

function startGame(){
  const name=document.getElementById('c-name').value.trim();
  const ign=document.getElementById('c-ign').value.trim();
  if(!name||!ign){showToast('请填写姓名和游戏ID','error');return}
  if(creationRemaining()!==0){showToast('请分配完所有属性点','error');return}
  if(CREATE_ATTRS.some(a=>creationAttrs[a]<CREATE_MIN||creationAttrs[a]>CREATE_MAX)){
    showToast('属性超出开局范围','error');return;
  }
  // 传承保留：仅当从"开启新周目"进入（startNewRun 置 _pendingNewRun）时恢复继承数据
  const runCarry=(G&&G._pendingNewRun)?{runNumber:G.runNumber,inheritedHonors:G.inheritedHonors,inheritedAchievements:G.inheritedAchievements,fame:G.fame}:null;
  G=newGameState();
  if(runCarry){
    G.runNumber=runCarry.runNumber;
    G.inheritedHonors=runCarry.inheritedHonors;
    G.inheritedAchievements=runCarry.inheritedAchievements;
    G.fame=runCarry.fame;
  }
  G.player.name=name;
  G.player.ign=ign;
  G.player.nationality=document.getElementById('c-nat').value;
  G.player.age=getCreationAge();
  G.player.role=document.getElementById('c-role').value;
  G.year=parseInt(document.getElementById('c-year').value);
  ensureTeamPoints(); // 积分榜初始化（第 35 轮）
  // 使用创建页展示的体能与天赋上限，不再二次随机
  G.player.physicalCap=creationPhysicalCap;
  G.player.attrs={...creationAttrs,physical:getCreationPhysicalValue(G.player.age,creationPhysicalCap)};
  G.player.potential={};
  if(!creationTalent)drawTalent(true); // 兜底：直接调用 startGame 时先抽天赋
  const talent=creationTalent;
  const fourDimList=['aim','utility','communication','gameSense'];
  // 四维硬顶：天赋 3 个较低 + 1 个突出（随机分配到四维）
  const highIdx=rand(0,3);
  fourDimList.forEach((dim,i)=>{
    G.player.fourDimCaps[dim]=i===highIdx?talent.capsHigh:talent.capsLow[i<highIdx?i:i-1];
  });
  ATTRS.forEach(a=>{
    let pot;
    if(a==='physical'){
      pot=creationPhysicalCap;
    }else if(fourDimList.includes(a)){
      pot=G.player.fourDimCaps[a]; // 四维 potential 与硬顶一致（clamp 口径统一）
    }else{
      pot=creationAttrs[a]+rand(talent.bonus[0],talent.bonus[1]);
      pot=clamp(pot,creationAttrs[a]+5,talent.otherCap);
    }
    G.player.potential[a]=pot;
  });
  G.player.hasHitCapBefore=false;
  initMonthlyStamina();
  ensureMonthSchedule();
  G.eventLog.push({text:`${name}（ID: ${ign}）开始了CS职业生涯。`,type:'neutral',month:G.month,year:G.year});
  G.career.monthlyLog.push(`${G.year}年${G.month}月 - 职业生涯开始`);
  showScreen('game-screen');
  renderAll();
  saveGame('autosave');
}

// TRAINING SYSTEM
// ============================================================
function trainAttribute(attrKey){
  G.training.selected=attrKey;
  renderTab('training');
}

function getHoursByIntensity(intensity){
  return {high:10,moderate:8,light:5}[intensity||'moderate']||8;
}
function setTrainingIntensity(intensity){
  G.training.intensity=intensity;
  if(G.monthPlan)G.monthPlan.trainingIntensity=intensity;
  persistGame(true);
  renderTab('training');
}

function processTraining(){
  const p=G.player;
  const attr=G.training.selected;
  const intensity=G.training.intensity||'moderate';
  const t=TRAINING_PARAMS[intensity];
  const ac=ageCoeff(p.age);
  
  // Check if enough stamina
  if(G.stamina<t.stamina){
    return {attr,gain:'0.00',staminaCost:0,overdraftFatigue:false,hitCap:false,fatigueChange:0,reason:'体力不足'};
  }
  
  // Only four-dim attributes can be trained directly
  const fourDims=['aim','utility','communication','gameSense'];
  const isFourDim=fourDims.includes(attr);
  // Get cap for this attribute (use fourDimCaps for four-dim, potential for others)
  const cap=isFourDim?(p.fourDimCaps?.[attr]||p.potential[attr]):p.potential[attr];
  const gap=Math.max(p.age<=28?0.1:0,1-(p.attrs[attr]/cap));
  
  // Calculate gain: staminaCost × 0.25 × ageCoeff × gap × multiplier
  const baseGain=t.stamina*0.25*ac*gap*t.multiplier;
  // 保底下限仅限成长期（24 岁内）；29+ 枪法/道具/沟通生理定型训练无效（意识仍可磨——老将靠经验）
  let gain=Math.max(p.age<=24?0.1:0,baseGain);
  if(p.age>28&&isFourDim&&attr!=='gameSense')gain=0;
  
  let hitCap=false,breakthrough=false;
  // Check if already at cap
  if(p.attrs[attr]>=cap){
    hitCap=true;
    if(isFourDim){
      p.hasHitCapBefore=true; // Mark for "beyond limits" event
      // 苦练突破：高强度训练有小概率突破个人上限（封顶 100）；概率随年龄衰减，29 岁起上限定型
      const btProb=p.age<=24?0.08:p.age<=28?0.04:0;
      if(intensity==='high'&&btProb>0&&Math.random()<btProb){
        p.fourDimCaps=p.fourDimCaps||{};
        const nc=Math.min(100,(p.fourDimCaps[attr]||cap)+1);
        if(nc>cap){p.fourDimCaps[attr]=nc;p.attrs[attr]=nc;breakthrough=true;}
      }
    }
  } else {
    p.attrs[attr]=clamp(p.attrs[attr]+gain,10,cap);
    // Check if hit cap after training
    if(p.attrs[attr]>=cap&&isFourDim){
      hitCap=true;
      p.hasHitCapBefore=true;
    }
  }
  
  // Team tier bonus for training
  const teamBonus=getTeamBonus();
  const bonusGain=gain*(teamBonus.training-1);
  if(!hitCap&&bonusGain>0){
    p.attrs[attr]=clamp(p.attrs[attr]+bonusGain,10,cap);
  }
  
  // Secondary attribute gains (small, only for consistency and mental, NOT physical)
  if(!hitCap){
    ATTRS.forEach(a=>{
      if(a!==attr&&a!=='physical'&&Math.random()<0.5&&!fourDims.includes(a)){
        // Only consistency, mental, physical can grow as secondary
        const secGap=1-(p.attrs[a]/p.potential[a]);
        const ageMult=a==='mental'?mentalAgeCoeff(p.age):1;
        const secGain=t.stamina*0.06*ac*secGap*ageMult;
        p.attrs[a]=clamp(p.attrs[a]+secGain,10,p.potential[a]);
      }
    });
  }
  
  // Consume stamina（计入月消耗统计）
  const staminaCost=t.stamina;
  G.stamina-=staminaCost;
  G.staminaConsumed=(G.staminaConsumed||0)+staminaCost;
  
  // 疲劳：只计本课疲劳，月末统一结算恢复（不再课内用剩余体力/体能抵扣——旧双重恢复是疲劳常年为 0 的根因）
  const fatigueChange=t.fatigue*getFatigueAgeRate(p.age);
  p.fatigue=clamp(p.fatigue+fatigueChange,0,100);
  
  // High intensity affects mental state
  if(intensity==='high'){
    p.mentalState=clamp(p.mentalState-2,0,100);
  }
  
  return {attr,gain:hitCap?'0.00':gain.toFixed(2),staminaCost,overdraftFatigue:false,hitCap,breakthrough,fatigueChange};
}

function oneClickTrain(){
  const p=G.player;
  const w=ROLE_WEIGHTS[p.role];
  const fourDims=['aim','utility','communication','gameSense'];
  // 按需排序（缺口 × 角色权重）：四维 + 稳定——稳定性可进一键计划，主力四维成熟后自动上位
  const sorted=[...fourDims,'consistency'].sort((a,b)=>{
    const capA=p.fourDimCaps?.[a]||p.potential[a];
    const capB=p.fourDimCaps?.[b]||p.potential[b];
    return (w[b]||0.1)*(1-p.attrs[b]/capB) - (w[a]||0.1)*(1-p.attrs[a]/capA);
  });
  // Store multi-attribute plan for advanceMonth to execute
  // 按小时折算训练课：4 小时=1 课（高强度 20 体力/课），8/8/4 → 5 课共 100 体力
  G.training._oneClickPlan=[
    {attr:sorted[0],hours:8},
    {attr:sorted[0],hours:8},
    {attr:sorted[1],hours:8},
    {attr:sorted[1],hours:8},
    {attr:sorted[2],hours:4}
  ];
  // Set primary training for display
  G.training.selected=sorted[0];
  G.training.hours=8;
  G.training.intensity='high';
  if(G.monthPlan)G.monthPlan.trainingIntensity='high';
  p.mentalState=clamp(p.mentalState+3,0,100); // 设置计划不再白送 -5 疲劳（免费回血漏洞）
  showToast(`训练计划已设置：${ATTR_SHORT[sorted[0]]}、${ATTR_SHORT[sorted[1]]}、${ATTR_SHORT[sorted[2]]}`,'success');
}

function getPlayerEntryForLineup(){

  return {

    aim:Math.max(10,Math.round(p.attrs.aim-getInjuryAimPenalty())),utility:p.attrs.utility,communication:p.attrs.communication,
    gameSense:p.attrs.gameSense,consistency:p.attrs.consistency,mental:p.attrs.mental,
    isPlayer:true
  };
}

function getFallbackPlayer(role,tier){
  const base={topTier:88,tier1:78,tier2:64,tier3:50,amateur:38,ladder:38}[tier]||55;
  const v=()=>clamp(Math.round(base+rand(-8,8)),20,99);
  return {name:`队友${rand(10,99)}`,role:role||'Rifler',aim:v(),utility:v(),communication:v(),gameSense:v(),consistency:v(),mental:v(),isPlayer:false};
}

function getTeamBaseRoster(){
  if(!G.team)return [];
  let players=[];
  if(Array.isArray(G.team.roster)&&G.team.roster.length>0){
    players=G.team.roster.filter(p=>!p.isPlayer).map(p=>({...p,isPlayer:false}));
  }
  if(players.length<4){
    const hit=findRosterByName(G.team.name,G.year);
    if(hit&&hit.players)players=hit.players.filter(p=>!p.isPlayer).map(p=>({...p,isPlayer:false}));
  }
  const tier=G.team.tier||'tier2';
  while(players.length<4){
    players.push(getFallbackPlayer(['Rifler','AWPer','Support','IGL'][players.length%4],tier));
  }
  return players.slice(0,4);
}

function getMyLineupForMatch(includePlayer){
  if(!G.team)return null;
  const lineup=getTeamBaseRoster().slice(0,4);
  if(includePlayer){
    const entry=getPlayerEntryForLineup();
    const sameRole=lineup.findIndex(p=>p.role===entry.role);
    if(sameRole>=0)lineup[sameRole]=entry;
    else lineup.push(entry);
  }else{
    lineup.push(getFallbackPlayer(G.player.role||'Rifler',G.team.tier));
  }
  while(lineup.length<5)lineup.push(getFallbackPlayer('Rifler',G.team.tier));
  return lineup.slice(0,5);
}

function getLineupStrength(lineup,applyChemistry){
  if(!lineup||lineup.length!==5)return 0;
  // 纪元漂移（第 36 轮）：仅对玩家所属队伍应用 teamEra
  let s=(applyChemistry&&G.team)?calcTeamStrengthEra(lineup,G.team.name):calcTeamStrength(lineup);
  if(applyChemistry&&G.team)s*=0.95+(G.teamChemistry||50)/100*0.10;
  return s;
}

function hashString(text){
  let h=2166136261;
  const str=String(text||'');
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}

function getOpponentMapProfile(oppName){
  const name=oppName||'对手';
  const h=hashString(name);
  const profile={};
  MAPS.forEach((m,i)=>{profile[m]=40+((h>>>(i*3))%41);});
  const strong=MAPS[h%MAPS.length];
  const weak=MAPS[(h>>>3)%MAPS.length];
  profile[strong]=Math.max(profile[strong],86);
  if(weak!==strong)profile[weak]=Math.min(profile[weak],32);
  return profile;
}
function getOpponentMapBonus(oppName,map){
  const profile=getOpponentMapProfile(oppName);
  return ((profile[map]!==undefined?profile[map]:50)-50)/200;
}
function getMapEdge(map,opponentName){
  const profile=getOpponentMapProfile(opponentName);
  return ((G.mapProficiency[map]||50)-(profile[map]||50))/200;
}

function getSeriesMapCount(format){
  return format==='BO5'?5:format==='BO1'?1:3;
}
function getSeriesNeeded(format){
  return format==='BO5'?3:format==='BO1'?1:2;
}
function buildSeriesMaps(format,opponentName){
  const needed=getSeriesMapCount(format);
  const maxBans=Math.max(0,MAPS.length-needed);
  const oppProfile=getOpponentMapProfile(opponentName);
  const prof=m=>G.mapProficiency[m]||50;
  const edge=m=>(prof(m)-oppProfile[m])/200;
  const bans=new Set();
  const addBan=m=>{if(m&&MAPS.includes(m)&&!bans.has(m)&&bans.size<maxBans)bans.add(m);};
  const strategy=(G.monthPlan&&G.monthPlan.mapStrategy)||'auto';
  const manualBans=((G.monthPlan&&G.monthPlan.bans)||[]).filter(m=>MAPS.includes(m));
  if(strategy==='manual'){
    manualBans.slice(0,2).forEach(addBan);
  }else if(strategy==='ban_strong'){
    [...MAPS].sort((a,b)=>oppProfile[b]-oppProfile[a]).slice(0,2).forEach(addBan);
  }else{
    [...MAPS].sort((a,b)=>prof(a)-prof(b)).slice(0,1).forEach(addBan);
  }
  [...MAPS].sort((a,b)=>prof(b)-prof(a)).forEach(m=>{
    if(!manualBans.includes(m))addBan(m);
  });
  let pool=MAPS.filter(m=>!bans.has(m));
  if(pool.length<needed)pool=MAPS.slice(0,needed);
  const picks=((G.monthPlan&&G.monthPlan.picks)||[]).filter(m=>pool.includes(m)&&!bans.has(m));
  const result=[];
  picks.forEach(m=>{if(result.length<needed&&!result.includes(m))result.push(m);});
  while(result.length<needed){
    const remaining=pool.filter(m=>!result.includes(m));
    if(remaining.length===0)break;
    if(remaining.length===1||needed-result.length===1){
      const decider=[...remaining].sort((a,b)=>Math.abs(edge(a))-Math.abs(edge(b)))[0];
      result.push(decider);
    }else if(result.length%2===0){
      result.push([...remaining].sort((a,b)=>edge(b)-edge(a))[0]);
    }else{
      result.push([...remaining].sort((a,b)=>edge(a)-edge(b))[0]);
    }
  }
  return {maps:result.slice(0,needed),bans:[...bans],opponentProfile:oppProfile,strategy};
}
function getMapAdvantageLabel(edge){
  if(edge>0.12)return{text:'优势',color:'var(--green)'};
  if(edge>0.03)return{text:'小优',color:'var(--green)'};
  if(edge<-0.12)return{text:'劣势',color:'var(--red)'};
  if(edge<-0.03)return{text:'小劣',color:'var(--yellow)'};
  return{text:'均势',color:'var(--text2)'};
}

function makeMapScore(myWin){
  // 赛制分纪元（第 43 轮）：CS:GO=MR15（先到 16），CS2（2023+）=MR12（先到 13，加时 MR3 先到 4）
  const cs2=(G&&G.year?G.year:2015)>=2023;
  const ot=Math.random()<(cs2?0.22:0.25)?rand(0,1):0;
  let winner,loser;
  if(cs2){
    winner=13+ot*3;
    loser=ot===0?rand(2,11):12+3*(ot-1)+rand(0,3);
  }else{
    winner=16+ot*3;
    loser=12+ot*3+rand(0,2);
  }
  if(loser>=winner)loser=winner-1;
  return myWin?`${winner}:${loser}`:`${loser}:${winner}`;
}
function makeMapStats(rating,win){
  const cs2=(G&&G.year?G.year:2015)>=2023; // MR12 每图回合更少，击杀/死亡同步缩放（第 43 轮）
  const kills=clamp(Math.round(rating*(cs2?rand(9,13):rand(12,16))+(win?2:0)),4,cs2?32:40);
  const deaths=clamp(Math.round((2.2-rating)*(cs2?rand(8,12):rand(10,15))),4,cs2?20:24);
  const assists=rand(2,7);
  const adr=clamp(Math.round(rating*rand(50,65)+rand(5,10)),25,120);
  const kast=clamp(Math.round(rating*rand(30,35)+rand(20,28)),40,95);
  return {kills,deaths,assists,adr,kast,kd:deaths>0?(kills/deaths).toFixed(2):kills.toFixed(2)};
}

function simulateSeries(opts){
  opts=opts||{};
  const format=opts.format||'BO3';
  const tier=opts.tier||'tier2';
  const matchType=opts.matchType||tier;
  const needed=getSeriesNeeded(format);
  const playerPlays=!G.team||!!(G.team.isStarter||G._forcePlayerLineup);
  const oppRoster=opts.opponentRoster||null;
  const opponentName=opts.opponentName||(oppRoster&&oppRoster.name)||getTeamName(opts.opponentSkill||50);
  const lineup=G.team?getMyLineupForMatch(playerPlays):null;
  let oppLineup;
  if(oppRoster&&Array.isArray(oppRoster.players)&&oppRoster.players.length>=5){
    oppLineup=oppRoster.players.slice(0,5);
  }else{
    const skill=opts.opponentSkill||45;
    oppLineup=['Rifler','AWPer','Support','IGL','Entry'].map((role,i)=>({
      name:`${opponentName}${i+1}`,role,aim:skill,utility:skill,communication:skill,
      gameSense:skill,consistency:60,mental:50
    }));
  }
  const veto=buildSeriesMaps(format,opponentName);
  const myStrength=G.team?getLineupStrength(lineup,true):0;
  const oppStrength=oppRoster&&Array.isArray(oppRoster.players)&&oppRoster.players.length>=5
    ?calcTeamStrengthEra(oppRoster.players,oppRoster.name)
    :getLineupStrength(oppLineup,false);
  const matchStage=opts.event?tier:(G.team?G.team.tier:getDefaultMatchStage());
  const tm=getTacticMod(opts); // 淘汰赛战术（第 36 轮改：弹窗布置，仅淘汰赛生效）
  const series={
    opponent:opponentName,format,win:false,score:'0:0',maps:[],mapWins:0,mapLosses:0,
    ratingSum:0,mapCount:0,playerPlayed:playerPlays,staminaCost:0,overdraft:0,
    bans:veto.bans,strategy:veto.strategy,opponentProfile:veto.opponentProfile,
    lineup:lineup?lineup.map(p=>p.name):[],oppLineup:oppLineup.map(p=>p.name),
    isTournament:!!opts.isTournament,tournamentTier:opts.event?opts.event.tier:(opts.isTournament?tier:null),
    isPlayoff:!!opts.isPlayoff,isFinal:!!opts.isFinal,roundName:opts.roundName|| '',matchType:opts.matchType||null
  };
    series.oppTopRating=G.team?parseFloat(clamp(1+(oppStrength-myStrength)/500+randf(-0.04,0.12),0.70,1.35).toFixed(2)):null; // 败者 MVP 相对基准：胜方队员最高 Rating 估计（第 45 轮；队伍强度为五人求和，除 500 折算单人尺度）
const forced=Array.isArray(G._forceSeriesWins)&&G._forceSeriesWins.length?G._forceSeriesWins.shift():undefined;
  for(let i=0;i<veto.maps.length;i++){
    const map=veto.maps[i];
    let mapWin;
    if(forced===true){
      mapWin=true;
    }else if(forced===false){
      mapWin=false;
    }else if(G.team){
      const edge=getMapEdge(map,opponentName);
      const my=myStrength*(1+edge)*(1+(tm.win||0));
      const opp=oppStrength*(1-edge);
      mapWin=Math.random()<my/(my+opp);
    }else{
      const myP=calculateMatchPower(getPlayerEffectiveAttrs(),G.player.role,'amateur',4,G.player.form,G.player.fatigue,false,false,map);
      const oppP=calculateOpponentPower(opts.opponentSkill||35,'amateur',null,map);
      mapWin=Math.random()<myP/(myP+oppP);
    }
    const score=makeMapScore(mapWin);
    let rating=null;
    let stats={kills:0,deaths:0,assists:0,adr:0,kast:0,kd:'0.00'};
    if(playerPlays){
      const myP=calculateMatchPower(getPlayerEffectiveAttrs(),G.player.role,matchStage,6,G.player.form,G.player.fatigue,opts.isPlayoff,opts.isFinal,map);
      const oppP=calculateOpponentPower(opts.opponentSkill||50,matchStage,oppRoster,map);
      rating=parseFloat((1+(myP-oppP)/100+randf(-0.08,0.08)).toFixed(2));
      stats=makeMapStats(rating,mapWin);
      improveMapProficiency(map,mapWin?0.35:0.2);
    }
    // 真实残局判定：赢图且单图 Rating 出色时，小概率完成 1v4/1v5（残局训练动力提升概率）
    if(playerPlays&&rating!==null&&mapWin&&rating>=1.30){
      const clutchChance=0.06*(G._clutchMotivationMod||1);
      const roll=Math.random();
      if(roll<clutchChance/2)series.clutch5=true;
      else if(roll<clutchChance)series.clutch4=true;
    }
    series.maps.push({map,score,win:mapWin,rating,...stats});
    if(mapWin)series.mapWins++;else series.mapLosses++;
    if(rating!==null){series.ratingSum+=rating;series.mapCount++;}
    if(series.mapWins>=needed||series.mapLosses>=needed)break;
  }
  series.win=series.mapWins>series.mapLosses;
  series.score=`${series.mapWins}:${series.mapLosses}`;
  series.avgRating=series.mapCount?parseFloat((series.ratingSum/series.mapCount).toFixed(2)):null;
  series.kills=series.maps.reduce((s,m)=>s+m.kills,0);
  series.deaths=series.maps.reduce((s,m)=>s+m.deaths,0);
  series.assists=series.maps.reduce((s,m)=>s+m.assists,0);
  series.adr=series.maps.length?Math.round(series.maps.reduce((s,m)=>s+m.adr,0)/series.maps.length):0;
  series.staminaCost=0; // 简化：比赛阶段不消耗月度体力
  // 临场战术副作用（第 36 轮）：rush 加疲劳 / mind 掉心态 / rest 省疲劳
  if(G.team&&tm&&(tm.fatigue||tm.mental)){
    G.player.fatigue=clamp(G.player.fatigue+(tm.fatigue||0),0,100);
    if(tm.mental)G.player.mentalState=clamp(G.player.mentalState+tm.mental,0,100);
  }
  return series;
}

function recordSeries(series,monthly){
  if(!series||!series.playerPlayed||series.avgRating===null)return;
  // 系列赛 MVP 评选（第 29 轮）：赢方 Rating≥1.10 概率 0.25+(rating−1.10)×1.75（封顶 0.6）；败方 Rating≥1.20 概率 0.15
  {
    const mvpChance=series.matchType==='ladder'?0:(series.win
      ?(series.avgRating>=1.15?Math.min(0.35,0.08+(series.avgRating-1.15)*1.2):0)
      :(series.avgRating>=1.20?0.10:0));
    if(Math.random()<mvpChance){
      G.honors.matchMVP++;
      monthly.mvps=(monthly.mvps||0)+1;
      G._yearStats=G._yearStats||{wins:0,losses:0,series:0,maps:0,ratingSum:0,bestMap:0,bestMapOpp:'',mvps:0};
      G._yearStats.mvps=(G._yearStats.mvps||0)+1;
      addFame(2);
    }
  }
  G.career.totalMatches=(G.career.totalMatches||0)+1;
  if(series.win)G.career.wins=(G.career.wins||0)+1;else G.career.losses=(G.career.losses||0)+1;
  G.career.totalMaps=(G.career.totalMaps||0)+series.maps.length;
  // 真实残局记录（simulateSeries 逐图判定）
  if(series.clutch5){G.career.clutch5Count=(G.career.clutch5Count||0)+1;G.eventLog.push({text:`🔥 完成 1v5 残局！（vs ${series.opponent}）`,type:'positive',month:G.month,year:G.year});}
  else if(series.clutch4){G.career.clutch4Count=(G.career.clutch4Count||0)+1;G.eventLog.push({text:`🔥 完成 1v4 残局！（vs ${series.opponent}）`,type:'positive',month:G.month,year:G.year});}
  G.career.ratingSum=(G.career.ratingSum||0)+series.ratingSum;
  G.career.matchLog.push({
    date:`${G.year}.${G.month}`,opponent:series.opponent,win:series.win,score:series.score,
    kills:series.kills,deaths:series.deaths,assists:series.assists,rating:series.avgRating,
    adr:series.adr,maps:series.maps,mapWins:series.mapWins,mapLosses:series.mapLosses,
    isTournament:series.isTournament,tournamentTier:series.tournamentTier,
    isPlayoff:series.isPlayoff,isFinal:series.isFinal,roundName:series.roundName
  });
  if(monthly){
    // 单场成就：记录本月单图最高 Rating（替补未出场的地图 rating 为 null，不计）
    series.maps.forEach(m=>{if(typeof m.rating==='number'&&m.rating>(monthly.bestMapRating||0))monthly.bestMapRating=m.rating;});
    monthly.seriesList.push(series);
    if(series.win)monthly.wins++;else monthly.losses++;
    monthly.ratingSum+=series.ratingSum;
    monthly.mapCount+=series.maps.length;
  }
  // 年度统计累计（跨年时由 advanceMonth 结算并弹出年度回顾）
  G._yearStats=G._yearStats||{wins:0,losses:0,series:0,maps:0,ratingSum:0,bestMap:0,bestMapOpp:'',mvps:0};
  G._yearStats.series++;
  if(series.win)G._yearStats.wins++;else G._yearStats.losses++;
  G._yearStats.maps+=series.maps.length;
  G._yearStats.ratingSum+=series.ratingSum;
  series.maps.forEach(m=>{if(typeof m.rating==='number'&&m.rating>G._yearStats.bestMap){G._yearStats.bestMap=m.rating;G._yearStats.bestMapOpp=series.opponent;}});
}

function getTeamName(skill){
  const rosters=getTeamRostersByYear(G.year);
  const own=G.team?G.team.name:null;
  const bucket=tier=>Object.values(rosters).filter(t=>t.tier===tier&&(!own||t.name!==own));
  if(skill>85){const a=bucket('topTier');if(a.length)return a[rand(0,a.length-1)].name;}
  if(skill>70){const a=bucket('tier1');if(a.length)return a[rand(0,a.length-1)].name;}
  if(skill>55){const a=bucket('tier2');if(a.length)return a[rand(0,a.length-1)].name;}
  if(skill>40){const a=bucket('tier3');if(a.length)return a[rand(0,a.length-1)].name;}
  const names=['路人战队','小型战队','地区战队','新军战队','FPL队伍'];
  return names[rand(0,names.length-1)];
}

function estimateEventStamina(event){
  if(event.tier==='major')return 45;
  if(event.tier==='superElite')return 36;
  if(event.tier==='tier1')return 28;
  if(event.tier==='tier2')return 12;
  if(event.tier==='qualifier')return 8;
  return 6;
}
function ensureMonthSchedule(persist=true){
  if(G.monthSchedule&&G.monthSchedule.year===G.year&&G.monthSchedule.month===G.month)return G.monthSchedule;
  const all=getAllTournamentsForMonth(G.year,G.month);
  const ownRegion=G.team?G.team.region:null;
  const tier3=all.filter(e=>e.tier==='tier3');
  const regionPool=ownRegion?tier3.filter(e=>e.continent===ownRegion):[];
  const chosen=[];
  (regionPool.length?regionPool:tier3).slice(0,2).forEach(e=>chosen.push(e));
  tier3.filter(e=>e.isQualifier).forEach(e=>{if(!chosen.some(x=>x.name===e.name))chosen.push(e);});
  const events=[];
  // Major 预选赛（第 35 轮）：积分 9-56 名在本月程获得预选赛条目，争夺下月 Major 的 16 个挑战组名额
  if(G.team){
    const qM=G.month+1,qY=qM>12?G.year+1:G.year,qM2=qM>12?qM-12:qM;
    (TOURNAMENTS_BY_YEAR[qY]||[]).filter(t=>t.tier==='major'&&t.month===qM2).forEach(m=>{
      ensureTeamPoints();
      const pr=getPlayerPointsRank();
      const hasSlot=(G.qualifiedEvents||[]).some(q=>q.eventName===m.name&&q.eventYear===qY&&(!q.teamId||q.teamId===G.team.id));
      if(pr.rank>POINTS_CONFIG.majorLegends&&pr.rank<=POINTS_CONFIG.majorLegends+POINTS_CONFIG.majorQualSize&&!hasSlot){
        events.push({
          kind:'event',id:`ev_mq_${events.length}`,name:`${m.name} 预选赛`,tier:'qualifier',
          registered:true,mandatory:false,qualified:false,locked:false,estStamina:estimateEventStamina({tier:'qualifier'}),
          event:{name:`${m.name} 预选赛`,tier:'qualifier',isQualifier:true,isMajorQualifier:true,
            qualifiesFor:m.name,qualifiesForMonth:m.month,qualifiesForYear:qY,month:G.month},
          done:false,actualStamina:0
        });
      }
    });
  }
  [...all.filter(e=>e.tier!=='tier3'),...chosen].forEach(ev=>{
    const qualified=!!findPreQualification(ev);
    const inv=planHighEventInvitation(ev);
    let registered=false,note=null,noteType='neutral';
    if(inv){
      if(inv.pool&&inv.pool.length)settleAIEventPoints(ev,inv.pool);
      registered=!!inv.registered;
      ev._invited=inv; // 挂到赛事对象：供资格判定与对手抽取使用
      if(ev.tier==='major'&&!inv.registered)pushMajorNarrative(ev); // 观赛战报（第 36 轮）
      if(ev.tier==='major'){
        if(inv.registered){note=inv.stage==='legends'?`🏆 Major 邀请：积分第 ${inv.rank} 名，直通传奇组`:`🏆 Major 邀请：预选赛出线，进入挑战组`;noteType='positive';}
        else note=`📉 ${ev.name}：积分第 ${inv.rank} 名，未获邀请`;
      }else if(G.team){
        if(inv.registered){note=`🏆 ${ev.name}：积分第 ${inv.rank} 名，获得邀请（前 ${inv.cut}）`;noteType='positive';}
        else note=`📉 ${ev.name}：积分第 ${inv.rank} 名，未获邀请（需前 ${inv.cut}）`;
      }
    }else{
      registered=!!G.team&&(qualified||ev.tier==='tier2');
    }
    events.push({
      kind:'event',id:`ev_${events.length}`,name:ev.name,tier:ev.tier,month:ev.month,
      registered,mandatory:false,qualified,locked:!!(inv&&!inv.registered),estStamina:estimateEventStamina(ev),
      event:ev,done:false,actualStamina:0
    });
    if(note)G.eventLog.push({text:note,type:noteType,month:G.month,year:G.year});
  });
  if(G.team){
    const count=G.team.tier==='topTier'?4:G.team.tier==='tier1'?3:G.team.tier==='tier2'?3:2;
    const pools={topTier:['topTier','topTier','tier1'],tier1:['tier1','tier1','tier2'],tier2:['tier2','tier2','tier3'],tier3:['tier3','tier3','tier3']};
    const pool=pools[G.team.tier]||pools.tier2;
    for(let i=0;i<count;i++){
      const oppTier=pool[i%pool.length];
      const roster=pickPointsNearOpponent(oppTier)||getRandomTeamRosterByYear(G.year,oppTier);
      events.push({
        kind:'league',id:`lg_${i}`,name:roster?`联赛 vs ${roster.name}`:`联赛第${i+1}轮`,
        tier:oppTier,registered:true,mandatory:false,
        estStamina:2,
        opponentName:roster?roster.name:null,opponentTier:oppTier,done:false,actualStamina:0
      });
    }
  }else{
    for(let i=0;i<3;i++){
      events.push({
        kind:'league',id:`ld_${i}`,name:`天梯第${i+1}场`,tier:'ladder',
        registered:true,mandatory:false,estStamina:1,opponentSkill:rand(25,55),done:false,actualStamina:0
      });
    }
  }
  G.monthSchedule={year:G.year,month:G.month,events,done:false,createdAt:Date.now()};
  G._staminaOverdraft=[];
  G._previewOpponent=null;
  if(persist)persistGame(true);
  return G.monthSchedule;
}

function getUpcomingPreview(){
  if(G._previewOpponent&&G._previewOpponent.y===G.year&&G._previewOpponent.m===G.month)return G._previewOpponent;
  const s=ensureMonthSchedule();
  let result=null;
  const eventItem=s.events.find(e=>e.kind==='event'&&e.registered&&!e.done&&e.tier!=='tier3');
  if(eventItem){
    const ev=eventItem.event;
    if(ev.tier==='major'&&MAJOR_RIVALS[getMajorKey(ev)]){
      const r=findRosterByName(MAJOR_RIVALS[getMajorKey(ev)],G.year);
      if(r&&(!G.team||r.name!==G.team.name))result={name:r.name,tier:r.tier,source:`${ev.name} 决赛对手`};
    }
    if(!result){
      const pool=ev.tier==='major'?['topTier','tier1']:ev.tier==='superElite'?['topTier','tier1']:['tier1','tier2'];
      for(const t of pool){
        const r=getRandomTeamRosterByYear(G.year,t);
        if(r){result={name:r.name,tier:r.tier,source:ev.name};break;}
      }
    }
  }
  if(!result){
    const league=s.events.find(e=>e.kind==='league'&&e.registered&&!e.done);
    if(league&&league.opponentName)result={name:league.opponentName,tier:league.opponentTier||'tier2',source:league.name};
  }
  if(!result)result={name:'地区强队',tier:'tier2',source:'下一场'};
  result.y=G.year;result.m=G.month;
  G._previewOpponent=result;
  return result;
}
function estimateMapWinRate(map,oppName){
  const edge=getMapEdge(map,oppName);
  if(G.team){
    const lineup=getMyLineupForMatch(G.team.isStarter);
    const my=getLineupStrength(lineup,true)*(1+edge);
    const r=findRosterByName(oppName,G.year);
    const opp=(r&&r.players&&r.players.length>=5?calcTeamStrengthEra(r.players,r.name):getLineupStrength(getMyLineupForMatch(false),false))*(1-edge);
    if(my+opp<=0)return 0.5;
    return clamp(my/(my+opp),0.05,0.95);
  }
  const cw=CORE_WEIGHTS[G.player.role]||CORE_WEIGHTS.Rifler;
  const a=G.player.attrs;
  const base=a.aim*cw.aim+a.utility*cw.utility+a.communication*cw.communication+a.gameSense*cw.gameSense;
  const myP=base*(1+(G.player.form-50)*0.002)*(1-Math.max(0,(G.player.fatigue-30)/200))*(1+edge);
  const oppAbility=52;
  const oppP=oppAbility*(1-edge);
  return clamp(myP/(myP+oppP),0.05,0.95);
}

function simulateLeagueItem(item){
  if(!G.team){
    return simulateSeries({
      opponentSkill:item.opponentSkill||35,opponentName:'天梯对手',tier:'ladder',
      matchType:'ladder',format:'BO1',roundName:item.name
    });
  }

  const oppSkill=roster?calcTeamStrengthEra(roster.players,roster.name)/5:getTeamOpponentStrength(G.careerLevel,item.opponentTier,G.year);
  return simulateSeries({
    opponentRoster:roster,opponentSkill:oppSkill,opponentName:item.opponentName||undefined,
    tier:item.opponentTier||G.team.tier,matchType:G.team.tier||'tier2',format:'BO1',
    roundName:item.name,isTournament:false
  });
}

function processMatches(){
  const schedule=ensureMonthSchedule();
  const monthly={seriesList:[],wins:0,losses:0,ratingSum:0,mapCount:0,events:[]};
  schedule.events.forEach(item=>{
    if(item.done||!item.registered)return;
    if(item.kind==='league'){
      const s=simulateLeagueItem(item);
      recordSeries(s,monthly);
      item.result={win:s.win,score:s.score,opponent:s.opponent,rating:s.avgRating,maps:s.maps};
      item.done=true;
    }else{
      const res=simulateEvent(item.event);
      item.result=res;
      item.done=true;
      item.actualStamina=item.event.actualStamina||0;
      (res.series||[]).forEach(s=>recordSeries(s,monthly));
      monthly.events.push({name:item.event.name,result:res});
    }
  });
  schedule.done=true;
  const avg=monthly.mapCount?monthly.ratingSum/monthly.mapCount:0;
  // 真实比赛均分（天梯不并入——虐菜刷分不能兑换荣誉评选数据）
  const realSeries=monthly.seriesList.filter(s=>s.matchType!=='ladder');
  const realMaps=realSeries.reduce((a,s)=>a+s.mapCount,0);
  const realAvg=realMaps?realSeries.reduce((a,s)=>a+s.ratingSum,0)/realMaps:0;
  if(monthly.mapCount>0){
    // level=本层 rating（对局发生时的档位），供同层判定使用；ladderOnly=纯天梯月（荣誉评选排除）
    G.career.ratingHistory.push({month:`${G.year}.${G.month}`,rating:parseFloat(avg.toFixed(2)),level:G.careerLevel,ladderOnly:realMaps===0});
    if(realMaps>0&&realAvg>G.career.bestRating)G.career.bestRating=parseFloat(realAvg.toFixed(2));
    G.career.avgRating=parseFloat((G.career.ratingSum/Math.max(1,G.career.totalMaps)).toFixed(2));
  }
  if(G.career.totalMatches>=1)checkAchievement('first_match');
  if(G.career.totalMatches>=10)checkAchievement('ten_matches');
  if(G.career.wins>=100)checkAchievement('hundred_wins');
  // 单场成就：本月单图最高 Rating（不再用月均）
  const bestMapRating=monthly.bestMapRating||0;
  if(bestMapRating>=1.50)checkAchievement('rating_150');
  if(bestMapRating>=1.80)checkAchievement('rating_180');
  // 残局成就：由 simulateSeries 逐图真实判定（赢图+高 Rating 小概率触发 clutch）
  if((G.career.clutch5Count||0)>=1)checkAchievement('first_1v5');
  if((G.career.clutch4Count||0)>=1)checkAchievement('first_1v4');
  if(monthly.mapCount>0&&(!G.team||G.careerLevel==='amateur')){
    const attractionMod=(avg-1.0)*50;
    G.streaming.attraction=Math.max(0,(G.streaming.attraction||0)+attractionMod+monthly.mapCount*0.5);
    G.streaming.matchCount=(G.streaming.matchCount||0)+monthly.mapCount;
  }
  if(monthly.mapCount>0){
    if(avg>1.10)G.player.form=clamp(G.player.form+rand(3,8),0,100);
    else if(avg<0.90)G.player.form=clamp(G.player.form-rand(3,8),0,100);
  }
  // 比赛消耗体力：每系列赛 4 点（体力不足照打，扣到 0 为止）
  const matchSpent=Math.min(G.stamina,monthly.seriesList.length*4);
  G.stamina-=matchSpent;
  G.staminaConsumed=(G.staminaConsumed||0)+matchSpent;
  return {
    matches:monthly.seriesList,wins:monthly.wins,losses:monthly.losses,
    avgRating:parseFloat(avg.toFixed(2)),mapCount:monthly.mapCount,
    seriesCount:monthly.seriesList.length,events:monthly.events,mvps:monthly.mvps||0
  };
}

function getRecentAvgRating(n,sameLevelOnly,excludeLadder){
  const h=G.career.ratingHistory;
  if(h.length===0)return 0;
  let pool=excludeLadder?h.filter(e=>!e.ladderOnly):h;
  if(pool.length===0)return 0;
  // 同档位过滤：升档后旧档位的"碾压分"不再充当新档位的资格证明（修复开局数月收到一线队邀约）
  if(sameLevelOnly&&G.careerLevel){
    const filtered=h.filter(r=>!r.level||r.level===G.careerLevel);
    if(filtered.length>0)pool=filtered;
    else return 0; // 尚无本层数据：宁缺毋滥
  }
  const recent=pool.slice(-n);
  return recent.reduce((s,r)=>s+r.rating,0)/recent.length;
}

function checkCareerProgression(){
  const recent=getRecentAvgRating(3,true);
  const level=G.careerLevel;
  const events=[];
  // Amateur to semiPro: need consistent >1.05 rating (dominating amateur level)
  // A player with skill 45 vs amateur opponents (skill 40) gets ~1.05
  if(level==='amateur'&&recent>=1.05&&G.career.totalMatches>=6){
    events.push({type:'promotion',text:'你在天梯中稳定carry，半职业战队开始关注你！',level:'semiPro'});
  }
  // SemiPro to pro: need consistent >1.10 rating (high-level performance at tier2)
  // A player with skill 62 vs semiPro opponents (skill 52) gets ~1.10
  if(level==='semiPro'&&recent>=1.10&&G.career.totalMatches>=15){
    events.push({type:'promotion',text:'你在二线赛事中的表现引起了一线俱乐部的注意！',level:'pro'});
  }
  return events;
}

function generateTeamOffers(){
  const offers=[];
  const recent=getRecentAvgRating(3,true);
  const level=G.careerLevel;
  const yearTeams=getTeamsDBByYear(G.year);
  // 本层月数：刚升档时旧档位的碾压分不能直接兑换高档邀约
  const lvlMonths=G.career.ratingHistory.filter(r=>!r.level||r.level===G.careerLevel).length;
  // Amateur: tier3 offers for decent performance, tier2 for dominating
  if(level==='amateur'){
    // tier3 offer: >0.95 (showing promise in ladder)
    if(recent>0.95&&Math.random()<0.4){
      const tier3=yearTeams.filter(t=>t.tier==='tier3').filter(teamNeedsRole); // 转会真实性（第 40 轮）
      if(tier3.length>0){
        const t=pickOfferTeam(tier3);
        offers.push(makeOffer(t,rand(400,1200),rand(6,12)));
      }
    }
    // tier2 offer: >1.05 (dominating amateur level) — 需在业余层打过至少 2 个月
    if(recent>1.05&&lvlMonths>=2&&Math.random()<0.3){
      const tier2=yearTeams.filter(t=>t.tier==='tier2').filter(teamNeedsRole); // 转会真实性（第 40 轮）
      if(tier2.length>0){
        const t=pickOfferTeam(tier2);
        offers.push(makeOffer(t,rand(800,2000),rand(6,12)));
      }
    }
  }
  // SemiPro: tier2 offers for decent performance, tier1 for dominating
  else if(level==='semiPro'){
    // tier2 offer: >0.95 (maintaining decent performance at semiPro level)
    if(recent>0.95&&Math.random()<0.4){
      const tier2=yearTeams.filter(t=>t.tier==='tier2').filter(teamNeedsRole); // 转会真实性（第 40 轮）
      if(tier2.length>0){
        const t=pickOfferTeam(tier2);
        offers.push(makeOffer(t,rand(2000,6000),rand(12,24)));
      }
    }
    // tier1 offer: >1.10 (dominating semiPro level) — 需在半职业层打过至少 3 个月
    if(recent>1.10&&lvlMonths>=3&&Math.random()<0.2){
      const tier1=yearTeams.filter(t=>t.tier==='tier1').filter(teamNeedsRole); // 转会真实性（第 40 轮）
      if(tier1.length>0){
        const t=pickOfferTeam(tier1);
        offers.push(makeOffer(t,rand(8000,20000),rand(12,24)));
      }
    }
  }
  // Pro/benched/freeAgent: offers based on recent performance relative to tier
  else if(level==='pro'||level==='benched'||level==='freeAgent'){
    // topTier offer: >1.10 (exceptional performance at tier1 level) — 需在职业层打过至少 3 个月
    if(recent>1.10&&lvlMonths>=3&&Math.random()<0.25){
      const top=yearTeams.filter(t=>t.tier==='topTier').filter(teamNeedsRole); // 转会真实性（第 40 轮）
      if(top.length>0){
        const t=pickOfferTeam(top);
        offers.push(makeOffer(t,rand(20000,60000),rand(12,36)));
      }
    }
    // tier1 offer: >0.95 (decent performance at pro level)
    if(recent>0.95&&Math.random()<0.35){
      const tier1=yearTeams.filter(t=>t.tier==='tier1').filter(teamNeedsRole); // 转会真实性（第 40 轮）
      if(tier1.length>0){
        const t=pickOfferTeam(tier1);
        offers.push(makeOffer(t,rand(10000,30000),rand(12,36)));
      }
    }
    // tier2 offer: >0.85 (struggling at tier1 but still has pro experience)
    if(recent>0.85&&Math.random()<0.4){
      const tier2=yearTeams.filter(t=>t.tier==='tier2').filter(teamNeedsRole); // 转会真实性（第 40 轮）
      if(tier2.length>0){
        const t=pickOfferTeam(tier2);
        offers.push(makeOffer(t,rand(3000,10000),rand(12,24)));
      }
    }
  }
  // Safety net: guarantee one reasonable offer after 3 months without any (amateur) or 6 months (others)
  if(offers.length===0&&G.career.totalMatches>0){
    if(!G._lastOfferMonth)G._lastOfferMonth=G.year*12+G.month;
    const monthsSince=(G.year*12+G.month)-G._lastOfferMonth;
    const safetyThreshold=level==='amateur'?3:6;
    if(monthsSince>=safetyThreshold){
      G._lastOfferMonth=G.year*12+G.month;
      if(level==='amateur'){
        const tier3=yearTeams.filter(t=>t.tier==='tier3');
        const tier2=yearTeams.filter(t=>t.tier==='tier2');
        const need3=tier3.filter(teamNeedsRole); // 保底邀约优先有空缺队伍，否则兜底（第 40 轮）
        const t=need3.length>0?pickOfferTeam(need3):(tier3.length>0?tier3[rand(0,tier3.length-1)]:(tier2.length>0?tier2[0]:yearTeams[0]));
        if(t)offers.push(makeOffer(t,rand(400,1200),rand(6,12)));
      } else if(level==='semiPro'){
        const tier2=yearTeams.filter(t=>t.tier==='tier2');
        if(tier2.length>0){
          const need2=tier2.filter(teamNeedsRole); // 保底优先有空缺队伍，否则兜底（第 40 轮）
          const t=need2.length>0?pickOfferTeam(need2):pickOfferTeam(tier2);
          offers.push(makeOffer(t,rand(1500,4000),rand(12,18)));
        }
      } else {
        const tier2=yearTeams.filter(t=>t.tier==='tier2');
        if(tier2.length>0){
          const need2=tier2.filter(teamNeedsRole); // 保底优先有空缺队伍，否则兜底（第 40 轮）
          const t=need2.length>0?pickOfferTeam(need2):pickOfferTeam(tier2);
          offers.push(makeOffer(t,rand(2500,6000),rand(12,18)));
        }
      }
    }
  }
  return offers;
}

// 转会真实性（第 40 轮）：战队只在①同位置空缺 ②同位置现役数据不如意（比我差 2+ 点）③主角足够强（磨合期最差发挥 ×0.93 仍高于现役）时，才会以主力身份开价
function playerOvr4(p){return ((p.aim||0)+(p.utility||0)+(p.communication||0)+(p.gameSense||0))/4;}
function roleSlotStatus(team){
  try{
    if(!G||!G.player||!G.player.attrs)return 'unknown';
    const rosters=getTeamRostersByYear(G.year);
    const tr=rosters&&rosters[team.id];
    if(!tr||!tr.players||!tr.players.length)return 'unknown';
    const starters=tr.players.slice(0,5);
    const same=starters.filter(p=>p.role===G.player.role);
    if(!same.length)return 'vacancy'; // 同位置空缺
    const inc=Math.max(...same.map(p=>playerOvr4(p)));
    const mine=playerOvr4({aim:G.player.attrs.aim,utility:G.player.attrs.utility,communication:G.player.attrs.communication,gameSense:G.player.attrs.gameSense});
    if(inc<mine-2)return 'weaker';      // 现役数据不如意
    if(mine*0.93>inc)return 'crush';    // 磨合期（默契 30 档 ×0.93）仍压过现役
    return 'blocked';
  }catch(e){return 'unknown'}
}
function teamNeedsRole(team){return roleSlotStatus(team)!=='blocked';}
function roleSlotNote(team){
  const st=roleSlotStatus(team);
  return {vacancy:'🟢 同位置空缺，去了就是首发竞争',weaker:'🟡 同位置现役数据下滑，良性竞争上岗',crush:'🔵 你足够强——磨合期也能压过现役',unknown:'',blocked:''}[st]||'';
}
function makeOffer(team,salary,length){
  // 世界排名（第 36 轮）：邀约卡片显示目标队伍当前积分名次
  let worldRank=0;
  try{
    const l=getSortedPointsList();
    const i=l.findIndex(x=>x.name===team.name);
    if(i>=0)worldRank=i+1;
  }catch(e){}
  return {
    team:team.id,
    teamName:team.name,
    worldRank:worldRank,
    teamRegion:team.region,
    teamTier:team.tier,
    salary:Math.round(salary),
    contractLength:length,
    slotReason:roleSlotNote(team),
    isStarter:Math.random()>0.3
  };
}

function closeTeamHistoryEntry(){
  if(!G._teamHistory)return;
  for(let i=G._teamHistory.length-1;i>=0;i--){
    if(!G._teamHistory[i].to){G._teamHistory[i].to=`${G.year}.${G.month}`;break;}
  }
}

function acceptOffer(offer){
  const team=getTeam(offer.team);
  // Null check: team may not exist (e.g., offer from previous year)
  if(!team){
    showToast('该邀约已过期，队伍不存在','error');
    // Remove invalid offer from pending list
    const idx=G._pendingOffers?G._pendingOffers.indexOf(offer):-1;
    if(idx>=0)G._pendingOffers.splice(idx,1);
    closeModal();
    renderAll();
    return false;
  }
  let transferFee=0;
  // Load team roster
  const rosters=getTeamRostersByYear(G.year);
  const teamRoster=rosters[team.id];
  let roster=[];
  if(teamRoster&&teamRoster.players){
    roster=teamRoster.players.slice(0,5).map(p=>({...p,isPlayer:false}));
  }
  // Player replaces corresponding position if starter
  const playerEntry={
    id:'player',
    name:G.player.ign||G.player.name,
    role:G.player.role,
    aim:G.player.attrs.aim,
    utility:G.player.attrs.utility,
    communication:G.player.attrs.communication,
    gameSense:G.player.attrs.gameSense,
    isPlayer:true
  };
  if(offer.isStarter&&roster.length>0){
    const replaceIdx=roster.findIndex(p=>p.role===G.player.role);
    if(replaceIdx>=0){
      roster[replaceIdx]=playerEntry;
    } else {
      roster[0]=playerEntry;
    }
  }
  // If player has a contract, new team pays transfer fee (buyout)
  if(G.team&&G.team.contract.remaining>0){
    // Check release clause
    if(G.team.contract.releaseClause){
      transferFee=G.team.contract.releaseClause;
      G.eventLog.push({text:`触发解约条款，支付 ${formatMoney(transferFee)} 解约金`,type:'neutral',month:G.month,year:G.year});
    } else {
      // Transfer fee = old salary * remaining months * 0.5 (paid by new team)
      transferFee=Math.round(G.team.contract.salary*0.5*G.team.contract.remaining);
    }
    // Player gets a signing bonus from new team (10% of transfer fee or offer's signing bonus)
    const signingBonus=offer.signingBonus||Math.round(transferFee*0.1);
    G.money+=signingBonus;
    G.eventLog.push({text:`转会至 ${team.name}，签约奖金 ${formatMoney(signingBonus)}`,type:'positive',month:G.month,year:G.year});
  } else {
    // Free agent signing bonus
    if(offer.signingBonus){
      G.money+=offer.signingBonus;
      G.eventLog.push({text:`签约奖金 ${formatMoney(offer.signingBonus)}`,type:'positive',month:G.month,year:G.year});
    }
    G.eventLog.push({text:`加入 ${team.name}，月薪 ${formatMoney(offer.salary)}，合同 ${offer.contractLength} 个月`,type:'positive',month:G.month,year:G.year});
  }
  G.team={
    id:team.id, name:team.name, region:team.region, tier:team.tier,
    budget:team.budget, attract:team.attract,
    roster:roster,
    contract:{salary:offer.salary, length:offer.contractLength, remaining:offer.contractLength, releaseClause:offer.releaseClause},
    isStarter:offer.isStarter
  };
  ensureTeamPoints(); // 加入新队伍时确保积分榜条目（第 35 轮）
  // Update career level based on team tier (also resolves benched/freeAgent)
  const upgradable=['amateur','semiPro','benched','freeAgent'];
  if(team.tier==='topTier'||team.tier==='tier1'){
    if(upgradable.includes(G.careerLevel)) G.careerLevel='pro';
  } else if(team.tier==='tier2'||team.tier==='tier3'){
    if(['amateur','benched','freeAgent'].includes(G.careerLevel)) G.careerLevel='semiPro';
  }
  // New team chemistry break-in period
  G.teamChemistry=40;
  updateTeamChemistry('newPlayer');
  G.pressure=clamp(G.pressure-10,0,100);
  // 记录效力履历（退役总结用）
  closeTeamHistoryEntry();
  G._teamHistory=G._teamHistory||[];
  G._teamHistory.push({name:team.name,tier:team.tier,from:`${G.year}.${G.month}`,to:null});
  G.career.achievements.push(`${G.year}.${G.month} 加入 ${team.name}`);
  // Achievement checks for joining teams
  if(team.tier==='tier1') checkAchievement('join_tier1');
  if(team.tier==='topTier') checkAchievement('join_toptier');
  // Fame bonus from joining higher tier team
  if(team.tier==='topTier')addFame(3);
  else if(team.tier==='tier1')addFame(2);
  else if(team.tier==='tier2')addFame(1);
  closeModal();
  showToast(`成功加入 ${team.name}！${transferFee>0?'（转会费 '+formatMoney(transferFee)+'）':''}`,'success');
  renderAll();
  return true;
}

function processContract(){
  if(!G.team)return;
  G.team.contract.remaining--;
  if(G.team.contract.remaining<=0){
    G.eventLog.push({text:`与 ${G.team.name} 的合同到期`,type:'neutral',month:G.month,year:G.year});
    G.career.achievements.push(`${G.year}.${G.month} ${G.team.name} 合同到期`);
    closeTeamHistoryEntry();
    G.team=null;
    G.careerLevel='freeAgent';
  }
}

function checkBenching(){
  if(!G.team||!G.team.isStarter)return false;
  const recent=getRecentAvgRating(3,true);
  const teamTier=G.team.tier;
  let threshold=0.80;
  if(teamTier==='tier3')threshold=0.80;
  if(teamTier==='tier2')threshold=0.85;
  if(teamTier==='tier1')threshold=0.90;
  if(teamTier==='topTier')threshold=0.95;
  if(recent<threshold&&Math.random()<0.15){
    G.team.isStarter=false;
    G.careerLevel='benched';
    G.team.contract.salary=Math.round(G.team.contract.salary*0.5);
    G.pressure=clamp(G.pressure+15,0,100);
    G.eventLog.push({text:`被 ${G.team.name} 放到替补席！薪水减半。`,type:'negative',month:G.month,year:G.year});
    return true;
  }
  return false;
}

function checkUnbenching(){
  if(!G.team||G.team.isStarter)return false;
  const recent=getRecentAvgRating(3);
  // 快速回归：近期表现出色（有出场数据时）
  if(recent>1.0&&Math.random()<0.25){
    G.team.isStarter=true;
    G.careerLevel=G.team.tier==='tier2'?'semiPro':'pro';
    G.team.contract.salary=Math.round(G.team.contract.salary*1.5);
    G.pressure=clamp(G.pressure-10,0,100);
    G.eventLog.push({text:`重新回到 ${G.team.name} 首发阵容！`,type:'positive',month:G.month,year:G.year});
    return true;
  }
  // 替补熬机：坐满 3 个月后逐月提高回归概率（替补不出场、数据冻结，不能用表现判定），8 个月保底回归
  const months=G._monthsBenched||0;
  if(months>=3){
    const chance=Math.min(0.8,0.2+(months-3)*0.1);
    if(Math.random()<chance){
      G.team.isStarter=true;
      G.careerLevel=G.team.tier==='tier2'?'semiPro':'pro';
      G.team.contract.salary=Math.round(G.team.contract.salary*1.3);
      G.pressure=clamp(G.pressure-10,0,100);
      G.eventLog.push({text:`在替补席坐了 ${months} 个月后，${G.team.name} 给了你回归首发的机会！`,type:'positive',month:G.month,year:G.year});
      return true;
    }
  }
  return false;
}

// ============================================================
// PRESSURE SYSTEM
// ============================================================
function processPressure(monthlyResult){
  const p=G.player;
  const avgR=monthlyResult.avgRating;
  // Recent performance check
  const recentRatings=G.career.ratingHistory.slice(-2);
  if(recentRatings.length>=2&&recentRatings.every(r=>r.rating<avgR*0.95)){
    G.pressure=clamp(G.pressure+8,0,100);
    G.eventLog.push({text:'连续低迷表现，压力上升。',type:'negative',month:G.month,year:G.year});
  }
  // Team performance
  if(G.team){
    const winRate=monthlyResult.matches.length>0?monthlyResult.wins/monthlyResult.matches.length:0;
    if(winRate<0.3&&monthlyResult.matches.length>=3){
      G.pressure=clamp(G.pressure+6,0,100);
      G.eventLog.push({text:`战队本月成绩不佳（胜率${Math.round(winRate*100)}%），压力增加。`,type:'negative',month:G.month,year:G.year});
    }
    if(winRate>0.7&&monthlyResult.matches.length>=3){
      G.pressure=clamp(G.pressure-5,0,100);
    }
  }
  // Benched pressure
  if(G.team&&!G.team.isStarter){
    G.pressure=clamp(G.pressure+4,0,100);
  }
  // No major qualification
  if(G.careerLevel==='pro'||G.careerLevel==='semiPro'){
    const hasMajor=G.career.achievements.some(a=>a.includes('Major'));
    if(!hasMajor&&G.player.age>23){
      G.pressure=clamp(G.pressure+2,0,100);
    }
  }
  // Achievements reduce pressure
  if(avgR>1.10){
    G.pressure=clamp(G.pressure-3,0,100);
  }
  // Natural pressure decay
  G.pressure=clamp(G.pressure-1,0,100);
  return getPressureMessage();
}

function getPressureMessage(){
  for(const pm of PRESSURE_MESSAGES){
    if(G.pressure>=pm.min&&G.pressure<=pm.max)return pm;
  }
  return PRESSURE_MESSAGES[0];
}

// ============================================================
// LIFE SYSTEM
// ============================================================
function processLife(){
  const p=G.player;
   const l=G.life;
  // Rest reduces fatigue（小幅辅助：月末统一结算是主渠道——旧 rest*3 每月白送 -12 起步，叠加月末恢复后疲劳常年为 0）
  p.fatigue=clamp(p.fatigue-Math.floor(l.rest/3),0,100);
  // Entertainment affects mental
  p.mentalState=clamp(p.mentalState+l.entertainment*2-l.training*0.3,0,100);
  // Fitness affects physical（上限跟随年龄曲线：18-30 平台，30+ 衰退期不可逆推）
  const physCapAge=Math.min(p.potential.physical,getMaxPhysical(p.age,p.physicalCap||85));
  if(l.fitness>=3){
    p.attrs.physical=clamp(p.attrs.physical+0.5,10,physCapAge);
  } else if(l.fitness>=1){
    p.attrs.physical=clamp(p.attrs.physical+0.1,10,physCapAge);
  } else {
    p.attrs.physical=clamp(p.attrs.physical-0.1,10,physCapAge);
  }
  // High training without rest = danger
  if(l.training>10&&l.rest<4){
    p.fatigue=clamp(p.fatigue+10,0,100);
    p.mentalState=clamp(p.mentalState-5,0,100);
  }
}

// FINANCIAL SYSTEM
// ============================================================
const FAN_MILESTONES=[
  {t:10000,label:'1万',fame:3},
  {t:100000,label:'10万',fame:8},
  {t:1000000,label:'100万',fame:15},
  {t:10000000,label:'1000万',fame:25}
];

function processFinance(){
  let income=0,expense=0;
  if(G.team){
    income+=G.team.contract.salary;
  }
  // 直播不消耗体力：每月统一固定 30 场天梯
  let streamIncome=0;
  let ladderMatches=0;
  if(G.streaming.active!==false){
    ladderMatches=30;
    // 直播消耗体力：每月统一 15 点
    const streamSpent=Math.min(G.stamina,15);
    G.stamina-=streamSpent;
    G.staminaConsumed=(G.staminaConsumed||0)+streamSpent;
    G.player.fatigue=clamp(G.player.fatigue+3*getFatigueAgeRate(G.player.age),0,100); // 30 场直播天梯同样是负荷
    const marketAttention=G.marketAttention||0;
    const attraction=G.streaming.attraction||0;
    const baseViewers=Math.round(marketAttention*2+attraction*0.3);
    const levelBonus=G.careerLevel==='amateur'?1.0:G.careerLevel==='semiPro'?1.5:G.careerLevel==='pro'?2.5:4.0;
    const formBonus=1+(G.player.form-50)*0.005;
    const ladderBonus=1+ladderMatches*0.05;
    const avgViewers=Math.max(5000,Math.round(baseViewers*levelBonus*formBonus*ladderBonus*(0.8+Math.random()*0.4))); // 保底 5000 观众
    streamIncome=Math.round(avgViewers*randf(0.02,0.08));
    income+=streamIncome;
    const followerGrowth=Math.round(avgViewers*0.3*(0.5+Math.random())+ladderMatches*2);
    const beforeFollowers=G.streaming.followers;
    G.streaming.followers+=followerGrowth;
    // 粉丝里程碑：跨过阈值入队（advanceMonth 弹窗链消费）
    (FAN_MILESTONES||[]).forEach(mi=>{
      if(beforeFollowers<mi.t&&G.streaming.followers>=mi.t){
        G._pendingFanMilestones=G._pendingFanMilestones||[];
        G._pendingFanMilestones.push(mi);
        G.eventLog.push({text:`✨ 粉丝数突破 ${mi.t.toLocaleString()}！`,type:'positive',month:G.month,year:G.year});
      }
    });
    G.streaming.avgViewers=avgViewers;
    G.streaming.totalDonations+=streamIncome;
    G.streaming.monthlyIncome=streamIncome;
    G.streaming.ladderMatches=ladderMatches;
    if(avgViewers>0){
      const attentionGain=avgViewers/100*randf(0.1,0.3);
      G.marketAttention=Math.min(100,(G.marketAttention||0)+attentionGain);
    }
    if(ladderMatches>0){
      G.streaming.attraction=(G.streaming.attraction||0)+ladderMatches*0.5;
    }
  } else {
    G.streaming.monthlyIncome=0;
    G.streaming.avgViewers=0;
    G.streaming.ladderMatches=0;
  }
  // Living expenses
  expense+=500;
  if(G.careerLevel==='pro'||G.careerLevel==='semiPro')expense+=300;
  const trainingIntensity=G.training.intensity||'moderate';
  const trainingExpense={high:300,moderate:200,light:100}[trainingIntensity]||200;
  expense+=trainingExpense;
  G.money+=income-expense;
  if(G.money<0)G.money=0;
  return {income,expense,streamIncome,ladderMatches};
}
