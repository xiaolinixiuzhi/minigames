function processTraining(){
  const p=G.player;
  const attr=G.training.selected;
  const intensity=G.training.intensity||'moderate';
  const t=TRAINING_PARAMS[intensity];
  const ac=ageCoeff(p.age);
  
  // Check if enough stamina
  if(G.stamina<t.stamina){
    return {attr,gain:'0.00',staminaCost:0,overdraftFatigue:false,hitCap:false,fatigueChange:0,reason:'体力不足'};
  }
  
  // Only four-dim attributes can be trained directly
  const fourDims=['aim','utility','communication','gameSense'];
  const isFourDim=fourDims.includes(attr);
  // Get cap for this attribute (use fourDimCaps for four-dim, potential for others)
  const cap=isFourDim?(p.fourDimCaps?.[attr]||p.potential[attr]):p.potential[attr];
  const gap=Math.max(0.1,1-(p.attrs[attr]/cap));
  
  // Calculate gain: staminaCost × 0.08 × ageCoeff × gap × multiplier
  const baseGain=t.stamina*0.08*ac*gap*t.multiplier;
  const gain=Math.max(0.1,baseGain);
  
  let hitCap=false;
  // Check if already at cap
  if(p.attrs[attr]>=cap){
    hitCap=true;
    if(isFourDim){
      p.hasHitCapBefore=true; // Mark for "beyond limits" event
    }
  } else {
    p.attrs[attr]=clamp(p.attrs[attr]+gain,10,cap);
    // Check if hit cap after training
    if(p.attrs[attr]>=cap&&isFourDim){
      hitCap=true;
      p.hasHitCapBefore=true;
    }
  }
  
  // Team tier bonus for training
  const teamBonus=getTeamBonus();
  const bonusGain=gain*(teamBonus.training-1);
  if(!hitCap&&bonusGain>0){
    p.attrs[attr]=clamp(p.attrs[attr]+bonusGain,10,cap);
  }
  
  // Secondary attribute gains (small, only for consistency and mental, NOT physical)
  if(!hitCap){
    ATTRS.forEach(a=>{
      if(a!==attr&&a!=='physical'&&Math.random()<0.3&&!fourDims.includes(a)){
        // Only consistency, mental, physical can grow as secondary
        const secGap=1-(p.attrs[a]/p.potential[a]);
        const ageMult=a==='mental'?mentalAgeCoeff(p.age):1;
        const secGain=t.stamina*0.03*ac*secGap*ageMult;
        p.attrs[a]=clamp(p.attrs[a]+secGain,10,p.potential[a]);
      }
    });
  }
  
  // Consume stamina
  const staminaCost=t.stamina;
  G.stamina-=staminaCost;
  
  // Calculate fatigue change
  const surplusAfter=G.stamina;
  const recoveryFromSurplus=Math.floor(surplusAfter/RECOVERY_PARAMS.surplusPer);
  const baseRecovery=Math.floor(p.physical*RECOVERY_PARAMS.baseRate);
  const fatigueChange=t.fatigue-recoveryFromSurplus-baseRecovery;
  p.fatigue=clamp(p.fatigue+fatigueChange,0,100);
  
  // High intensity affects mental state
  if(intensity==='high'){
    p.mentalState=clamp(p.mentalState-2,0,100);
  }
  
  return {attr,gain:hitCap?'0.00':gain.toFixed(2),staminaCost,overdraftFatigue:false,hitCap,fatigueChange};
}

function oneClickTrain(){
  const p=G.player;
  const w=ROLE_WEIGHTS[p.role];
  const fourDims=['aim','utility','communication','gameSense'];
  // Sort four-dim attributes by need (gap * weight), only train four-dim
  const sorted=fourDims.slice().sort((a,b)=>{
    const capA=p.fourDimCaps?.[a]||p.potential[a];
    const capB=p.fourDimCaps?.[b]||p.potential[b];
    return w[b]*(1-p.attrs[b]/capB) - w[a]*(1-p.attrs[a]/capA);
  });
  // Store multi-attribute plan for advanceMonth to execute
  G.training._oneClickPlan=[
    {attr:sorted[0],hours:8},
    {attr:sorted[1],hours:8},
    {attr:sorted[2],hours:4}
  ];
  // Set primary training for display
  G.training.selected=sorted[0];
  G.training.hours=8;
  G.training.intensity='moderate';
  p.fatigue=clamp(p.fatigue-5,0,100);
  p.mentalState=clamp(p.mentalState+3,0,100);
  showToast(`训练计划已设置：${ATTR_SHORT[sorted[0]]}、${ATTR_SHORT[sorted[1]]}、${ATTR_SHORT[sorted[2]]}`,'success');
}

// ============================================================
// MATCH SIMULATION
// ============================================================
function simulateMatch(opponentSkill, isTournament, tournamentTier, matchType, isPlayoff, isFinal, teamRoster){
  const p=G.player;
  matchType=matchType||(tournamentTier==='major'?'major':tournamentTier==='superElite'?'superElite':tournamentTier==='tier1'?'tier1':tournamentTier==='tier2'?'tier2':'ladder');
  // Determine match stage for mental base
  const matchStage=tournamentTier||G.team?.tier||getDefaultMatchStage();
  // Estimate matches this month (will be refined in generateMonthlyMatches)
  const matchesThisMonth=G.careerLevel==='amateur'?4:G.careerLevel==='semiPro'?6:8;
  // Calculate player power using new system
  let myPower=calculateMatchPower(p.attrs,p.role,matchStage,matchesThisMonth,p.form,p.fatigue,isPlayoff,isFinal);
  // "Beyond limits" event: 0.1% chance per match if has hit cap before
  let beyondLimitsTriggered=false;
  let beyondLimitsAttr=null;
  if(p.hasHitCapBefore&&Math.random()<0.001){
    // Find a bottleneck attribute (at cap)
    const fourDims=['aim','utility','communication','gameSense'];
    const bottleneckAttrs=fourDims.filter(a=>p.attrs[a]>=(p.fourDimCaps?.[a]||p.potential[a]));
    if(bottleneckAttrs.length>0){
      beyondLimitsAttr=bottleneckAttrs[rand(0,bottleneckAttrs.length-1)];
      beyondLimitsTriggered=true;
      // Boost power by 1.5x for this match (applied to the attribute's contribution)
      myPower*=1.5;
      // Permanently raise cap by 5
      if(!p.fourDimCaps)p.fourDimCaps={aim:0,utility:0,communication:0,gameSense:0};
      p.fourDimCaps[beyondLimitsAttr]=(p.fourDimCaps[beyondLimitsAttr]||p.potential[beyondLimitsAttr])+5;
    }
  }
  // Team bonus from chemistry
  const teamBonus=G.team?G.teamChemistry/100*0.05:0;
  const myEffective=myPower*(1+teamBonus);
  // Calculate opponent power (use team roster if available for IGL multiplier)
  const oppPower=calculateOpponentPower(opponentSkill,matchStage,teamRoster);
  const oppEffective=oppPower*(1+randf(-0.03,0.03));
  // Win probability based on power comparison
  const winProb=myEffective/(myEffective+oppEffective);
  const win=Math.random()<winProb;
  const myRounds=win?rand(13,16):rand(4,12);
  const oppRounds=30-myRounds;
  // Consume stamina for this map (1 map per simulateMatch call)
  const staminaCost=getMatchStaminaCost(matchType,1);
  const overdraftFatigue=tryConsumeStamina(staminaCost);
  // Rating = power difference (NO clamping per spec)
  const ratingDiff=(myEffective-oppEffective)/100;
  let matchRating=1.0+ratingDiff+randf(-0.08,0.08);
  // Mental base by tournament tier and stage
  let mentalBase;
  const tierMental=MENTAL_BASE_BY_TIER[tournamentTier];
  if(tierMental){
    if(isFinal)mentalBase=tierMental.final;
    else if(isPlayoff)mentalBase=tierMental.playoff;
    else mentalBase=tierMental.group;
  } else {
    // Fallback to old system for non-tournament matches
    mentalBase=MENTAL_BASE[matchStage]||MENTAL_BASE.amateur;
    if(isFinal)mentalBase+=20;
    else if(isPlayoff)mentalBase+=10;
  }
  // Update mental attribute: move toward base by 0.1 per match (scaled by age)
  if(p.attrs.mental<mentalBase){
    p.attrs.mental=Math.min(p.attrs.mental+0.1*mentalAgeCoeff(p.age),mentalBase);
  }
  // Also apply the existing mental gain formula (for larger gains, scaled by age)
  const mentalGain=Math.max(0,((mentalBase+20)-p.attrs.mental)/20)*mentalAgeCoeff(p.age);
  p.attrs.mental=Math.min(p.potential.mental,p.attrs.mental+mentalGain);
  // Stats scale with match rating
  const kills=clamp(Math.round(matchRating*rand(12,16)+(win?2:0)),4,30);
  const deaths=clamp(Math.round((2.2-matchRating)*rand(10,15)),4,22);
  const assists=rand(2,7);
  const adr=clamp(Math.round(matchRating*rand(50,65)+rand(5,10)),25,120);
  const kast=clamp(Math.round(matchRating*rand(30,35)+rand(20,28)),40,95);
  const openingKills=win?rand(1,3):rand(0,2);
  const clutch=matchRating>1.1&&win?rand(0,2):0;
  return {
    date:`${G.year}.${G.month}`,
    opponent:teamRoster?teamRoster.name:getTeamName(opponentSkill),
    isTournament,
    tournamentTier:tournamentTier||null,
    matchType,
    isPlayoff:isPlayoff||false,
    isFinal:isFinal||false,
    win,
    score:`${myRounds}:${oppRounds}`,
    kills,deaths,assists,adr,kast,
    openingKills,clutch,
    rating:parseFloat(matchRating.toFixed(2)),
    kd:deaths>0?(kills/deaths).toFixed(2):kills.toFixed(2),
    staminaCost,
    overdraftFatigue,
    beyondLimits:beyondLimitsTriggered?{attr:beyondLimitsAttr,newCap:p.fourDimCaps[beyondLimitsAttr]}:null
  };
}

function getTeamName(skill){
  // Use year-aware roster team names based on skill level
  const rosters=getTeamRostersByYear(G.year);
  const topTeams=Object.values(rosters).filter(t=>t.tier==='topTier');
  const tier1Teams=Object.values(rosters).filter(t=>t.tier==='tier1');
  const tier2Teams=Object.values(rosters).filter(t=>t.tier==='tier2');
  const tier3Teams=Object.values(rosters).filter(t=>t.tier==='tier3');
  if(skill>85)return topTeams[rand(0,topTeams.length-1)]?.name||'Top Team';
  if(skill>70)return tier1Teams[rand(0,tier1Teams.length-1)]?.name||'Tier1 Team';
  if(skill>55)return tier2Teams[rand(0,tier2Teams.length-1)]?.name||'Tier2 Team';
  if(skill>40)return tier3Teams[rand(0,tier3Teams.length-1)]?.name||'Tier3 Team';
  const names=['路人战队','小型战队','地区战队','新军战队','FPL队伍'];
  return names[rand(0,names.length-1)];
}

// Get a random team roster for opponent generation (year-aware)
function getRandomTeamRoster(targetTier){
  return getRandomTeamRosterByYear(G.year, targetTier);
}

function generateMonthlyMatches(){
  const matches=[];
  const level=G.careerLevel;
  if(level==='amateur'){
    // Ladder opponents: ability ~30, no team structure (no IGL multiplier)
    const count=rand(3,6);
    for(let i=0;i<count;i++){
      matches.push(simulateMatch(30+rand(0,10),false,null));
    }
  } else if(level==='semiPro'){
    // SemiPro: face tier3 and tier2 teams
    const count=rand(4,8);
    for(let i=0;i<count;i++){
      const useRoster=Math.random()<0.6;
      let roster=null;
      let skill=45+rand(0,15);
      if(useRoster){
        roster=getRandomTeamRoster(Math.random()<0.4?'tier3':'tier2');
        if(roster)skill=calcTeamStrength(roster.players)/5;
      }
      matches.push(simulateMatch(skill,i<2,'tier2','tier2',false,false,roster));
    }
  } else {
    const count=rand(6,10);
    const tier=G.team?.tier||'tier1';
    // Opponent tiers based on player's team tier
    let oppTiers;
    if(tier==='topTier') oppTiers=['topTier','topTier','tier1','tier1','tier2'];
    else if(tier==='tier1') oppTiers=['tier1','tier1','tier1','tier2','tier2'];
    else oppTiers=['tier2','tier2','tier2','tier1','tier1'];
    for(let i=0;i<count;i++){
      const oppTier=oppTiers[rand(0,oppTiers.length-1)];
      const roster=getRandomTeamRoster(oppTier);
      let skill;
      if(roster){
        skill=calcTeamStrength(roster.players)/5;
      } else {
        skill=getTeamOpponentStrength(level,oppTier,G.year);
      }
      const isT=i<count-2;
      const isPlayoff=isT&&i>=count-4;
      const isFinal=isT&&i===count-1;
      matches.push(simulateMatch(skill,isT,oppTier,oppTier,isPlayoff,isFinal,roster));
    }
  }
  return matches;
}

function processMatches(){
  const matches=generateMonthlyMatches();
  let wins=0,losses=0,ratingSum=0;
  let amateurRatingSum=0,amateurMatchCount=0;
  let beyondLimitsEvents=[];
  matches.forEach(m=>{
    if(m.win)wins++;else losses++;
    ratingSum+=m.rating;
    G.career.matchLog.push(m);
    // Track "beyond limits" events
    if(m.beyondLimits){
      beyondLimitsEvents.push(m.beyondLimits);
    }
    // Track amateur match ratings for streaming growth
    if(G.careerLevel==='amateur'||!G.team){
      amateurRatingSum+=m.rating;
      amateurMatchCount++;
    }
  });
  // Log beyond limits events
  beyondLimitsEvents.forEach(ev=>{
    const attrName={aim:'枪法',utility:'道具',communication:'沟通',gameSense:'战术'}[ev.attr]||ev.attr;
    G.eventLog.push({text:`✨ 超越极限！${attrName}发挥提升1.5倍，上限提高至${ev.newCap}！`,type:'positive',month:G.month,year:G.year});
    checkAchievement('transcend');
  });
  G.career.totalMatches+=matches.length;
  G.career.wins+=wins;
  G.career.losses+=losses;
  const avgR=matches.length>0?ratingSum/matches.length:0;
  G.career.ratingHistory.push({month:`${G.year}.${G.month}`,rating:parseFloat(avgR.toFixed(2))});
  if(avgR>G.career.bestRating)G.career.bestRating=parseFloat(avgR.toFixed(2));
  G.career.avgRating=G.career.ratingHistory.length>0?
    parseFloat((G.career.ratingHistory.reduce((s,r)=>s+r.rating,0)/G.career.ratingHistory.length).toFixed(2)):0;
  
  // Achievement checks
  if(G.career.totalMatches===1) checkAchievement('first_match');
  if(G.career.totalMatches===10) checkAchievement('ten_matches');
  if(G.career.wins===100) checkAchievement('hundred_wins');
  if(avgR>=1.50) checkAchievement('rating_150');
  if(avgR>=1.80) checkAchievement('rating_180');
  
  // Check for 1v4/1v5 clutches (simulated based on high rating and wins)
  if(avgR>=1.80&&wins>0&&Math.random()<0.1) checkAchievement('first_1v5');
  else if(avgR>=1.50&&wins>0&&Math.random()<0.15) checkAchievement('first_1v4');
  
  // Update streaming attraction based on amateur ratings
  if(amateurMatchCount>0){
    const amateurAvg=amateurRatingSum/amateurMatchCount;
    // Higher rating = more viewers attracted
    // Rating 1.0 = neutral, 1.2 = +20% growth, 0.8 = -20% growth
    const attractionMod=(amateurAvg-1.0)*50; // -50 to +50 based on rating
    G.streaming.attraction=G.streaming.attraction||0;
    G.streaming.attraction=Math.max(0,G.streaming.attraction+attractionMod+amateurMatchCount*2);
    // Each amateur match adds to follower growth potential
    G.streaming.matchCount=(G.streaming.matchCount||0)+amateurMatchCount;
  }
  // Update form based on relative performance (1.0 = average)
  if(avgR>1.10)G.player.form=clamp(G.player.form+rand(3,8),0,100);
  else if(avgR<0.90)G.player.form=clamp(G.player.form-rand(3,8),0,100);
  // Fatigue is now handled by stamina system (overdraft) and event fatigue
  return {matches,wins,losses,avgRating:parseFloat(avgR.toFixed(2))};
}

// ============================================================
// CAREER PROGRESSION
// ============================================================
function getRecentAvgRating(n){
  const h=G.career.ratingHistory;
  if(h.length===0)return 0;
  const recent=h.slice(-n);
  return recent.reduce((s,r)=>s+r.rating,0)/recent.length;
}

function checkCareerProgression(){
  const recent=getRecentAvgRating(3);
  const level=G.careerLevel;
  const events=[];
  // Amateur to semiPro: need consistent >1.05 rating (dominating amateur level)
  // A player with skill 45 vs amateur opponents (skill 40) gets ~1.05
  if(level==='amateur'&&recent>=1.05&&G.career.totalMatches>=6){
    events.push({type:'promotion',text:'你在天梯中稳定carry，半职业战队开始关注你！',level:'semiPro'});
  }
  // SemiPro to pro: need consistent >1.10 rating (high-level performance at tier2)
  // A player with skill 62 vs semiPro opponents (skill 52) gets ~1.10
  if(level==='semiPro'&&recent>=1.10&&G.career.totalMatches>=15){
    events.push({type:'promotion',text:'你在二线赛事中的表现引起了一线俱乐部的注意！',level:'pro'});
  }
  return events;
}

function generateTeamOffers(){
  const offers=[];
  const recent=getRecentAvgRating(3);
  const level=G.careerLevel;
  const yearTeams=getTeamsDBByYear(G.year);
  // Amateur: tier3 offers for decent performance, tier2 for dominating
  if(level==='amateur'){
    // tier3 offer: >0.95 (showing promise in ladder)
    if(recent>0.95&&Math.random()<0.4){
      const tier3=yearTeams.filter(t=>t.tier==='tier3');
      if(tier3.length>0){
        const t=tier3[rand(0,tier3.length-1)];
        offers.push(makeOffer(t,rand(400,1200),rand(6,12)));
      }
    }
    // tier2 offer: >1.05 (dominating amateur level)
    if(recent>1.05&&Math.random()<0.3){
      const tier2=yearTeams.filter(t=>t.tier==='tier2');
      if(tier2.length>0){
        const t=tier2[rand(0,tier2.length-1)];
        offers.push(makeOffer(t,rand(800,2000),rand(6,12)));
      }
    }
  }
  // SemiPro: tier2 offers for decent performance, tier1 for dominating
  else if(level==='semiPro'){
    // tier2 offer: >0.95 (maintaining decent performance at semiPro level)
    if(recent>0.95&&Math.random()<0.4){
      const tier2=yearTeams.filter(t=>t.tier==='tier2');
      if(tier2.length>0){
        const t=tier2[rand(0,tier2.length-1)];
        offers.push(makeOffer(t,rand(2000,6000),rand(12,24)));
      }
    }
    // tier1 offer: >1.10 (dominating semiPro level, showing high-level potential)
    if(recent>1.10&&Math.random()<0.2){
      const tier1=yearTeams.filter(t=>t.tier==='tier1');
      if(tier1.length>0){
        const t=tier1[rand(0,tier1.length-1)];
        offers.push(makeOffer(t,rand(8000,20000),rand(12,24)));
      }
    }
  }
  // Pro/benched/freeAgent: offers based on recent performance relative to tier
  else if(level==='pro'||level==='benched'||level==='freeAgent'){
    // topTier offer: >1.10 (exceptional performance at tier1 level)
    if(recent>1.10&&Math.random()<0.25){
      const top=yearTeams.filter(t=>t.tier==='topTier');
      if(top.length>0){
        const t=top[rand(0,top.length-1)];
        offers.push(makeOffer(t,rand(20000,60000),rand(12,36)));
      }
    }
    // tier1 offer: >0.95 (decent performance at pro level)
    if(recent>0.95&&Math.random()<0.35){
      const tier1=yearTeams.filter(t=>t.tier==='tier1');
      if(tier1.length>0){
        const t=tier1[rand(0,tier1.length-1)];
        offers.push(makeOffer(t,rand(10000,30000),rand(12,36)));
      }
    }
    // tier2 offer: >0.85 (struggling at tier1 but still has pro experience)
    if(recent>0.85&&Math.random()<0.4){
      const tier2=yearTeams.filter(t=>t.tier==='tier2');
      if(tier2.length>0){
        const t=tier2[rand(0,tier2.length-1)];
        offers.push(makeOffer(t,rand(3000,10000),rand(12,24)));
      }
    }
  }
  // Safety net: guarantee one reasonable offer after 3 months without any (amateur) or 6 months (others)
  if(offers.length===0&&G.career.totalMatches>0){
    if(!G._lastOfferMonth)G._lastOfferMonth=G.year*12+G.month;
    const monthsSince=(G.year*12+G.month)-G._lastOfferMonth;
    const safetyThreshold=level==='amateur'?3:6;
    if(monthsSince>=safetyThreshold){
      G._lastOfferMonth=G.year*12+G.month;
      if(level==='amateur'){
        const tier3=yearTeams.filter(t=>t.tier==='tier3');
        const tier2=yearTeams.filter(t=>t.tier==='tier2');
        const t=tier3.length>0?tier3[rand(0,tier3.length-1)]:(tier2.length>0?tier2[0]:yearTeams[0]);
        if(t)offers.push(makeOffer(t,rand(400,1200),rand(6,12)));
      } else if(level==='semiPro'){
        const tier2=yearTeams.filter(t=>t.tier==='tier2');
        if(tier2.length>0){
          const t=tier2[rand(0,tier2.length-1)];
          offers.push(makeOffer(t,rand(1500,4000),rand(12,18)));
        }
      } else {
        const tier2=yearTeams.filter(t=>t.tier==='tier2');
        if(tier2.length>0){
          const t=tier2[rand(0,tier2.length-1)];
          offers.push(makeOffer(t,rand(2500,6000),rand(12,18)));
        }
      }
    }
  }
  return offers;
}

function makeOffer(team,salary,length){
  return {
    team:team.id,
    teamName:team.name,
    teamRegion:team.region,
    teamTier:team.tier,
    salary:Math.round(salary),
    contractLength:length,
    isStarter:Math.random()>0.3
  };
}

function acceptOffer(offer){
  const team=getTeam(offer.team);
  // Null check: team may not exist (e.g., offer from previous year)
  if(!team){
    showToast('该邀约已过期，队伍不存在','error');
    // Remove invalid offer from pending list
    const idx=G._pendingOffers?G._pendingOffers.indexOf(offer):-1;
    if(idx>=0)G._pendingOffers.splice(idx,1);
    closeModal();
    renderAll();
    return false;
  }
  let transferFee=0;
  // Load team roster
  const rosters=getTeamRostersByYear(G.year);
  const teamRoster=rosters[team.id];
  let roster=[];
  if(teamRoster&&teamRoster.players){
    roster=teamRoster.players.slice(0,5).map(p=>({...p,isPlayer:false}));
  }
  // Player replaces corresponding position if starter
  const playerEntry={
    id:'player',
    name:G.player.ign||G.player.name,
    role:G.player.role,
    aim:G.player.attrs.aim,
    utility:G.player.attrs.utility,
    communication:G.player.attrs.communication,
    gameSense:G.player.attrs.gameSense,
    isPlayer:true
  };
  if(offer.isStarter&&roster.length>0){
    const replaceIdx=roster.findIndex(p=>p.role===G.player.role);
    if(replaceIdx>=0){
      roster[replaceIdx]=playerEntry;
    } else {
      roster[0]=playerEntry;
    }
  }
  // If player has a contract, new team pays transfer fee (buyout)
  if(G.team&&G.team.contract.remaining>0){
    // Check release clause
    if(G.team.contract.releaseClause){
      transferFee=G.team.contract.releaseClause;
      G.eventLog.push({text:`触发解约条款，支付 ${formatMoney(transferFee)} 解约金`,type:'neutral',month:G.month,year:G.year});
    } else {
      // Transfer fee = old salary * remaining months * 0.5 (paid by new team)
      transferFee=Math.round(G.team.contract.salary*0.5*G.team.contract.remaining);
    }
    // Player gets a signing bonus from new team (10% of transfer fee or offer's signing bonus)
    const signingBonus=offer.signingBonus||Math.round(transferFee*0.1);
    G.money+=signingBonus;
    G.eventLog.push({text:`转会至 ${team.name}，签约奖金 ${formatMoney(signingBonus)}`,type:'positive',month:G.month,year:G.year});
  } else {
    // Free agent signing bonus
    if(offer.signingBonus){
      G.money+=offer.signingBonus;
      G.eventLog.push({text:`签约奖金 ${formatMoney(offer.signingBonus)}`,type:'positive',month:G.month,year:G.year});
    }
    G.eventLog.push({text:`加入 ${team.name}，月薪 ${formatMoney(offer.salary)}，合同 ${offer.contractLength} 个月`,type:'positive',month:G.month,year:G.year});
  }
  G.team={
    id:team.id, name:team.name, region:team.region, tier:team.tier,
    budget:team.budget, attract:team.attract,
    roster:roster,
    contract:{salary:offer.salary, length:offer.contractLength, remaining:offer.contractLength, releaseClause:offer.releaseClause},
    isStarter:offer.isStarter
  };
  // Update career level based on team tier
  if(team.tier==='topTier'||team.tier==='tier1'){
    if(G.careerLevel==='amateur'||G.careerLevel==='semiPro') G.careerLevel='pro';
  } else if(team.tier==='tier2'){
    if(G.careerLevel==='amateur') G.careerLevel='semiPro';
    else if(G.careerLevel==='semiPro') G.careerLevel='semiPro'; // stay semiPro
  } else if(team.tier==='tier3'){
    if(G.careerLevel==='amateur') G.careerLevel='semiPro'; // tier3 is still semi-pro level
  }
  // New team chemistry break-in period
  G.teamChemistry=40;
  updateTeamChemistry('newPlayer');
  G.pressure=clamp(G.pressure-10,0,100);
  G.career.achievements.push(`${G.year}.${G.month} 加入 ${team.name}`);
  // Achievement checks for joining teams
  if(team.tier==='tier1') checkAchievement('join_tier1');
  if(team.tier==='topTier') checkAchievement('join_toptier');
  // Fame bonus from joining higher tier team
  if(team.tier==='topTier')addFame(3);
  else if(team.tier==='tier1')addFame(2);
  else if(team.tier==='tier2')addFame(1);
  closeModal();
  showToast(`成功加入 ${team.name}！${transferFee>0?'（转会费 '+formatMoney(transferFee)+'）':''}`,'success');
  renderAll();
  return true;
}

function processContract(){
  if(!G.team)return;
  G.team.contract.remaining--;
  if(G.team.contract.remaining<=0){
    G.eventLog.push({text:`与 ${G.team.name} 的合同到期`,type:'neutral',month:G.month,year:G.year});
    G.career.achievements.push(`${G.year}.${G.month} ${G.team.name} 合同到期`);
    G.team=null;
    G.careerLevel='freeAgent';
  }
}

function checkBenching(){
  if(!G.team||!G.team.isStarter)return false;
  const recent=getRecentAvgRating(3);
  const teamTier=G.team.tier;
  let threshold=0.80;
  if(teamTier==='tier3')threshold=0.80;
  if(teamTier==='tier2')threshold=0.85;
  if(teamTier==='tier1')threshold=0.90;
  if(teamTier==='topTier')threshold=0.95;
  if(recent<threshold&&Math.random()<0.15){
    G.team.isStarter=false;
    G.careerLevel='benched';
    G.team.contract.salary=Math.round(G.team.contract.salary*0.5);
    G.pressure=clamp(G.pressure+15,0,100);
    G.eventLog.push({text:`被 ${G.team.name} 放到替补席！薪水减半。`,type:'negative',month:G.month,year:G.year});
    return true;
  }
  return false;
}

function checkUnbenching(){
  if(!G.team||G.team.isStarter)return false;
  const recent=getRecentAvgRating(3);
  if(recent>1.0&&Math.random()<0.25){
    G.team.isStarter=true;
    G.careerLevel=G.team.tier==='tier2'?'semiPro':'pro';
    G.team.contract.salary=Math.round(G.team.contract.salary*1.5);
    G.pressure=clamp(G.pressure-10,0,100);
    G.eventLog.push({text:`重新回到 ${G.team.name} 首发阵容！`,type:'positive',month:G.month,year:G.year});
    return true;
  }
  return false;
}

// ============================================================
// PRESSURE SYSTEM
// ============================================================
function processPressure(monthlyResult){
  const p=G.player;
  const avgR=monthlyResult.avgRating;
  // Recent performance check
  const recentRatings=G.career.ratingHistory.slice(-2);
  if(recentRatings.length>=2&&recentRatings.every(r=>r.rating<avgR*0.95)){
    G.pressure=clamp(G.pressure+8,0,100);
    G.eventLog.push({text:'连续低迷表现，压力上升。',type:'negative',month:G.month,year:G.year});
  }
  // Team performance
  if(G.team){
    const winRate=monthlyResult.matches.length>0?monthlyResult.wins/monthlyResult.matches.length:0;
    if(winRate<0.3&&monthlyResult.matches.length>=3){
      G.pressure=clamp(G.pressure+6,0,100);
      G.eventLog.push({text:`战队本月成绩不佳（胜率${Math.round(winRate*100)}%），压力增加。`,type:'negative',month:G.month,year:G.year});
    }
    if(winRate>0.7&&monthlyResult.matches.length>=3){
      G.pressure=clamp(G.pressure-5,0,100);
    }
  }
  // Benched pressure
  if(G.team&&!G.team.isStarter){
    G.pressure=clamp(G.pressure+4,0,100);
  }
  // No major qualification
  if(G.careerLevel==='pro'||G.careerLevel==='semiPro'){
    const hasMajor=G.career.achievements.some(a=>a.includes('Major'));
    if(!hasMajor&&G.player.age>23){
      G.pressure=clamp(G.pressure+2,0,100);
    }
  }
  // Achievements reduce pressure
  if(avgR>1.10){
    G.pressure=clamp(G.pressure-3,0,100);
  }
  // Natural pressure decay
  G.pressure=clamp(G.pressure-1,0,100);
  return getPressureMessage();
}

function getPressureMessage(){
  for(const pm of PRESSURE_MESSAGES){
    if(G.pressure>=pm.min&&G.pressure<=pm.max)return pm;
  }
  return PRESSURE_MESSAGES[0];
}

// ============================================================
// LIFE SYSTEM
// ============================================================
function processLife(){
  const p=G.player;
   const l=G.life;
  // Rest reduces fatigue
  p.fatigue=clamp(p.fatigue-l.rest*3+3,0,100);
  // Entertainment affects mental
  p.mentalState=clamp(p.mentalState+l.entertainment*2-l.training*0.3,0,100);
  // Fitness affects physical
  if(l.fitness>=3){
    p.attrs.physical=clamp(p.attrs.physical+0.5,10,p.potential.physical);
  } else if(l.fitness>=1){
    p.attrs.physical=clamp(p.attrs.physical+0.1,10,p.potential.physical);
  } else {
    p.attrs.physical=clamp(p.attrs.physical-0.1,10,p.potential.physical);
  }
  // High training without rest = danger
  if(l.training>10&&l.rest<4){
    p.fatigue=clamp(p.fatigue+10,0,100);
    p.mentalState=clamp(p.mentalState-5,0,100);
  }
}

// ============================================================
// FINANCIAL SYSTEM
// ============================================================
function processFinance(){
  let income=0,expense=0;
  if(G.team){
    income+=G.team.contract.salary;
  }
  // Streaming (only if streaming is active)
  let streamIncome=0;
  let ladderMatches=0;
  if(G.streaming.active!==false){
    // Convert remaining stamina to ladder matches
    ladderMatches=Math.floor(G.stamina);
    G.stamina=0;
    
    // Market attention is the main driver of viewers (80%)
    const marketAttention=G.marketAttention||0;
    const attraction=G.streaming.attraction||0;
    // Viewers: 80% from market attention, 20% from attraction
    const baseViewers=Math.round(marketAttention*2+attraction*0.3);
    // Level bonus (higher career = more visibility)
    const levelBonus=G.careerLevel==='amateur'?1.0:G.careerLevel==='semiPro'?1.5:G.careerLevel==='pro'?2.5:4.0;
    // Form bonus
    const formBonus=1+(G.player.form-50)*0.005;
    // Ladder matches boost viewers
    const ladderBonus=1+ladderMatches*0.05;
    const avgViewers=Math.max(0,Math.round(baseViewers*levelBonus*formBonus*ladderBonus*(0.8+Math.random()*0.4)));
    // Income based on viewers (hidden but still calculated)
    streamIncome=Math.round(avgViewers*randf(0.02,0.08));
    income+=streamIncome;
    // Follower growth based on viewers and ladder matches
    const followerGrowth=Math.round(avgViewers*0.3*(0.5+Math.random())+ladderMatches*2);
    G.streaming.followers+=followerGrowth;
    G.streaming.avgViewers=avgViewers;
    G.streaming.totalDonations+=streamIncome;
    G.streaming.monthlyIncome=streamIncome;
    G.streaming.ladderMatches=ladderMatches;
    // Viewers contribute small amount back to market attention (0.1-0.3 per 100 viewers)
    if(avgViewers>0){
      const attentionGain=avgViewers/100*randf(0.1,0.3);
      G.marketAttention=Math.min(100,(G.marketAttention||0)+attentionGain);
    }
    // Streaming gives small rating boost
    if(ladderMatches>0){
      G.streaming.attraction=(G.streaming.attraction||0)+ladderMatches*0.5;
    }
  } else {
    G.streaming.monthlyIncome=0;
    G.streaming.avgViewers=0;
    G.streaming.ladderMatches=0;
    // Not streaming: remaining stamina recovers fatigue
    const staminaRecovery=Math.floor(G.stamina/RECOVERY_PARAMS.surplusPer);
    G.player.fatigue=Math.max(0,G.player.fatigue-staminaRecovery);
  }
  // Living expenses
  expense+=500;
  if(G.careerLevel==='pro'||G.careerLevel==='semiPro')expense+=300;
  // Training expense based on intensity
  const trainingIntensity=G.training.intensity||'moderate';
  const trainingExpense={high:300,moderate:200,light:100}[trainingIntensity]||200;
  expense+=trainingExpense;
  G.money+=income-expense;
  if(G.money<0)G.money=0;
  return {income,expense,streamIncome,ladderMatches};
}

// ============================================================
// MONTHLY ADVANCEMENT
// ============================================================
function advanceMonth(){
  if(G.retired){showToast('职业生涯已结束','info');return}
  const logs=[];
  // Capture current month for logging (before increment)
  const logYear=G.year;
  const logMonth=G.month;
  // 0. Initialize monthly stamina & apply pending fatigue recovery
  initMonthlyStamina();
  const recoveryLogs=processPendingFatigueRecovery();
  recoveryLogs.forEach(l=>logs.push(l));
  G._preMonthMatches=G.career.totalMatches;
  // Defensive: ensure required fields exist
  if(G.player.fatigue===undefined)G.player.fatigue=20;
  if(G.player.mentalState===undefined)G.player.mentalState=70;
  if(G.player.form===undefined)G.player.form=50;
  if(G.staminaMax===undefined)G.staminaMax=100;
  logs.push(`体力初始化：上限 ${G.staminaMax.toFixed(0)}，当前疲劳 ${G.player.fatigue.toFixed(0)}`);
  // 1. Process training (execute one-click plan if exists, otherwise normal training)
  const intensityLabel={high:'高强度',moderate:'适量',light:'轻度'}[G.training.intensity||'moderate'];
  if(G.training._oneClickPlan){
    const plan=G.training._oneClickPlan;
    const gains=[];
    let hitAnyCap=false;
    plan.forEach(p=>{
      G.training.selected=p.attr;
      G.training.hours=p.hours;
      G.training.intensity=G.training.intensity||'moderate';
      const r=processTraining();
      if(r.hitCap)hitAnyCap=true;
      gains.push(`${ATTR_SHORT[r.attr]}+${r.gain}`);
    });
    logs.push(`训练[${intensityLabel}]：${gains.join('，')}${hitAnyCap?' [瓶颈]':''}`);
    delete G.training._oneClickPlan;
  } else {
    const trainResult=processTraining();
    logs.push(`训练[${intensityLabel}]：${ATTR_SHORT[trainResult.attr]} +${trainResult.gain}${trainResult.hitCap?' [瓶颈]':''}`);
  }
  // 2. Process life
  processLife();
  // 3. Process matches
  const matchResult=processMatches();
  logs.push(`比赛：${matchResult.wins}胜${matchResult.losses}负，平均Rating ${matchResult.avgRating}`);
  // 3b. MVP checks
  if(matchResult.avgRating>1.0){
    const teamAvg=matchResult.avgRating*0.9;
    if(checkMatchMVP(matchResult.avgRating,teamAvg)){
      logs.push(`🏆 获得比赛 MVP！`);
    }
  }
  // 4. Random events
  const events=processRandomEvents();
  events.forEach(e=>logs.push(`事件：${e.name}`));
  // 4b. Historical events
  const histEvents=processHistoricalEvents();
  histEvents.forEach(e=>logs.push(`历史事件：${e.name}（${e.status==='participant'?'当事人':e.status==='topTier'?'一线':'旁观'}）`));
  // 4c. Rewrite history events
  const rewriteEvents=checkRewriteHistory();
  rewriteEvents.forEach(e=>logs.push(`✨ 改写历史：${e.name}！`));
  
  // 收集需要弹窗的事件
  const allPopupEvents = [
    ...histEvents.map(e => ({...e, type:'historical'})),
    ...rewriteEvents.map(e => ({...e, type:'rewrite'})),
    ...events.filter(e => e.cat === 'rare').map(e => ({...e, type:'rare'}))
  ];
  
  // 5. Finance (hidden)
  const finance=processFinance();
  // logs.push(`财务：收入 ${formatMoney(finance.income)}，支出 ${formatMoney(finance.expense)}`);
  // 6. Contract
  processContract();
  // 7. Benching check
  checkBenching();
  checkUnbenching();
  // 8. Pressure
  const pressureMsg=processPressure(matchResult);
  logs.push(`压力：${pressureMsg.msg}`);
  // 9. Career progression
  const progEvents=checkCareerProgression();
  progEvents.forEach(e=>{
    if(G.careerLevel!==e.level){
      logs.push(`突破：${e.text}`);
      G.careerLevel=e.level;
      G.career.achievements.push(`${G.year}.${G.month} 晋升为${getCareerLabel(e.level)}`);
    }
  });
  // 10. Team offers (available to all players, including those with contracts)
  const offers=generateTeamOffers();
  if(offers.length>0){
    if(!G.team){
      logs.push(`收到 ${offers.length} 个战队邀约！`);
    } else {
      logs.push(`收到 ${offers.length} 个转会邀约！`);
    }
    // Store offers for player to review
    G._pendingOffers=offers;
  }
  // 11. Tournament check
  const tournaments=checkTournamentThisMonth();
  if(tournaments.length>0&&G.careerLevel!=='amateur'){
    tournaments.forEach(t=>{
      logs.push(`赛事：${t.name} 本月举行`);
      if(G.team&&G.team.isStarter){
        if(t.type==='ESL'||t.type==='PGL'){
          const result=simulateTier1Event(t,t.type);
          if(result){
            if(!result.qualified){
              logs.push(`${t.name}：未能获得参赛资格`);
            } else if(result.stage==='swiss_out'){
              logs.push(`${t.name}：瑞士轮淘汰（${result.result.wins}胜${result.result.losses}负），奖金 ${formatMoney(result.prize)}`);
            } else {
              const placementText={'champion':'冠军','runner-up':'亚军','top4':'四强','top8':'八强'}[result.placement]||'参赛';
              logs.push(`${t.name}：${placementText}！奖金 ${formatMoney(result.prize)}`);
            }
          }
        } else {
          simulateTournamentParticipation(t);
        }
      }
    });
  }
  // 11.5 End-of-month stamina processing (auto-ladder, fatigue checks)
  const staminaLogs=processEndOfMonthStamina();
  staminaLogs.forEach(l=>logs.push(l));
  logs.push(`体力结算：消耗 ${G.staminaConsumed.toFixed(0)}，剩余 ${G.stamina.toFixed(0)}，疲劳 ${G.player.fatigue.toFixed(0)}`);
  // 11.6 Injury processing
  const injuryResult=processInjury();
  if(injuryResult){
    if(injuryResult.recovered){
      logs.push(`✅ 伤病恢复：${injuryResult.name} 已痊愈`);
    } else {
      logs.push(`⚠️ 伤病中：${G.injury.name}，还需 ${injuryResult.monthsLeft} 个月`);
    }
  } else if(!G.injury&&Math.random()<0.05){
    // Random injury check (5% base chance per month)
    triggerInjury();
  }
  // 11.7 Team chemistry update
  if(G.team){
    // Monthly training bonus
    updateTeamChemistry('training');
    // Win/loss based on match results
    if(matchResult.wins>matchResult.losses){
      updateTeamChemistry('win');
    } else if(matchResult.losses>matchResult.wins){
      updateTeamChemistry('loss');
    }
    // Win streak check
    G._winStreak=(G._winStreak||0)+(matchResult.wins>matchResult.losses?1:-1);
    if(G._winStreak>=3){
      updateTeamChemistry('winStreak3');
      G._winStreak=0;
      logs.push('🔥 三连胜！队伍默契+5');
    }
    logs.push(`队伍默契：${G.teamChemistry}/100`);
  }
  // 11.8 Fame events
  const fameEvents=checkFameEvents();
  fameEvents.forEach(e=>logs.push(`🌟 ${e.text}`));
  // 11.9 Map proficiency improvement (from matches)
  if(matchResult.wins>0){
    const randomMap=getRandomMap();
    improveMapProficiency(randomMap,0.5);
  }
  // 12. Age
  if(G.month===12){
    G.player.age++;
    G.year++;
    G.month=1;
    logs.push(`年龄增长：${G.player.age}岁`);
    // Clear pending offers on year change (teams from old year may not exist in new year)
    G._pendingOffers=[];
    logs.push(`跨年：旧邀约已清除`);
    // Process physical age curve
    const maxPhysical=getMaxPhysical(G.player.age,G.player.physicalCap||85);
    if(G.player.age<27&&G.player.attrs.physical<maxPhysical){
      const gap=maxPhysical-G.player.attrs.physical;
      const growth=Math.max(0.5,gap*0.1);
      G.player.attrs.physical=Math.min(maxPhysical,G.player.attrs.physical+growth);
      logs.push(`体能成长：${Math.round(G.player.attrs.physical)}/${maxPhysical}`);
    }else if(G.player.age>27&&G.player.attrs.physical>maxPhysical){
      const excess=G.player.attrs.physical-maxPhysical;
      const decline=Math.max(0.3,excess*0.08);
      G.player.attrs.physical=Math.max(maxPhysical,G.player.attrs.physical-decline);
      logs.push(`体能衰退：${Math.round(G.player.attrs.physical)}/${maxPhysical}`);
    }
    // Age-related attribute changes
    if(G.player.age>28){
      ATTRS.forEach(a=>{
        if(false&&a==='physical'){ // Disabled: using new age curve system
          // Physical declines with age, minimum 10
          G.player.attrs[a]=Math.max(10,G.player.attrs[a]-1);
        }
        if(a==='gameSense'){
          // Game sense improves with experience, use fourDimCaps if available
          const cap=G.player.fourDimCaps?.[a]||G.player.potential[a];
          G.player.attrs[a]=Math.min(cap,G.player.attrs[a]+0.5);
        }
      });
    }
    // Year-end TOP20/TOP1 checks
    const yearRating=getRecentAvgRating(12)||matchResult.avgRating;
    if(checkTop20(yearRating)){
      logs.push(`🌟 入选年度 TOP20！`);
    }
    if(checkTop1(yearRating)){
      logs.push(`👑 获得年度 TOP1！`);
    }
    // Process age effects
    const ageLogs=processAgeEffects();
    ageLogs.forEach(l=>logs.push(l));
  } else {
    G.month++;
  }
  // 13. Monthly log (use captured month, not incremented month)
  G.career.monthlyLog.push(`${logYear}年${logMonth}月 | ${logs.join(' | ')}`);
  // 14. Check retirement conditions
  if(G.player.age>=35&&Math.random()<0.3){
    suggestRetirement();
  }
  if(G.pressure>=95&&G.player.attrs.mental<30&&Math.random()<0.2){
    suggestRetirement();
  }
  // Auto-save
  saveGame('autosave');
  // Show event popups if any, then show month summary
  if(allPopupEvents.length > 0){
    showEventPopupsSequentially(allPopupEvents, () => {
      showMonthSummary(logs,matchResult,events,pressureMsg,offers);
    });
  } else {
    showMonthSummary(logs,matchResult,events,pressureMsg,offers);
  }
  renderAll();
}

function simulateTournamentParticipation(tournament){
  const p=G.player;
  // Track tournament count for dense schedule check
  G.monthTournamentCount=(G.monthTournamentCount||0)+1;
  // Tournament opponent tiers based on tournament tier
  let oppTierPool;
  if(tournament.tier==='major') oppTierPool=['topTier','topTier','tier1','tier1'];
  else if(tournament.tier==='superElite') oppTierPool=['topTier','tier1','tier1','tier2'];
  else if(tournament.tier==='tier1') oppTierPool=['tier1','tier1','tier2','tier2'];
  else if(tournament.tier==='tier2') oppTierPool=['tier2','tier2','tier3','tier3'];
  else oppTierPool=['tier3','tier3','tier3','tier3']; // tier3
  const rounds=tournament.tier==='major'?rand(2,4):tournament.tier==='superElite'?rand(2,3):tournament.tier==='tier2'?rand(1,2):rand(1,2);
  let wins=0;
  let totalRating=0;
  const matchResults=[];
  for(let i=0;i<rounds;i++){
    // Each round has different opponent (increasing strength)
    const oppTier=oppTierPool[Math.min(i,oppTierPool.length-1)];
    const roster=getRandomTeamRoster(oppTier);
    let oppSkill;
    if(roster){
      oppSkill=calcTeamStrength(roster.players)/5;
    } else {
      oppSkill=getTeamOpponentStrength(G.careerLevel,oppTier,G.year);
    }
    // Determine playoff/final status for mental base
    const isPlayoff=i>=rounds-2;
    const isFinal=i===rounds-1;
    // Use simulateMatch for unified logic (beyond limits, stamina, mental growth)
    const result=simulateMatch(oppSkill,true,tournament.tier,tournament.tier,isPlayoff,isFinal,roster);
    if(result.win)wins++;
    totalRating+=result.rating;
    matchResults.push(result);
    // Handle beyond limits event
    if(result.beyondLimits){
      const attrName=ATTR_SHORT[result.beyondLimits.attr]||result.beyondLimits.attr;
      addEventBeyondLimits(result.beyondLimits.attr,result.beyondLimits.newCap);
      G.career.matchLog.push({...result,beyondLimits:result.beyondLimits});
    }
  }
  const avgRating=rounds>0?totalRating/rounds:1.0;
  const advanced=wins>rounds/2;
  // Add event fatigue based on tournament tier
  const fatigueType=tournament.tier==='major'?'major':tournament.tier==='superElite'?'superElite_event':tournament.tier==='tier1'?'tier1_event':'tier2_event';
  addEventFatigue(fatigueType);
  // Get prize pool for this tournament
  const prizePool=getPrizePool(tournament.tier,G.year);
  const teamTier=G.team?.tier||'tier2';
  // Tournament results with prize calculation
  if(advanced&&tournament.tier==='major'){
    G.career.achievements.push(`${G.year} ${tournament.name} 晋级`);
    G.pressure=clamp(G.pressure-12,0,100);
    const playerPrize=calculatePlayerPrize(prizePool,'top8',teamTier); // Minimum top8 for advancing in major
    G.money+=playerPrize;
    G.eventLog.push({text:`参加 ${tournament.name} 并晋级！Rating ${avgRating.toFixed(2)}，个人奖金 ${formatMoney(playerPrize)}`,type:'positive',month:G.month,year:G.year});
  } else if(advanced){
    const placement=tournament.tier==='superElite'?'top4':'top8';
    const playerPrize=calculatePlayerPrize(prizePool,placement,teamTier);
    G.money+=playerPrize;
    G.eventLog.push({text:`参加 ${tournament.name}，晋级下一轮。Rating ${avgRating.toFixed(2)}，个人奖金 ${formatMoney(playerPrize)}`,type:'positive',month:G.month,year:G.year});
  } else {
    // Even elimination gets a small prize
    const playerPrize=calculatePlayerPrize(prizePool,'swissOut',teamTier);
    G.money+=playerPrize;
    G.eventLog.push({text:`参加 ${tournament.name}，未能晋级。Rating ${avgRating.toFixed(2)}，参与奖金 ${formatMoney(playerPrize)}`,type:'negative',month:G.month,year:G.year});
  }
  // Update form based on tournament performance
  if(avgRating>1.15)G.player.form=clamp(G.player.form+rand(5,10),0,100);
  else if(avgRating<0.90)G.player.form=clamp(G.player.form-rand(5,10),0,100);
  // Calculate total stamina cost from all matches
  const totalStaminaCost=matchResults.reduce((sum,r)=>sum+(r.staminaCost||0),0);
  G.tournamentResults.push({
    name:tournament.name,
    tier:tournament.tier,
    year:G.year,
    month:G.month,
    rounds,
    wins,
    advanced,
    staminaCost:totalStaminaCost,
    prizePool,
    avgRating:parseFloat(avgRating.toFixed(2))
  });
  
  // Handle qualifier victory - grant qualification for main event
  // Player must win ALL matches to be qualifier champion
  if(tournament.isQualifier && wins===rounds){
    const qualification = {
      eventName: tournament.qualifiesFor,
      qualifiedAt: { year: G.year, month: G.month },
      eventMonth: tournament.qualifiesForMonth,
      eventYear: tournament.qualifiesForYear
    };
    
    // Check if not already qualified
    if(!G.qualifiedEvents.some(q => q.eventName === qualification.eventName && q.eventYear === qualification.eventYear)){
      G.qualifiedEvents.push(qualification);
      G.eventLog.push({
        text: `🏆 赢得 ${tournament.name}，获得 ${tournament.qualifiesFor} 参赛资格！`,
        type: 'positive',
        month: G.month,
        year: G.year
      });
      G.player.mentalState = clamp(G.player.mentalState + 5, 0, 100);
      G.marketAttention = Math.min(100, G.marketAttention + 2);
    }
  }
}

  // Teams: visible from semiPro+

  const tabs={
    streaming:true,
    training:true,
    dashboard:hasBeenSemiPro,
    matches:hasBeenSemiPro,
    career:hasBeenSemiPro,
    teams:hasBeenSemiPro,
    life:hasBeenPro,
    history:hasBeenSemiPro
  };
  for(let tab in tabs){
    const btn=document.querySelector(`.nav-tab[data-tab="${tab}"]`);
    if(btn)btn.style.display=tabs[tab]?'':'none';
  }
  const activeTab=document.querySelector('.nav-tab.active');
  if(activeTab&&activeTab.style.display==='none'){
    switchTab('streaming');
  }
}

function renderAll(){
  if(!G)return;
  // Top bar
  document.getElementById('g-month').textContent=`${G.year}年${G.month}月`;
  document.getElementById('g-career').textContent=getCareerLabel(G.careerLevel);
  document.getElementById('g-money').textContent=formatMoney(G.money);
  // Update tab visibility
  updateTabVisibility();
  // Render active tab
  const activeTab=document.querySelector('.nav-tab.active')?.dataset.tab||'streaming';
  renderTab(activeTab);
}

function renderTab(tab){
  const el=document.getElementById('tab-'+tab);
  if(!el)return;
  switch(tab){
    case 'streaming':el.innerHTML=renderStreaming();break;
    case 'dashboard':el.innerHTML=renderDashboard();break;
    case 'training':el.innerHTML=renderTraining();break;
    case 'matches':el.innerHTML=renderMatches();break;
    case 'career':el.innerHTML=renderCareer();break;
    case 'teams':el.innerHTML=renderTeamRanking();break;
    case 'life':el.innerHTML=renderLife();break;
    case 'history':el.innerHTML=renderHistory();break;
  }
}

function renderStreaming(){
  const p=G.player;
  const s=G.streaming;
  // Market attention is the main driver of viewers
  const marketAttention=G.marketAttention||0;
  const attraction=s.attraction||0;
  const ladderMatches=s.ladderMatches||0;
  // Calculate estimated viewers based primarily on market attention
  // Market attention contributes 80%, attraction contributes 20%
  const baseViewers=Math.round(marketAttention*2+attraction*0.3);
  const levelBonus=G.careerLevel==='amateur'?1.0:G.careerLevel==='semiPro'?1.5:G.careerLevel==='pro'?2.5:4.0;
  const estimatedViewers=Math.max(0,Math.round(baseViewers*levelBonus));
  // Use actual stored values, but show estimated if stream just started (avgViewers is 0)
  const currentFollowers=s.followers||0;
  const currentAvgViewers=s.avgViewers||0;
  const isActive=s.active!==false;
  // Display viewers: use current if available, otherwise use estimated
  const displayViewers=currentAvgViewers>0?currentAvgViewers:estimatedViewers;
  return `
    <div class="card" style="border-color:var(--purple)">
      <h3>📺 你的直播间</h3>
      <div style="text-align:center;padding:20px;background:var(--bg);border-radius:8px;margin-bottom:12px">
        <div style="font-size:24px;font-weight:700;color:var(--accent2)">${p.ign}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:4px">${isActive?'🔴 直播中':'⚫ 未开播'}</div>
        ${isActive?`<div style="margin-top:12px;font-size:13px;color:var(--text2)">
          <span>当前观众: <strong style="color:var(--green)">${displayViewers}</strong></span>
          ${currentAvgViewers>0?`<span style="font-size:11px;opacity:0.7;margin-left:8px">(历史平均: ${currentAvgViewers})</span>`:''}
        </div>`:''}
      </div>
      <div style="text-align:center;margin-bottom:12px">
        <button class="${isActive?'btn-danger':'btn-success'} btn-small" onclick="toggleStreaming()">
          ${isActive?'停止直播':'开始直播'}
        </button>
      </div>
      <div class="stat-row"><span class="stat-label">知名度</span><span class="stat-value" style="color:var(--accent)">${Math.round(marketAttention)}/100</span></div>
      <div class="stat-row"><span class="stat-label">粉丝数</span><span class="stat-value">${currentFollowers.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-label">平均观众</span><span class="stat-value">${currentAvgViewers}</span></div>
      <div class="stat-row"><span class="stat-label">直播吸引力</span><span class="stat-value" style="color:var(--text2)">${Math.round(attraction)}</span></div>
      <div class="stat-row"><span class="stat-label">本月天梯</span><span class="stat-value">${ladderMatches} 场</span></div>
    </div>
    <div class="card">
      <h3>📈 直播机制说明</h3>
      <p style="font-size:12px;color:var(--text2);line-height:1.7">
        观众数量主要取决于<strong style="color:var(--accent)">知名度</strong>（约80%）和直播吸引力（约20%）。<br>
        • 开启直播后，剩余体力转换为天梯场次<br>
        • 天梯场次越多，观众增长越快<br>
        • 不开启直播时，剩余体力恢复疲劳<br>
        • 赛事表现提升知名度 → 观众增加<br>
        • 职业等级越高，观众加成越大
      </p>

function renderTraining(){
  const p=G.player;
  const selected=G.training.selected;
  const intensity=G.training.intensity||'moderate';
  const ac=ageCoeff(p.age);
  const fourDims=['aim','utility','communication','gameSense'];
  const t=TRAINING_PARAMS[intensity];
  const isFourDim=fourDims.includes(selected);
  const cap=isFourDim?(p.fourDimCaps?.[selected]||p.potential[selected]):p.potential[selected];
  const atCap=p.attrs[selected]>=cap;
  
  // Calculate gain preview
  const gap=Math.max(0.1,1-(p.attrs[selected]/cap));
  const gainPreview=atCap?0:(t.stamina*0.08*ac*gap*t.multiplier);
  
  // Calculate fatigue preview
  const surplusAfter=Math.max(0,G.stamina-t.stamina);
  const recoveryFromSurplus=Math.floor(surplusAfter/RECOVERY_PARAMS.surplusPer);
  const baseRecovery=Math.floor(p.physical*RECOVERY_PARAMS.baseRate);
  const fatiguePreview=t.fatigue-recoveryFromSurplus-baseRecovery;
  
  // Check if enough stamina
  const canTrain=G.stamina>=t.stamina;
  
  return `
    <div class="card">
      <h3>🏋️ 训练方向（四维基础属性）</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px">选择训练方向，提升四维基础属性。其他属性通过比赛自然成长。</p>
      ${TRAIN_TYPES.filter(t=>fourDims.includes(t.attr)).map(t=>{
        const tCap=p.fourDimCaps?.[t.attr]||p.potential[t.attr];
        const tAtCap=p.attrs[t.attr]>=tCap;
        return `
        <div class="train-option ${selected===t.key?'selected':''}" onclick="trainAttribute('${t.key}')">
          <div>
            <div class="train-name">${t.icon} ${t.name}</div>
            <div class="train-info">${t.desc} | 当前 ${Math.round(p.attrs[t.attr])}/${Math.round(tCap)}${tAtCap?' <span style="color:var(--red)">[瓶颈]</span>':''}</div>
          </div>
          <div>
            ${selected===t.key?'<span class="badge badge-green">已选择</span>':''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <h3>🎚️ 训练强度（当前体力：${Math.round(G.stamina)}/${Math.round(G.staminaMax||100)}）</h3>
      <div style="display:flex;gap:8px;margin:12px 0">
        <button class="btn-secondary ${intensity==='high'?'btn-primary':''}" onclick="setTrainingIntensity('high')" style="flex:1">
          🔥 高强度<br><span style="font-size:11px">消耗 ${TRAINING_PARAMS.high.stamina} 体力 | 能力 ×${TRAINING_PARAMS.high.multiplier}</span>
        </button>
        <button class="btn-secondary ${intensity==='moderate'?'btn-primary':''}" onclick="setTrainingIntensity('moderate')" style="flex:1">
          ⚖️ 适量<br><span style="font-size:11px">消耗 ${TRAINING_PARAMS.moderate.stamina} 体力 | 能力 ×${TRAINING_PARAMS.moderate.multiplier}</span>
        </button>
        <button class="btn-secondary ${intensity==='light'?'btn-primary':''}" onclick="setTrainingIntensity('light')" style="flex:1">
          🌿 轻度<br><span style="font-size:11px">消耗 ${TRAINING_PARAMS.light.stamina} 体力 | 能力 ×${TRAINING_PARAMS.light.multiplier}</span>
        </button>
      </div>
      ${!canTrain?`<div style="font-size:13px;color:var(--red);margin-top:8px">⚠ 体力不足，无法进行${t.label}训练</div>`:''}
      ${atCap?`<div style="font-size:13px;color:var(--red);margin-top:8px">⚠ ${ATTR_SHORT[selected]} 已达上限，训练无法提升。${p.hasHitCapBefore?'比赛中可能触发「超越极限」事件。':''}</div>`
      :`<div style="font-size:12px;color:var(--text2);margin-top:8px">预计提升：<span style="color:var(--green);font-weight:600">+${gainPreview.toFixed(2)}</span> | 疲劳变化：<span style="color:${fatiguePreview>0?'var(--red)':'var(--green)'};font-weight:600">${fatiguePreview>0?'+':''}${fatiguePreview}</span></div>`}
      <div style="font-size:11px;color:var(--text2);margin-top:8px;opacity:0.8">💡 剩余体力每 ${RECOVERY_PARAMS.surplusPer} 点恢复 1 疲劳，体能提供基础恢复</div>
    </div>
  `;
}

function renderCareer(){

        <div class="stat-row"><span class="stat-label">位置</span><span class="stat-value">${G.team.isStarter?'★ 首发':'🪑 替补'}</span></div>
        <div class="stat-row"><span class="stat-label">团队默契</span><span class="stat-value">${G.teamChemistry}/100</span></div>

function leaveTeam(){
  if(!G.team)return;
  if(G.team.contract.remaining>0){
    const buyout=Math.round(G.team.contract.salary*0.5*G.team.contract.remaining);
    if(G.money<buyout){
      showToast(`买断费 ${formatMoney(buyout)} 不足`,'error');
      return;
    }
    if(!confirm(`确定离开 ${G.team.name}？需支付 ${formatMoney(buyout)} 买断费。`))return;
    G.money-=buyout;
    G.eventLog.push({text:`支付 ${formatMoney(buyout)} 离开 ${G.team.name}`,type:'negative',month:G.month,year:G.year});
  } else {
    if(!confirm(`确定离开 ${G.team.name}？`))return;
    G.eventLog.push({text:`合同到期，离开 ${G.team.name}`,type:'neutral',month:G.month,year:G.year});
  }
  G.team=null;
  G.careerLevel='freeAgent';
  renderAll();
}

  const rosters=getTeamRostersByYear(G.year);
  const teams=Object.values(rosters);
  const tiers=[
    {key:'topTier',label:'🏆 顶级',badge:'purple'},
    {key:'tier1',label:'⭐ 一线',badge:'blue'},
    {key:'tier2',label:'📋 二线',badge:'yellow'},

  ];

  // Current team section
  if(G.team&&G.team.roster&&G.team.roster.length>0){

    html+=`<div class="stat-row"><span class="stat-label">等级</span><span class="stat-value">${getTierLabel(G.team.tier)}</span></div>`;

    html+=`<table style="width:100%;font-size:13px;margin-top:12px">`;
    html+=`<tr style="color:var(--text2)"><th style="text-align:left;padding:6px">选手</th><th style="text-align:left">位置</th><th style="text-align:center">枪法</th><th style="text-align:center">道具</th><th style="text-align:center">沟通</th><th style="text-align:center">意识</th></tr>`;
    G.team.roster.forEach(p=>{
      const highlight=p.isPlayer?'style="background:rgba(255,107,53,.15)"':'';
      const name=p.isPlayer?`<strong>${p.name} (你)</strong>`:p.name;
      html+=`<tr ${highlight}>
        <td style="padding:6px;font-weight:500">${name}</td>
        <td style="color:var(--text2)">${p.role}</td>
        <td style="text-align:center">${Math.round(p.aim)}</td>
        <td style="text-align:center">${Math.round(p.utility)}</td>
        <td style="text-align:center">${Math.round(p.communication)}</td>
        <td style="text-align:center">${Math.round(p.gameSense)}</td>
      </tr>`;
    });
    html+=`</table></div>`;
  } else if(G.team){
    html+=`<div class="card" style="border-color:var(--accent)"><h3>👥 我的队伍 - ${G.team.name}</h3>`;
    html+=`<div class="stat-row"><span class="stat-label">等级</span><span class="stat-value">${getTierLabel(G.team.tier)}</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">默契</span><span class="stat-value">${G.teamChemistry}/100</span></div>`;
    html+=`<p style="font-size:12px;color:var(--text2);margin-top:8px">阵容数据加载中...</p></div>`;
  }
  // Team ranking
  html+='<div class="card"><h3>🏆 队伍排名</h3><p style="font-size:12px;color:var(--text2);margin-bottom:12px">点击队伍查看详情</p>';
  tiers.forEach(tier=>{
    const tierTeams=teams.filter(t=>t.tier===tier.key).sort((a,b)=>calcTeamStrength(b.players)-calcTeamStrength(a.players));
    if(tierTeams.length===0)return;
    html+=`<div style="margin-top:16px;margin-bottom:8px;font-weight:600;color:var(--accent)">${tier.label}</div>`;
    tierTeams.forEach((t,idx)=>{
      const teamId=Object.keys(rosters).find(k=>rosters[k]===t);
      const strength=Math.round(calcTeamStrength(t.players)/5);
      const honorPoints=t.honors?calculateHonorPoints(t.honors):0;
      html+=`
        <div class="stat-row" style="cursor:pointer;padding:8px;border-radius:6px;transition:background 0.2s" onclick="showTeamDetail('${teamId}')" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'">

          ${honorPoints>0?`<span style="font-size:11px;color:var(--accent2)">🏆 ${honorPoints}</span>`:''}
        </div>
      `;
    });
  });
  html+='</div>';
  return html;
}

function calculateHonorPoints(honors){
  if(!honors)return 0;
  return (honors.majorWin||0)*100+(honors.majorFinal||0)*60+(honors.superEliteWin||0)*50+(honors.tier1Win||0)*30+(honors.tier2Win||0)*15;
}

function showTeamDetail(teamId){
  const rosters=getTeamRostersByYear(G.year);
  const team=rosters[teamId];
  if(!team)return;
  const strength=Math.round(calcTeamStrength(team.players)/5);
  const tierLabel=getTierLabel(team.tier);
  let html=`<h2>🏆 ${team.name}</h2>`;
  html+=`<p style="color:var(--text2);font-size:13px;margin-bottom:16px">${team.region} · ${tierLabel} · 实力 ${strength}</p>`;
  html+=`<div class="card"><h3>👥 首发阵容</h3><table style="width:100%;font-size:13px">`;
  html+=`<tr style="color:var(--text2)"><th style="text-align:left;padding:6px">选手</th><th style="text-align:left">位置</th><th style="text-align:center">枪法</th><th style="text-align:center">道具</th><th style="text-align:center">沟通</th><th style="text-align:center">意识</th></tr>`;
  team.players.forEach(p=>{
    html+=`<tr>
      <td style="padding:6px;font-weight:500">${p.name}</td>
      <td style="color:var(--text2)">${p.role}</td>
      <td style="text-align:center;color:${p.aim>=90?'var(--green)':p.aim>=75?'var(--yellow)':'var(--text2)'}">${p.aim}</td>
      <td style="text-align:center;color:${p.utility>=90?'var(--green)':p.utility>=75?'var(--yellow)':'var(--text2)'}">${p.utility}</td>
      <td style="text-align:center;color:${p.communication>=90?'var(--green)':p.communication>=75?'var(--yellow)':'var(--text2)'}">${p.communication}</td>
      <td style="text-align:center;color:${p.gameSense>=90?'var(--green)':p.gameSense>=75?'var(--yellow)':'var(--text2)'}">${p.gameSense}</td>
    </tr>`;
  });
  html+=`</table></div>`;
  if(team.honors){
    const h=team.honors;
    html+=`<div class="card"><h3>🏆 荣誉</h3>`;
    if(h.majorWin)html+=`<div class="stat-row"><span>Major 冠军</span><span class="stat-value">× ${h.majorWin}</span></div>`;
    if(h.majorFinal)html+=`<div class="stat-row"><span>Major 亚军</span><span class="stat-value">× ${h.majorFinal}</span></div>`;
    if(h.superEliteWin)html+=`<div class="stat-row"><span>超级精英赛 冠军</span><span class="stat-value">× ${h.superEliteWin}</span></div>`;
    if(h.tier1Win)html+=`<div class="stat-row"><span>一线赛 冠军</span><span class="stat-value">× ${h.tier1Win}</span></div>`;
    if(h.tier2Win)html+=`<div class="stat-row"><span>二线赛 冠军</span><span class="stat-value">× ${h.tier2Win}</span></div>`;
    html+=`<div class="stat-row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-weight:600">荣誉积分</span><span class="stat-value" style="color:var(--accent)">${calculateHonorPoints(h)}</span></div>`;
    html+=`</div>`;
  }
  if(G.player){
    const playerAvg=Math.round((G.player.attrs.aim+G.player.attrs.utility+G.player.attrs.communication+G.player.attrs.gameSense)/4);
    const teamAvg=Math.round(team.players.reduce((s,p)=>s+(p.aim+p.utility+p.communication+p.gameSense)/4,0)/5);
    html+=`<div class="card"><h3>📊 你对比 ${team.name}</h3>`;
    html+=`<div class="stat-row"><span>你的实力</span><span class="stat-value" style="color:${playerAvg>=teamAvg?'var(--green)':'var(--red)'}">${playerAvg}</span></div>`;
    html+=`<div class="stat-row"><span>队伍平均</span><span class="stat-value">${teamAvg}</span></div>`;
    const diff=playerAvg-teamAvg;
    html+=`<div style="margin-top:8px;font-size:12px;color:${diff>=0?'var(--green)':'var(--yellow)'}">`;
    if(diff>=10)html+=`✅ 你的实力超过该队平均水平，可以胜任首发！`;
    else if(diff>=0)html+=`⚠️ 你接近该队平均水平，可能作为替补或边缘首发。`;
    else html+=`❌ 你与该队有差距，需要继续提升实力。`;
    html+=`</div></div>`;
  }
  html+=`<div class="modal-buttons"><button class="btn-primary" onclick="closeModal()">关闭</button></div>`;
  showModal(html);
}

    html+=`<div class="card" style="border-color:var(--accent)"><h3>${offerTitle}</h3><p style="color:var(--text2);margin-bottom:12px;font-size:13px">${offerDesc}</p>`;
    offers.forEach((o,i)=>{
      const rosters=getTeamRostersByYear(G.year);
      const teamId=Object.keys(rosters).find(k=>rosters[k].name===o.teamName);
      html+=`
        <div class="contract-card">
          <h4>${o.teamName} <span class="badge badge-${o.teamTier==='topTier'?'purple':o.teamTier==='tier1'?'blue':'yellow'}">${getTierLabel(o.teamTier)}</span></h4>
          <div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${o.teamRegion}</span></div>
          <div class="stat-row"><span class="stat-label">月薪</span><span class="stat-value" style="color:var(--green)">${formatMoney(o.salary)}</span></div>
          <div class="stat-row"><span class="stat-label">合同</span><span class="stat-value">${o.contractLength}个月</span></div>
          <div class="stat-row"><span class="stat-label">位置</span><span class="stat-value">${o.isStarter?'★ 首发':'🪑 替补'}</span></div>
          <div style="margin-top:10px;text-align:right">
            ${teamId?`<button class="btn-secondary btn-small" onclick="showTeamDetail('${teamId}')" style="margin-right:4px">详情</button>`:''}
            <button class="btn-primary btn-small" onclick="showNegotiationModal(G._pendingOffers[${i}])" style="margin-right:4px">谈判</button>
            <button class="btn-success btn-small" onclick="acceptOffer(G._pendingOffers[${i}])">接受</button>
          </div>
        </div>
      `;
    });
    html+=`</div>`;
  }
  html+=`<div class="modal-buttons"><button class="btn-primary" onclick="closeModal()">确认</button></div>`;
  showModal(html);
}

function showContractModal(offers){
  if(offers.length===0)return;
  let html=`<h2>📨 战队邀约</h2><p style="color:var(--text2);margin-bottom:16px">有战队对你感兴趣！</p>`;
  offers.forEach((o,i)=>{
    html+=`
      <div class="contract-card">
        <h4>${o.teamName} <span class="badge badge-${o.teamTier==='topTier'?'purple':o.teamTier==='tier1'?'blue':'yellow'}">${getTierLabel(o.teamTier)}</span></h4>
        <div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${o.teamRegion}</span></div>
        <div class="stat-row"><span class="stat-label">月薪</span><span class="stat-value" style="color:var(--green)">${formatMoney(o.salary)}</span></div>
        <div class="stat-row"><span class="stat-label">合同</span><span class="stat-value">${o.contractLength}个月</span></div>
        <div class="stat-row"><span class="stat-label">位置</span><span class="stat-value">${o.isStarter?'★ 首发':'🪑 替补'}</span></div>
        <div style="margin-top:10px;text-align:right">
          <button class="btn-success btn-small" onclick="acceptOffer(G._pendingOffers[${i}])">接受</button>
        </div>
      </div>
    `;
  });
  html+=`<div class="modal-buttons"><button class="btn-secondary" onclick="closeModal()">暂不考虑</button></div>`;
  G._pendingOffers=offers;
  showModal(html);
}

function showSaveSlots(){
  const saves=[];
  for(let i=0;i<5;i++){
    const key='cs_career_save_'+i;
    const data=localStorage.getItem(key);
    if(data){
      try{
        const parsed=JSON.parse(data);
        saves.push({slot:i,name:parsed.player?.name||'Unknown',date:parsed.savedAt||'未知',level:getCareerLabel(parsed.careerLevel||'amateur'),year:parsed.year,month:parsed.month});
      }catch(e){saves.push({slot:i,empty:true})}
    } else {
      saves.push({slot:i,empty:true});
    }
  }
  // Check autosave
  const auto=localStorage.getItem('cs_career_autosave');
  let autoInfo=null;
  if(auto){
    try{
      const parsed=JSON.parse(auto);
      autoInfo={name:parsed.player?.name,year:parsed.year,month:parsed.month,level:getCareerLabel(parsed.careerLevel||'amateur')};
    }catch(e){}
  }
  let html=`<h2>💾 存档管理</h2>`;
  if(autoInfo){
    html+=`<div class="save-slot" onclick="loadGame('autosave')"><div><strong>自动存档</strong><br><span class="save-slot-info">${autoInfo.name} | ${autoInfo.year}年${autoInfo.month}月 | ${autoInfo.level}</span></div><span class="badge badge-green">读取</span></div>`;
  }
  saves.forEach(s=>{
    if(s.empty){
      html+=`<div class="save-slot" onclick="saveGame(${s.slot})"><div><strong>存档位 ${s.slot+1}</strong><br><span class="save-slot-info">空</span></div><span class="badge badge-blue">保存</span></div>`;
    } else {
      html+=`<div class="save-slot"><div><strong>存档位 ${s.slot+1}</strong><br><span class="save-slot-info">${s.name} | ${s.year}年${s.month}月 | ${s.level}</span></div><div><button class="btn-success btn-small" onclick="loadGame(${s.slot})" style="margin-right:4px">读取</button><button class="btn-primary btn-small" onclick="saveGame(${s.slot})">覆盖</button></div></div>`;
    }
  });
  html+=`<div class="modal-buttons"><button class="btn-secondary" onclick="closeModal()">关闭</button></div>`;
  showModal(html);
}

// ============================================================
// SAVE / LOAD
// ============================================================
function saveGame(slot){
  if(!G){showToast('没有可保存的游戏','error');return}
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  const data={...G,savedAt:new Date().toLocaleString()};
  localStorage.setItem(key,JSON.stringify(data));
  showToast('保存成功！','success');
  if(document.getElementById('modal-overlay').classList.contains('active')){
    showSaveSlots();
  }
}

function loadGame(slot){
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  const data=localStorage.getItem(key);
  if(!data){showToast('存档不存在','error');return}
  try{
    G=JSON.parse(data);
    // Backward compatibility: initialize new stamina fields if missing
    if(G.stamina===undefined){
      G.stamina=0;
      G.staminaMax=0;
      G.staminaConsumed=0;
      G.pendingFatigueRecovery=0;
      G.monthTournamentCount=0;
      G.monthTrainingHours=0;
    }
    // Backward compatibility: initialize four-dim caps if missing
    if(!G.player.fourDimCaps){
      const fourDims=['aim','utility','communication','gameSense'];
      const caps=[rand(92,94),rand(92,94),rand(92,94),rand(98,100)];
      for(let i=caps.length-1;i>0;i--){
        const j=rand(0,i);
        [caps[i],caps[j]]=[caps[j],caps[i]];
      }
      G.player.fourDimCaps={};
      fourDims.forEach((dim,i)=>{
        G.player.fourDimCaps[dim]=caps[i];
      });
    }
    if(G.player.hasHitCapBefore===undefined){
      G.player.hasHitCapBefore=false;
    }
    if(!G.training.intensity){
      G.training.intensity='moderate';
    }
    // Backward compatibility: initialize player state fields if missing
    if(G.player.fatigue===undefined)G.player.fatigue=20;
    if(G.player.mentalState===undefined)G.player.mentalState=70;
    if(G.player.form===undefined)G.player.form=50;
    // Sync training hours from intensity
    if(G.training.hours===undefined||G.training.hours<4){
      G.training.hours=getHoursByIntensity(G.training.intensity);
    }
    if(G.life)G.life.training=G.training.hours;
    // Backward compatibility: initialize log arrays if missing
    if(!G.eventLog)G.eventLog=[];
    if(!G.tournamentResults)G.tournamentResults=[];
    if(!G.career.monthlyLog)G.career.monthlyLog=[];
    if(!G.career.matchLog)G.career.matchLog=[];
    if(!G.career.ratingHistory)G.career.ratingHistory=[];
    if(!G.career.achievements)G.career.achievements=[];
    if(!G._triggeredHistoricalEvents)G._triggeredHistoricalEvents=[];
    if(!G._disabledHistoricalEvents)G._disabledHistoricalEvents=[];
    if(!G.rewrittenHistory)G.rewrittenHistory={};
    if(!G._eventCooldowns)G._eventCooldowns={};
    if(!G.qualifiedEvents)G.qualifiedEvents=[];
    // Backward compatibility: optimization systems
    if(G.fame===undefined)G.fame=0;
    if(!G.injury)G.injury=null;
    if(!G.mapProficiency)G.mapProficiency={Dust2:50,Mirage:50,Inferno:50,Nuke:50,Ancient:50,Anubis:50,Overpass:50};
    if(!G.honors)G.honors={matchMVP:0,eventMVP:0,top20:[],top1:false};
    if(!G.unlockedAchievements)G.unlockedAchievements=[];
    if(!G.pendingNegotiation)G.pendingNegotiation=null;
    if(!G.inheritedAchievements)G.inheritedAchievements=[];
    if(!G.inheritedHonors)G.inheritedHonors=null;
    if(!G.runNumber)G.runNumber=1;
    closeModal();
    showScreen('game-screen');
    renderAll();
    showToast('读取成功！','success');
  }catch(e){
    showToast('存档数据损坏','error');
  }
}

function loadAndContinue(){
  const auto=localStorage.getItem('cs_career_autosave');
  if(auto){
    loadGame('autosave');
  } else {
    for(let i=0;i<5;i++){
      const d=localStorage.getItem('cs_career_save_'+i);
      if(d){loadGame(i);return}
    }
    showToast('没有找到存档','error');
  }
}

function confirmQuit(){
  if(confirm('确定返回主页？游戏将自动保存。')){
    saveGame('autosave');
    showScreen('home-screen');
  }
}

// ============================================================
// INITIALIZATION
// ============================================================
function init(){
  // Check for existing saves
  const hasAuto=localStorage.getItem('cs_career_autosave');
  const hasSave=[0,1,2,3,4].some(i=>localStorage.getItem('cs_career_save_'+i));
  if(hasAuto||hasSave){
    document.getElementById('btn-continue').style.display='block';
  }
  // Tab navigation
  document.querySelectorAll('.nav-tab').forEach(tab=>{
    tab.addEventListener('click',()=>switchTab(tab.dataset.tab));
  });
  // Close modal on overlay click
  document.getElementById('modal-overlay').addEventListener('click',e=>{
    if(e.target===document.getElementById('modal-overlay'))closeModal();
  });
  // Init creation screen defaults
  initCreationScreen();
}

// Start
init();
</script>
