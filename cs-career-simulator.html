// ============================================================
// MONTHLY ADVANCEMENT
// ============================================================
function advanceMonth(){
  if(G.retired){showToast('职业生涯已结束','info');return}
  const logs=[];
  const logYear=G.year;
  const logMonth=G.month;
  G._advanceActive=true;
  G._pendingAchPopups=G._pendingAchPopups||[];
  initMonthlyStamina();
  const recoveryLogs=processPendingFatigueRecovery();
  recoveryLogs.forEach(l=>logs.push(l));
  G._preMonthMatches=G.career.totalMatches;
  if(G.player.fatigue===undefined)G.player.fatigue=0;
  if(G.player.mentalState===undefined)G.player.mentalState=70;
  if(G.player.form===undefined)G.player.form=50;
  if(G.staminaMax===undefined)G.staminaMax=100;
  // 积分月度结算（第 35 轮）：向档位基准回归 5% + 快照，赛事表现随后在其所在月结算
  applyPointsMonthlyTick();
  // 本月赛历：页面与结算共用同一份，不在结算时重新生成
  ensureMonthSchedule();
  const schedule=G.monthSchedule;
  const budget=getScheduleEstimate();
  logs.push(`体力初始化：上限 ${G.staminaMax.toFixed(0)}，当前疲劳 ${G.player.fatigue.toFixed(0)}`);
  logs.push(`月度计划：报名 ${schedule.events.filter(e=>e.registered).length} 项（每系列赛耗 4 体力），训练 ${budget.training}，直播 ${G.streaming.active!==false?'30 场（耗 15 体力、疲劳+3）':'关闭'}`);
  // 1. Training
  const intensityLabel={high:'高强度',moderate:'适量',light:'轻度'}[G.training.intensity||'moderate'];
  if(G.injury){
    // 伤病中训练暂停（保留计划，伤愈后继续执行）
    logs.push(`🤕 伤病中（${G.injury.name}），本月训练暂停`);
  } else if(G.training._oneClickPlan){
    const plan=G.training._oneClickPlan;
    const gains=[];
    let hitAnyCap=false;
    let plannedHours=0;
    plan.forEach(p=>{
      G.training.selected=p.attr;
      G.training.hours=p.hours;
      plannedHours+=p.hours;
      const r=processTraining();
      if(r.hitCap)hitAnyCap=true;
      gains.push(`${ATTR_SHORT[r.attr]}+${r.gain}${r.breakthrough?' ⚡':''}`);
    });
    G.monthTrainingHours=(G.monthTrainingHours||0)+plannedHours;
    logs.push(`训练[${intensityLabel}]：${gains.join('，')}${hitAnyCap?' [瓶颈]':''}`);
    delete G.training._oneClickPlan;
  } else {
    // 按小时折算训练课：4 小时=1 课（与一键计划口径一致），体力不足自动中断
    const times=Math.max(1,Math.round((G.training.hours||getHoursByIntensity(G.training.intensity))/4));
    let totalGain=0,anyCap=false,anyBreak=false,executed=0;
    for(let i=0;i<times;i++){
      if(G.stamina<(TRAINING_PARAMS[G.training.intensity||'moderate']||TRAINING_PARAMS.moderate).stamina)break;
      const r=processTraining();
      totalGain+=parseFloat(r.gain)||0;
      executed++;
      if(r.hitCap)anyCap=true;
      if(r.breakthrough)anyBreak=true;
    }
    G.monthTrainingHours=(G.monthTrainingHours||0)+executed*4;
    logs.push(`训练[${intensityLabel}]：${ATTR_SHORT[G.training.selected]} +${totalGain.toFixed(2)}${anyBreak?' ⚡突破上限！':anyCap?' [瓶颈]':''}`);
  }
  // 2. Life
  processLife();
  // 3. Official events & league matches (all consume before streaming)
  const matchResult=processMatches();
  if(matchResult.mapCount>0){
    logs.push(`比赛：${matchResult.seriesCount} 个系列赛，${matchResult.wins}胜${matchResult.losses}负，地图均分Rating ${matchResult.avgRating}（${matchResult.mapCount}张地图）`);
  }else{
    logs.push('比赛：本月无出场记录');
  }
  matchResult.events.forEach(ev=>{
    const res=ev.result||{};
    if(res.qualified===false){
      logs.push(`${ev.name}：未获参赛资格${res.stage==='benched'?'（替补未出场）':''}`);
    }else{
      logs.push(`${ev.name}：${PLACEMENT_TEXT[res.placement]||'参赛'}${res.score?' ('+res.score+')':''}`);
    }
  });
  // 本月赛事 MVP/EVP（finishEvent 评选）
  (G._monthEventAwards||[]).forEach(aw=>logs.push(aw));
  G._monthEventAwards=[];
  // 3b. 系列赛 MVP 日志（逐场评选在 recordSeries 完成）
  if(matchResult.mvps>0){
    logs.push(`🏆 获得系列赛 MVP ×${matchResult.mvps}！`);
  }
  // 4. Random events
  const events=processRandomEvents();
  events.forEach(e=>logs.push(`事件：${e.name}`));
  const histEvents=processHistoricalEvents();
  histEvents.forEach(e=>logs.push(`历史事件：${e.name}（${e.status==='participant'?'当事人':e.status==='topTier'?'一线':'旁观'}）`));
  // Rewrite-history checks must run after event results are recorded
  const rewriteEvents=checkRewriteHistory();
  rewriteEvents.forEach(e=>logs.push(`✨ 改写历史：${e.name}！`));
  const allPopupEvents = [
    ...histEvents.map(e => ({...e, type:'historical'})),
    ...rewriteEvents.map(e => ({...e, type:'rewrite'})),
    ...events.filter(e => e.cat === 'rare').map(e => ({...e, type:'rare'}))
  ];
  // 5. Finance (streaming is fixed 30 matches/month; costs 15 stamina + 3 fatigue)
  const finance=processFinance();
  if(G.streaming.active!==false){
    logs.push(`直播：本月统一 30 场天梯，收入 ${formatMoney(finance.streamIncome)}`);
  }
  // 6. Contract
  processContract();
  // 7. Benching check
  if(G.team&&!G.team.isStarter){G._monthsBenched=(G._monthsBenched||0)+1;}else{G._monthsBenched=0;} // 替补翻身计数
  checkBenching();
  checkUnbenching();
  // 8. Pressure
  const pressureMsg=processPressure(matchResult);
  logs.push(`压力：${pressureMsg.msg}`);
  // 9. Career progression
  const progEvents=checkCareerProgression();
  progEvents.forEach(e=>{
    if(G.careerLevel!==e.level){
      logs.push(`突破：${e.text}`);
      G.careerLevel=e.level;
      G.career.achievements.push(`${G.year}.${G.month} 晋升为${getCareerLabel(e.level)}`);
    }
  });
  // 10. Team offers
  const offers=generateTeamOffers();
  if(offers.length>0){
    logs.push(G.team?`收到 ${offers.length} 个转会邀约！`:`收到 ${offers.length} 个战队邀约！`);
    G._pendingOffers=offers;
  }
  // 11. End-of-month stamina: leftover recovery + overdraft report
  const staminaLogs=processEndOfMonthStamina();
  staminaLogs.forEach(l=>logs.push(l));
  logs.push(`体力结算（训练/直播）：消耗 ${G.staminaConsumed.toFixed(0)}，剩余 ${G.stamina.toFixed(0)}，疲劳 ${G.player.fatigue.toFixed(0)}`);
  // 11.6 Injury processing
  const injuryResult=processInjury();
  if(injuryResult){
    if(injuryResult.recovered){
      logs.push(`✅ 伤病恢复：${injuryResult.name} 已痊愈`);
    } else {
      logs.push(`⚠️ 伤病中：${G.injury.name}，还需 ${injuryResult.monthsLeft} 个月`);
    }
  } else if(!G.injury&&Math.random()<0.05){
    triggerInjury();
  }
  // 11.7 Team chemistry update
  if(G.team){
    updateTeamChemistry('training');
    if(matchResult.wins>matchResult.losses){
      updateTeamChemistry('win');
    } else if(matchResult.losses>matchResult.wins){
      updateTeamChemistry('loss');
    }
    G._winStreak=(G._winStreak||0)+(matchResult.wins>matchResult.losses?1:-1);
    if(G._winStreak>=3){
      updateTeamChemistry('winStreak3');
      G._winStreak=0;
      logs.push('🔥 三连胜！队伍默契+5');
    }
    logs.push(`队伍默契：${G.teamChemistry}/100`);
  }
  // 11.8 Fame events
  const fameEvents=checkFameEvents();
  fameEvents.forEach(e=>logs.push(`🌟 ${e.text}`));
  // 12. Age
  if(G.month===12){
    // 年度回顾：在年份递增前捕获刚结束年份的统计
    const endedYear=G.year;
    const ys=G._yearStats;
    if(ys&&(ys.maps>0||ys.series>0)){
      G._yearReviewPending={
        year:endedYear,
        series:ys.series||0,maps:ys.maps||0,
        wins:ys.wins||0,losses:ys.losses||0,
        winRate:(ys.wins||0)+(ys.losses||0)>0?Math.round((ys.wins||0)/((ys.wins||0)+(ys.losses||0))*100):0,
        avgRating:(ys.maps>0?(ys.ratingSum/ys.maps):0).toFixed(2),
        bestMap:ys.bestMap?ys.bestMap.toFixed(2):'—',
        bestMapOpp:ys.bestMapOpp||'',
        mvps:ys.mvps||0,
      };
    }
    G._yearStats={wins:0,losses:0,series:0,maps:0,ratingSum:0,bestMap:0,bestMapOpp:'',mvps:0};
    rotateTeamEra(); // 队伍纪元轮转：老兵衰退 / 新人上位（第 36 轮）
    G.player.age++;
    G.year++;
    G.month=1;
    logs.push(`年龄增长：${G.player.age}岁`);
    G._pendingOffers=[];
    logs.push(`跨年：旧邀约已清除`);
    const maxPhysical=getMaxPhysical(G.player.age,G.player.physicalCap||85);
    // 简化：体能全年段都向年龄曲线目标靠拢（低于则成长，高于则衰退）
    if(G.player.attrs.physical<maxPhysical){
      const gap=maxPhysical-G.player.attrs.physical;
      const growth=Math.max(0.5,gap*0.1);
      G.player.attrs.physical=Math.min(maxPhysical,G.player.attrs.physical+growth);
      logs.push(`体能成长：${Math.round(G.player.attrs.physical)}/${maxPhysical}`);
    }else if(G.player.attrs.physical>maxPhysical){
      const excess=G.player.attrs.physical-maxPhysical;
      const decline=Math.max(0.5,excess*0.3);
      G.player.attrs.physical=Math.max(maxPhysical,G.player.attrs.physical-decline);
      logs.push(`体能衰退：${Math.round(G.player.attrs.physical)}/${maxPhysical}`);
    }
    if(G.player.age>28){
      const cap=G.player.fourDimCaps?G.player.fourDimCaps.gameSense:null;
      G.player.attrs.gameSense=Math.min(cap||G.player.potential.gameSense,G.player.attrs.gameSense+0.5);
    }
    const yearRating=getRecentAvgRating(12,false,true); // 仅真实比赛（天梯不计入荣誉评选）
    const t20rank=checkTop20(yearRating);
    if(t20rank===1)logs.push(`👑 获得年度 TOP1！`);
    else if(t20rank)logs.push(`🌟 入选年度 TOP20！排名第 ${t20rank} 位`);
    // 跨年：年度荣誉桶在 TOP20 判定之后重置
    G._yearHonors={eventMVP:0,eventEVP:0,majorChampion:0,majorRunnerUp:0,majorTop4:0,superEliteChampion:0,tier1Champion:0};
    const ageLogs=processAgeEffects();
    ageLogs.forEach(l=>logs.push(l));
  } else {
    G.month++;
  }
  // 13. Monthly log
  G.career.monthlyLog.push(`${logYear}年${logMonth}月 | ${logs.join(' | ')}`);
  // 14. Retirement
  if(G.player.age>=35&&Math.random()<0.3){
    G._retirePromptPending=true;
  }
  if(G.pressure>=95&&G.player.attrs.mental<30&&Math.random()<0.2){
    G._retirePromptPending=true;
  }
  // Build next month's calendar before saving
  G.monthSchedule=null;
  ensureMonthSchedule();
  G._advanceActive=false;
  saveGame('autosave');
  const afterAllPopups=()=>showPendingAchievementsThen(()=>{
    showMonthSummary(logs,matchResult,events,pressureMsg,offers,{year:logYear,month:logMonth});
  });
  // 年度回顾：跨年捕获已完成（跨年块在本函数步骤 12），注入弹窗链最前
  if(G._yearReviewPending){
    allPopupEvents.unshift({name:`📅 ${G._yearReviewPending.year} 年度回顾`,desc:buildYearReviewText(G._yearReviewPending),type:'historical'});
    G._yearReviewPending=null;
  }
  // 粉丝里程碑：跨阈值弹窗（可能一次跨多个，按从小到大弹出）
  const fanMiles=(G._pendingFanMilestones||[]).slice().sort((a,b)=>a.t-b.t);
  if(fanMiles.length){
    allPopupEvents.unshift(...fanMiles.map(mi=>({name:`✨ 粉丝里程碑：${mi.label}粉`,desc:buildFanMilestoneText(mi),type:'rewrite'})));
    G._pendingFanMilestones=[];
  }
  if(allPopupEvents.length > 0){
    showEventPopupsSequentially(allPopupEvents, afterAllPopups);
  } else {
    afterAllPopups();
  }
  renderAll();
}


function retire(){
  G.retired=true;
  G.careerLevel='retired';
  G.eventLog.push({text:`${G.player.name} 在 ${G.player.age} 岁时宣布退役。`,type:'neutral',month:G.month,year:G.year});
  G.career.achievements.push(`${G.year}.${G.month} 退役`);
  checkAchievement('retire');
  closeModal();
  showRetirementSummary();
  renderAll();
}

function showRetirementSummary(){
  const c=G.career;
  const totalMonths=c.monthlyLog.length;
  const years=Math.floor(totalMonths/12);
  // 单场最高 Rating（逐图统计）
  let bestMap=0;
  (c.matchLog||[]).forEach(s=>(s.maps||[]).forEach(m=>{if(typeof m.rating==='number'&&m.rating>bestMap)bestMap=m.rating;}));
  const bestMapText=bestMap?bestMap.toFixed(2):'—';
  const winRate=c.totalMatches?Math.round(c.wins/c.totalMatches*100):0;
  const majors=(G.majorWins||[]).length;
  const h=G.honors||{matchMVP:0,eventMVP:0,eventEVP:0,top20:[],top1:false};
  // 名人堂评语
  let legacy,title;
  if(h.top1||majors>=2||(c.bestRating||0)>=1.60){legacy='传奇。你的名字将与最伟大的选手并列，被后来者反复提起。';title='🏆 传奇选手';}
  else if(h.top20.length>0||majors>=1||(c.avgRating||0)>=1.10){legacy='巨星。你曾站在世界之巅的门槛上，属于这个时代最好的选手之列。';title='⭐ 明星选手';}
  else if((c.avgRating||0)>=1.00){legacy='优秀。稳定、可靠、值得信赖——每一支队伍都想拥有的那种选手。';title='🥉 优秀选手';}
  else{legacy='平凡。没有惊天动地的荣誉，但每一场比赛你都全力以赴。这就是职业生涯的另一种真实。';title='🎖 职业老兵';}
  // 效力履历：优先 _teamHistory，老存档回退解析成就文案
  let stints=(G._teamHistory||[]).filter(s=>s.name);
  if(!stints.length){
    stints=(c.achievements||[]).filter(a=>a.indexOf('加入 ')>=0).map(a=>{
      const p=a.split(' 加入 ');

  const tierLabelMap={topTier:'顶级',tier1:'一线',tier2:'二线',tier3:'三线',regional:'地区'};
  const stintHtml=stints.map(s=>{
    const dur=s.from?`${s.from}${s.to?' → '+s.to:' → 退役'}`:'时序未知';
    const tl=s.tier?(tierLabelMap[s.tier]||s.tier):'';
    return `<div class="stat-row"><span class="stat-label">${s.name}${tl?` · ${tl}`:''}</span><span class="stat-value" style="font-size:12px;color:var(--text2)">${dur}</span></div>`;
  }).join('');
  showModal(`
    <h2>🏁 职业生涯总结</h2>
    <div class="card" style="border-color:var(--accent)">
      <h3>${title}</h3>
      <p style="font-size:14px;line-height:1.8">${legacy}</p>
    </div>
    <div class="card">
      <h3>${G.player.name}（${G.player.ign}）</h3>
      <div class="stat-row"><span class="stat-label">国籍 / 位置</span><span class="stat-value">${G.player.nationality} · ${G.player.role}</span></div>
      <div class="stat-row"><span class="stat-label">职业生涯</span><span class="stat-value">${years} 年（${G.player.age-years}岁 → ${G.player.age}岁）</span></div>
      <div class="stat-row"><span class="stat-label">总比赛</span><span class="stat-value">${c.totalMatches} 场（胜率 ${winRate}%）</span></div>
      <div class="stat-row"><span class="stat-label">生涯平均 Rating</span><span class="stat-value">${c.avgRating}</span></div>
      <div class="stat-row"><span class="stat-label">单场最高 Rating</span><span class="stat-value">${bestMapText}</span></div>
      <div class="stat-row"><span class="stat-label">Major 冠军</span><span class="stat-value">${majors}</span></div>
      <div class="stat-row"><span class="stat-label">残局 1v4 / 1v5</span><span class="stat-value">${G.career.clutch4Count||0} / ${G.career.clutch5Count||0}</span></div>
      <div class="stat-row"><span class="stat-label">比赛 MVP / 赛事 MVP / EVP</span><span class="stat-value">${h.matchMVP||0} / ${h.eventMVP||0} / ${h.eventEVP||0}</span></div>
      <div class="stat-row"><span class="stat-label">TOP20 / TOP1</span><span class="stat-value">${h.top20.length} 次${top20RanksText(h.top20)}${h.top1?' / 🏆':''}</span></div>
      <div class="stat-row"><span class="stat-label">声望 / 市场关注度</span><span class="stat-value">${Math.round(G.fame||0)} / ${Math.round(G.marketAttention||0)}</span></div>
      <div class="stat-row"><span class="stat-label">直播粉丝</span><span class="stat-value">${(G.streaming&&G.streaming.followers||0).toLocaleString()}</span></div>
    </div>

      <h3>效力履历</h3>
      ${stintHtml||'<p style="color:var(--text2);font-size:13px">无队伍效力记录</p>'}
    </div>
    <div class="card">
      <h3>职业履历</h3>
      ${c.achievements.map(a=>`<p style="font-size:13px;color:var(--text2)">• ${a}</p>`).join('')}
    </div>
    <div class="modal-buttons">
      <button class="btn-primary" onclick="startNewRun()">开启新周目</button>
      <button class="btn-secondary" onclick="closeModal();showScreen('home-screen')">返回主页</button>
    </div>
  `);
}

function updateTabVisibility(){
  const level=G.careerLevel;
  const hasTeam=!!G.team;
  const isPro=level==='pro'||level==='benched';
  const hasBeenPro=level==='pro'||level==='benched'||level==='freeAgent';
  const hasBeenSemiPro=hasBeenPro||level==='semiPro';
  // Streaming & Training: always visible (路人阶段)
  // Dashboard: always visible（含路人期）
  // Matches: visible from semiPro+
  // Career: visible from semiPro+
  // Teams: visible from semiPro+
  // Life: visible from pro+
  // History: visible from semiPro+
  const tabs={
    streaming:true,
    training:true,
    dashboard:true,
    matches:true,
    career:hasBeenSemiPro,
    teams:hasBeenSemiPro,
    life:hasBeenPro,
    history:hasBeenSemiPro
  };
  for(let tab in tabs){
    const btn=document.querySelector(`.nav-tab[data-tab="${tab}"]`);
    if(btn)btn.style.display=tabs[tab]?'':'none';
  }
  const activeTab=document.querySelector('.nav-tab.active');
  if(activeTab&&activeTab.style.display==='none'){
    switchTab('streaming');
  }
}

function renderAll(){
  if(!G)return;
  // Top bar
  document.getElementById('g-month').textContent=`${G.year}年${G.month}月`;
  document.getElementById('g-career').textContent=getCareerLabel(G.careerLevel);
  document.getElementById('g-money').textContent=formatMoney(G.money);
  // Update tab visibility
  updateTabVisibility();
  // Render active tab
  const activeTab=document.querySelector('.nav-tab.active')?.dataset.tab||'streaming';
  renderTab(activeTab);
}

function renderTab(tab){
  const el=document.getElementById('tab-'+tab);
  if(!el)return;
  switch(tab){
    case 'streaming':el.innerHTML=renderStreaming();break;
    case 'dashboard':el.innerHTML=renderDashboard();break;
    case 'training':el.innerHTML=renderTraining();break;
    case 'matches':el.innerHTML=renderMatches();break;
    case 'career':el.innerHTML=renderCareer();break;
    case 'teams':el.innerHTML=renderTeamRanking();break;
    case 'life':el.innerHTML=renderLife();break;
    case 'history':el.innerHTML=renderHistory();break;
  }
}

function renderTraining(){
  const p=G.player;
  const selected=G.training.selected;
  const intensity=G.training.intensity||'moderate';
  const ac=ageCoeff(p.age);
  const fourDims=['aim','utility','communication','gameSense'];
  const t=TRAINING_PARAMS[intensity];
  const isFourDim=fourDims.includes(selected);
  const cap=isFourDim?(p.fourDimCaps?.[selected]||p.potential[selected]):p.potential[selected];
  const atCap=p.attrs[selected]>=cap;
  
  // Calculate gain preview（与 processTraining 口径一致）
  const gap=Math.max(p.age<=28?0.1:0,1-(p.attrs[selected]/cap));
  let gainPreview=atCap?0:(t.stamina*0.25*ac*gap*t.multiplier);
  const cappedByAge=p.age>28&&fourDims.includes(selected)&&selected!=='gameSense';
  if(cappedByAge)gainPreview=0;
  
  // 训练在下月开始时结算，此时体力已重置为满值
  const nextMonthStamina=getMonthlyStamina(p.attrs.physical);
  const trainingBudget=getScheduleTrainingCost();

  // 疲劳预览：本课疲劳（月末统一恢复：基础 5 + 体能×0.1 + 剩余体力每 20 点 1）
  const fatiguePreview=t.fatigue;
  
  // Check if enough stamina
  const canTrain=nextMonthStamina>=trainingBudget;
  
  return `
    <div class="card">
      <h3>🏋️ 训练方向（四维基础属性）</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:12px">选择训练方向，提升四维基础属性。其他属性通过比赛自然成长。</p>
      ${TRAIN_TYPES.filter(t=>fourDims.includes(t.attr)).map(t=>{
        const tCap=p.fourDimCaps?.[t.attr]||p.potential[t.attr];
        const tAtCap=p.attrs[t.attr]>=tCap;
        return `
        <div class="train-option ${selected===t.key?'selected':''}" onclick="trainAttribute('${t.key}')">
          <div>
            <div class="train-name">${t.icon} ${t.name}</div>
            <div class="train-info">${t.desc} | 当前 ${Math.round(p.attrs[t.attr])}/${Math.round(tCap)}${tAtCap?' <span style="color:var(--red)">[瓶颈]</span>':''}</div>
          </div>
          <div>
            ${selected===t.key?'<span class="badge badge-green">已选择</span>':''}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <h3>🎚️ 训练强度（下月可用体力：${Math.round(nextMonthStamina)}）</h3>
      <p style="font-size:12px;color:var(--text2);margin-bottom:8px">训练在进入下月时优先结算体力；比赛每系列赛耗 4 点、开直播每月耗 15 点，同一份体力竞争。</p>
      <div style="display:flex;gap:8px;margin:12px 0">
        <button class="btn-secondary ${intensity==='high'?'btn-primary':''}" onclick="setTrainingIntensity('high')" style="flex:1">
          🔥 高强度<br><span style="font-size:11px">消耗 ${TRAINING_PARAMS.high.stamina} 体力 | 能力 ×${TRAINING_PARAMS.high.multiplier}</span>
        </button>
        <button class="btn-secondary ${intensity==='moderate'?'btn-primary':''}" onclick="setTrainingIntensity('moderate')" style="flex:1">
          ⚖️ 适量<br><span style="font-size:11px">消耗 ${TRAINING_PARAMS.moderate.stamina} 体力 | 能力 ×${TRAINING_PARAMS.moderate.multiplier}</span>
        </button>
        <button class="btn-secondary ${intensity==='light'?'btn-primary':''}" onclick="setTrainingIntensity('light')" style="flex:1">
          🌿 轻度<br><span style="font-size:11px">消耗 ${TRAINING_PARAMS.light.stamina} 体力 | 能力 ×${TRAINING_PARAMS.light.multiplier}</span>
        </button>
      </div>
      ${!canTrain?`<div style="font-size:13px;color:var(--red);margin-top:8px">⚠ 下月体力不足以完成当前训练计划（需 ${trainingBudget} 点，可用 ${Math.round(nextMonthStamina)} 点）</div>`:''}
      ${atCap?`<div style="font-size:13px;color:var(--red);margin-top:8px">⚠ ${ATTR_SHORT[selected]} 已达上限，训练无法提升。${p.hasHitCapBefore?'比赛中可能触发「超越极限」事件。':''}</div>`
      :cappedByAge?`<div style="font-size:13px;color:var(--red);margin-top:8px">🧓 ${ATTR_SHORT[selected]} 已生理定型（29 岁后枪法/道具/沟通无法再练）。老将靠意识和经验立足。</div>`
      :`<div style="font-size:12px;color:var(--text2);margin-top:8px">预计提升：<span style="color:var(--green);font-weight:600">+${gainPreview.toFixed(2)}</span> | 疲劳变化：<span style="color:${fatiguePreview>0?'var(--red)':'var(--green)'};font-weight:600">${fatiguePreview>0?'+':''}${fatiguePreview}</span></div>`}
      <div style="font-size:11px;color:var(--text2);margin-top:8px;opacity:0.8">💡 月末恢复疲劳：基础 ${RECOVERY_PARAMS.baseFlat} + 体能×${RECOVERY_PARAMS.baseRate} + 剩余体力每 ${RECOVERY_PARAMS.surplusPer} 点 1；休整月（训练≤4小时）额外 -30%；疲劳会挤占下月体力（疲劳 50 ≈ -25%）</div>
    </div>
  `;
}

function renderMatches(){
  const schedule=ensureMonthSchedule();
  const budget=getScheduleEstimate();
  const preview=getUpcomingPreview();
  const vetos=buildSeriesMaps('BO3',preview.name);
  const recentMatches=G.career.matchLog.slice(-15).reverse();
  const tournaments=G.tournamentResults.slice(-8).reverse();
  const qualifiedEvents=G.qualifiedEvents||[];
  const plan=G.monthPlan||{};
  const remaining=G.staminaMax-budget.total;
  const getTierBadge=(t)=>{
    if(t==='major')return'<span class="badge badge-purple">Major</span>';
    if(t==='superElite')return'<span class="badge badge-purple">超级精英</span>';
    if(t==='tier1')return'<span class="badge badge-blue">S级</span>';
    if(t==='tier2')return'<span class="badge badge-yellow">A级</span>';
    if(t==='qualifier')return'<span class="badge badge-green">预选赛</span>';
    if(t==='ladder')return'<span class="badge badge-gray">天梯</span>';
    return'<span class="badge badge-gray">B级</span>';
  };
  const scheduleHtml=schedule.events.map(e=>{
    const done=''; // 简化：不再显示实际体力消耗
    const badge=e.mandatory?'<span class="badge badge-blue">必赛</span>':e.locked?'<span class="badge badge-gray">🔒 未受邀</span>':(e.registered?'<span class="badge badge-green">已报名</span>':'<span class="badge badge-gray">已跳过</span>');
    const btn=(e.mandatory||e.locked)?'':`<button class="btn-${e.registered?'danger':'success'} btn-small" onclick="toggleScheduleRegistration('${e.id}')">${e.registered?'跳过':'报名'}</button>`;
    const hasPO=e.kind==='event'&&e.registered&&(e.tier==='major'||e.tier==='superElite'||e.tier==='tier1'||e.tier==='tier2');
    const tacticBtn=hasPO?`<button class=\"btn-secondary btn-small\" onclick=\"showPlayoffTacticModal()\">🎯 ${(TACTIC_MODS[(e.event&&e.event._playoffTactic)||'auto']||TACTIC_MODS.auto).label}</button>`:'';
    const q=e.qualified?' <span style="font-size:11px;color:var(--green)">已获资格</span>':'';
    return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <div>${e.kind==='league'?'🎯':'🏆'} ${e.name} ${getTierBadge(e.tier)} ${badge}${q}</div>
        <div style="display:flex;gap:6px;align-items:center">${done}${tacticBtn}${btn}</div>
      </div>
    </div>`;
  }).join('');
  const mapRows=MAPS.map(m=>{
    const banned=vetos.bans.includes(m);
    const edge=getMapEdge(m,preview.name);
    const lab=getMapAdvantageLabel(edge);
    const wr=Math.round(estimateMapWinRate(m,preview.name)*100);
    const oppProf=vetos.opponentProfile[m];
    return `<tr style="${banned?'opacity:.4;text-decoration:line-through':''}">
      <td>${m}${banned?' <span class="badge badge-gray">禁</span>':''}</td>
      <td>${Math.round(G.mapProficiency[m]||50)}</td>
      <td>${oppProf}</td>
      <td style="color:${lab.color}">${wr}%</td>
      <td style="color:${lab.color}">${lab.text}</td>
    </tr>`;
  }).join('');
  const chip=(type,m,color)=>`<button class="btn-secondary btn-small" style="margin:2px;${(plan[type]||[]).includes(m)?`border-color:${color};color:${color}`:''}" onclick="toggleMonthPlanMap('${type}','${m}')">${type==='bans'?'禁':'选'} ${m}</button>`;
  return `
    <div class="card" style="border-color:var(--accent2)">
      <h3>📅 ${schedule.year}年${schedule.month}月 赛历</h3>
      <div style="font-size:12px;color:var(--text2);line-height:1.8;margin-bottom:8px">
        体力上限 <strong>${Math.round(G.staminaMax)}</strong> ｜ 已报名赛事预估 <strong>${budget.events}</strong> ｜ 训练 <strong>${budget.training}</strong> ｜ 直播 <strong>${G.streaming.active!==false?'15（30 场）':'0（关闭）'}</strong>
        ｜ 合计 <strong style="color:${remaining<0?'var(--red)':'var(--green)'}">${budget.total}</strong>，结余 <strong style="color:${remaining<0?'var(--red)':'var(--green)'}">${remaining}</strong>
      </div>
      ${budget.total>G.staminaMax?`<div style="font-size:12px;color:var(--red);margin-bottom:8px">⚠️ 计划已超过体力上限，超出的赛事会透支体力并增加疲劳。</div>`:''}
      ${scheduleHtml||'<div class="empty-state">本月没有可参加的比赛</div>'}
      <div style="font-size:11px;color:var(--text2);margin-top:8px">比赛按赛历从上到下结算；直播每月统一 30 场，不消耗体力。</div>
    </div>
    <div class="card" style="border-color:var(--purple)">
      <h3>🗺️ 地图禁选与优势</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <span style="font-size:12px;color:var(--text2)">关键场次策略</span>
        <select onchange="setMonthPlan('mapStrategy',this.value)" style="background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px">
          <option value="auto" ${plan.mapStrategy==='auto'?'selected':''}>自动禁选</option>
          <option value="ban_strong" ${plan.mapStrategy==='ban_strong'?'selected':''}>禁用对手强图</option>
          <option value="pick_strong" ${plan.mapStrategy==='pick_strong'?'selected':''}>优先自选强图</option>
          <option value="manual" ${plan.mapStrategy==='manual'?'selected':''}>手动禁选</option>
        </select>
        <span style="font-size:12px;color:var(--text2)">下一场预览：<strong>${preview.name}</strong>（${preview.source}）</span>
      </div>
      <div style="margin-bottom:6px">${MAPS.map(m=>chip('bans',m,'var(--red)')).join('')}</div>
      <div style="margin-bottom:10px">${MAPS.map(m=>chip('picks',m,'var(--green)')).join('')}</div>
      <table>
        <tr><th>地图</th><th>我方熟练</th><th>对手强度</th><th>预估胜率</th><th>判定</th></tr>
        ${mapRows}
      </table>
      <div style="font-size:11px;color:var(--text2);margin-top:8px">被禁地图不会进入系列赛；手动选择最多2张禁图、3张选图。优势判定由双方地图熟练度差决定。</div>
    </div>
    ${qualifiedEvents.length>0?`
    <div class="card" style="border-color:var(--green)">
      <h3>✅ 已获参赛资格</h3>
      ${qualifiedEvents.map(q=>`
        <div class="stat-row">
          <span>${q.eventName}</span>
          <span class="badge badge-green">${q.eventYear}年${q.eventMonth}月 ${G.team&&q.teamId===G.team.id?'· '+G.team.name:''}</span>
        </div>
      `).join('')}
    </div>`:''}
    <div class="card">
      <h3>📊 比赛统计</h3>
      <div class="grid-3">
        <div class="stat-row"><span class="stat-label">系列赛</span><span class="stat-value">${G.career.totalMatches}</span></div>
        <div class="stat-row"><span class="stat-label">胜率</span><span class="stat-value">${G.career.totalMatches>0?Math.round(G.career.wins/G.career.totalMatches*100):0}%</span></div>
        <div class="stat-row"><span class="stat-label">地图Rating</span><span class="stat-value">${G.career.avgRating}</span></div>
      </div>
      <div class="stat-row"><span class="stat-label">出场地图总数</span><span class="stat-value">${G.career.totalMaps||0}</span></div>
    </div>
    <div class="card">
      <h3>🕹️ 最近系列赛</h3>
      ${recentMatches.length===0?'<div class="empty-state">暂无比赛记录</div>':`
      <table>
        <tr><th>日期</th><th>对手</th><th>比分</th><th>K/D/A</th><th>Rating</th><th>地图</th></tr>
        ${recentMatches.map(m=>{const rl=getRatingLabel(m.rating);const mapsText=(m.maps||[]).map(x=>`${x.map} ${x.score}`).join(' / ');return`
          <tr>
            <td>${m.date}</td>
            <td>${m.opponent}<div style="font-size:10px;color:var(--text2)">${m.roundName||''}${m.isTournament?' · 赛事':''}</div></td>

      </table>`}

        </div>
      `).join('')}
    </div>`:''}
  `;
}

function renderCareer(){
  const p=G.player;
  const rating=getRecentAvgRating(3)||getPlayerRating();
  // Use stored pending offers instead of generating new ones
  const rosters=getTeamRostersByYear(G.year);
  // Filter out invalid offers (teams that don't exist in current year)
  const pendingOffers=(G._pendingOffers||[]).filter(o=>{
    const teamId=Object.keys(rosters).find(k=>rosters[k].name===o.teamName);
    return !!teamId;
  });
  // Update stored offers to filtered list
  G._pendingOffers=pendingOffers;
  let offersHtml='';
  if(pendingOffers.length>0){
    offersHtml=pendingOffers.map((o,i)=>{
      const teamId=Object.keys(rosters).find(k=>rosters[k].name===o.teamName);
      return `
      <div class="contract-card">
        <h4>${o.teamName} <span class="badge badge-${o.teamTier==='topTier'?'purple':o.teamTier==='tier1'?'blue':'yellow'}">${getTierLabel(o.teamTier)}</span>${o.worldRank?` <span class="badge badge-gray">🌍 积分第 ${o.worldRank}</span>`:''}</h4>
        <div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${o.teamRegion}</span></div>

        <div class="stat-row"><span class="stat-label">月薪</span><span class="stat-value" style="color:var(--green)">${formatMoney(G.team.contract.salary)}</span></div>

        <div class="stat-row"><span class="stat-label">团队默契</span><span class="stat-value">${G.teamChemistry}/100</span></div>

    <div class="card">
      <h3>📋 市场价值评估</h3>
      ${(()=>{const rl=getRatingLabel(rating);return`
      <div class="stat-row"><span class="stat-label">近期Rating</span><span class="stat-value" style="color:${rl.color}">${rating.toFixed(2)} (${rl.label})</span></div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:6px;padding-left:2px">${rl.desc}</div>

      <div class="stat-row"><span class="stat-label">职业等级</span><span class="stat-value">${getCareerLabel(G.careerLevel)}</span></div>
      <div class="stat-row"><span class="stat-label">年龄</span><span class="stat-value">${p.age}岁</span></div>
    </div>
    <div class="card">
      <h3>📨 待处理邀约</h3>

    <div style="text-align:center;margin-top:12px">
      <button class="btn-danger" onclick="leaveTeam()">离开战队（需支付买断费）</button>
    </div>`:''}

}

function leaveTeam(){
  if(!G.team)return;
  if(G.team.contract.remaining>0){
    const buyout=Math.round(G.team.contract.salary*0.5*G.team.contract.remaining);
    if(G.money<buyout){
      showToast(`买断费 ${formatMoney(buyout)} 不足`,'error');
      return;
    }
    if(!confirm(`确定离开 ${G.team.name}？需支付 ${formatMoney(buyout)} 买断费。`))return;
    G.money-=buyout;
    G.eventLog.push({text:`支付 ${formatMoney(buyout)} 离开 ${G.team.name}`,type:'negative',month:G.month,year:G.year});
  } else {
    if(!confirm(`确定离开 ${G.team.name}？`))return;
    G.eventLog.push({text:`合同到期，离开 ${G.team.name}`,type:'neutral',month:G.month,year:G.year});
  }
  G.team=null;
  G.careerLevel='freeAgent';
  renderAll();
}

function renderTeamRanking(){
  const rosters=getTeamRostersByYear(G.year);
  const teams=Object.values(rosters);
  const tiers=[
    {key:'topTier',label:'🏆 顶级',badge:'purple'},
    {key:'tier1',label:'⭐ 一线',badge:'blue'},
    {key:'tier2',label:'📋 二线',badge:'yellow'},

    html+=`<div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${G.team.region}</span></div>`;

    G.team.roster.forEach(p=>{
      const highlight=p.isPlayer?'style="background:rgba(255,107,53,.15)"':'';

      html+=`<tr ${highlight}>

        <td style="color:var(--text2)">${p.role}</td>
        <td style="text-align:center">${Math.round(p.aim)}</td>
        <td style="text-align:center">${Math.round(p.utility)}</td>
        <td style="text-align:center">${Math.round(p.communication)}</td>
        <td style="text-align:center">${Math.round(p.gameSense)}</td>
        <td style="text-align:center;font-weight:700;color:var(--accent)">${Math.round((p.aim+p.utility+p.communication+p.gameSense)/4)}</td>
      </tr>`;
    });
    html+=`</table></div>`;
  } else if(G.team){
    html+=`<div class="card" style="border-color:var(--accent)"><h3>👥 我的队伍 - ${G.team.name}</h3>`;
    html+=`<div class="stat-row"><span class="stat-label">等级</span><span class="stat-value">${getTierLabel(G.team.tier)}</span></div>`;
    html+=`<div class="stat-row"><span class="stat-label">默契</span><span class="stat-value">${G.teamChemistry}/100</span></div>`;
    html+=`<p style="font-size:12px;color:var(--text2);margin-top:8px">阵容数据加载中...</p></div>`;
  }
  // 世界积分排名（第 35 轮：公开积分榜，暗实力/档位不显示）
  const ptsList=getSortedPointsList();

  html+='<div class="card"><h3>🌍 世界积分排名</h3><p style="font-size:12px;color:var(--text2);margin-bottom:12px">赛事邀请与抽签依据 · 点击队伍查看阵容</p>';
  ptsList.forEach((x,idx)=>{
    const cur=Math.round(x.pts);
    const delta=x.prev!==undefined?cur-x.prev:null;
    const trend=delta===null?'':delta>0?` <span style="color:var(--green);font-size:11px">▲${delta}</span>`:delta<0?` <span style="color:var(--red);font-size:11px">▼${-delta}</span>`:`<span style="color:var(--text2);font-size:11px"> –</span>`;
    const tid=rankMap[x.name];
    const hl=x.isOwn?'background:rgba(255,107,53,.12);':'';

    const clickAttrs=tid?` onclick="showTeamDetail('${tid}')" onmouseover="this.style.background='${hover}'" onmouseout="this.style.background='${leave}'"`:'';
    html+=`<div class="stat-row" style="${hl}cursor:pointer;padding:8px;border-radius:6px;transition:background 0.2s"${clickAttrs}><span style="width:28px;color:var(--text2);font-weight:600">${idx+1}</span><span style="font-weight:${x.isOwn?'700':'500'}">${x.name}${x.isOwn?' (你)':''}</span><span style="font-size:12px">${cur} 分${trend}</span></div>`;
  });
  html+='</div>';
  return html;
}

function calculateHonorPoints(honors){
  if(!honors)return 0;
  return (honors.majorWin||0)*100+(honors.majorFinal||0)*60+(honors.superEliteWin||0)*50+(honors.tier1Win||0)*30+(honors.tier2Win||0)*15;
}

function showTeamDetail(teamId){
  const rosters=getTeamRostersByYear(G.year);
  const team=rosters[teamId];
  if(!team)return;
  const ptsNow=G.teamPoints&&G.teamPoints[team.name]?Math.round(G.teamPoints[team.name].pts):0;
  let html=`<h2>🏆 ${team.name}</h2>`;
  html+=`<p style="color:var(--text2);font-size:13px;margin-bottom:16px">${team.region} · 积分 ${ptsNow}</p>`;
  html+=`<div class="card"><h3>👥 首发阵容</h3><table style="width:100%;font-size:13px">`;
  html+=`<tr style="color:var(--text2)"><th style="text-align:left;padding:6px">选手</th><th style="text-align:left">位置</th><th style="text-align:center">枪法</th><th style="text-align:center">道具</th><th style="text-align:center">沟通</th><th style="text-align:center">意识</th><th style="text-align:center">OVR</th></tr>`;
  team.players.forEach(p=>{
    html+=`<tr>
      <td style="padding:6px;font-weight:500">${p.name}</td>
      <td style="color:var(--text2)">${p.role}</td>
      <td style="text-align:center;color:${p.aim>=90?'var(--green)':p.aim>=75?'var(--yellow)':'var(--text2)'}">${p.aim}</td>
      <td style="text-align:center;color:${p.utility>=90?'var(--green)':p.utility>=75?'var(--yellow)':'var(--text2)'}">${p.utility}</td>
      <td style="text-align:center;color:${p.communication>=90?'var(--green)':p.communication>=75?'var(--yellow)':'var(--text2)'}">${p.communication}</td>
      <td style="text-align:center;color:${p.gameSense>=90?'var(--green)':p.gameSense>=75?'var(--yellow)':'var(--text2)'}">${p.gameSense}</td>
      <td style="text-align:center;font-weight:700;color:${p.aim>=90?'var(--accent)':'var(--text)'}">${Math.round((p.aim+p.utility+p.communication+p.gameSense)/4)}</td>
    </tr>`;
  });
  html+=`</table></div>`;
  if(team.honors){
    const h=team.honors;
    html+=`<div class="card"><h3>🏆 荣誉</h3>`;
    if(h.majorWin)html+=`<div class="stat-row"><span>Major 冠军</span><span class="stat-value">× ${h.majorWin}</span></div>`;
    if(h.majorFinal)html+=`<div class="stat-row"><span>Major 亚军</span><span class="stat-value">× ${h.majorFinal}</span></div>`;
    if(h.superEliteWin)html+=`<div class="stat-row"><span>超级精英赛 冠军</span><span class="stat-value">× ${h.superEliteWin}</span></div>`;
    if(h.tier1Win)html+=`<div class="stat-row"><span>一线赛 冠军</span><span class="stat-value">× ${h.tier1Win}</span></div>`;
    if(h.tier2Win)html+=`<div class="stat-row"><span>二线赛 冠军</span><span class="stat-value">× ${h.tier2Win}</span></div>`;
    html+=`<div class="stat-row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-weight:600">荣誉积分</span><span class="stat-value" style="color:var(--accent)">${calculateHonorPoints(h)}</span></div>`;
    html+=`</div>`;
  }
  if(G.player){
    const playerAvg=Math.round((G.player.attrs.aim+G.player.attrs.utility+G.player.attrs.communication+G.player.attrs.gameSense)/4);
    const teamAvg=Math.round(team.players.reduce((s,p)=>s+(p.aim+p.utility+p.communication+p.gameSense)/4,0)/5);
    html+=`<div class="card"><h3>📊 你对比 ${team.name}</h3>`;
    html+=`<div class="stat-row"><span>你的实力</span><span class="stat-value" style="color:${playerAvg>=teamAvg?'var(--green)':'var(--red)'}">${playerAvg}</span></div>`;
    html+=`<div class="stat-row"><span>队伍平均</span><span class="stat-value">${teamAvg}</span></div>`;
    const diff=playerAvg-teamAvg;
    html+=`<div style="margin-top:8px;font-size:12px;color:${diff>=0?'var(--green)':'var(--yellow)'}">`;
    if(diff>=10)html+=`✅ 你的实力超过该队平均水平，可以胜任首发！`;
    else if(diff>=0)html+=`⚠️ 你接近该队平均水平，可能作为替补或边缘首发。`;
    else html+=`❌ 你与该队有差距，需要继续提升实力。`;
    html+=`</div></div>`;
  }
  html+=`<div class="modal-buttons"><button class="btn-primary" onclick="closeModal()">关闭</button></div>`;
  showModal(html);
}

function showMonthSummary(logs,matchResult,events,pressureMsg,offers,period){
  const p=G.player;

  const pm=period?period.month:G.month;
  let html=`<h2>📅 ${py}年${pm}月 结算</h2>`;
  html+=`<div class="card"><h3>📊 本月概要</h3>`;
  logs.forEach(l=>html+=`<div class="log-entry">${l}</div>`);
  html+=`</div>`;
  html+=`<div class="card"><h3>🎮 比赛结果</h3>`;
  html+=`<div class="stat-row"><span class="stat-label">系列赛战绩</span><span class="stat-value">${matchResult.wins}胜 ${matchResult.losses}负（${matchResult.seriesCount||0} 个系列赛）</span></div>`;
  const rl=getRatingLabel(matchResult.avgRating);
  html+=`<div class="stat-row"><span class="stat-label">地图平均Rating</span><span class="stat-value" style="color:${rl.color}">${matchResult.avgRating} (${rl.label})</span></div>`;
  html+=`<div class="stat-row"><span class="stat-label">出场地图</span><span class="stat-value">${matchResult.mapCount||0} 张</span></div>`;
  html+=`<div class="stat-row"><span class="stat-label">体力消耗</span><span class="stat-value">${Math.round(G.staminaConsumed)} / 上限 ${Math.round(G.staminaMax)}</span></div>`;
  html+=`</div>`;
  if(matchResult.events&&matchResult.events.length>0){
    html+=`<div class="card"><h3>🏆 赛事战报</h3>`;
    matchResult.events.forEach(ev=>{
      const res=ev.result||{};
      if(res.qualified===false){
        html+=`<div class="stat-row"><span class="stat-label">${ev.name}</span><span class="stat-value" style="color:var(--red)">未获资格</span></div>`;
      }else{
        const rounds=(res.rounds||[]).map(r=>`${r.stage} vs ${r.opponent} ${r.score}`).join('；');
        html+=`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="font-weight:600">${ev.name} <span class="badge badge-purple">${PLACEMENT_TEXT[res.placement]||'参赛'}</span></div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px">${rounds||'无出场'}</div>
          ${res.mapsText?`<div style="font-size:12px;color:var(--text2);margin-top:2px">地图：${res.mapsText}</div>`:''}
        </div>`;
      }
    });
    html+=`</div>`;
  }
  if(events.length>0){
    html+=`<div class="card"><h3>🎲 随机事件</h3>`;
    events.forEach(e=>html+=`<div class="event-text"><strong>${e.name}</strong><br>${e.desc}<br><span style="color:var(--accent2)">${e.effect}</span></div>`);
    html+=`</div>`;
  }
  html+=`<div class="card"><h3>🧠 压力状态</h3><p style="color:${pressureMsg.type==='positive'?'var(--green)':pressureMsg.type==='negative'?'var(--red)':'var(--text2)'}">${pressureMsg.msg}</p></div>`;
  if(offers&&offers.length>0){
    G._pendingOffers=offers;
    const offerTitle=G.team?'📨 转会邀约':'📨 战队邀约';
    const offerDesc=G.team?'有战队想签下你！接受将自动买断当前合同（费用由新战队承担）。':'有战队对你感兴趣！';
    html+=`<div class="card" style="border-color:var(--accent)"><h3>${offerTitle}</h3><p style="color:var(--text2);margin-bottom:12px;font-size:13px">${offerDesc}</p>`;
    offers.forEach((o,i)=>{
      const rosters=getTeamRostersByYear(G.year);
      const teamId=Object.keys(rosters).find(k=>rosters[k].name===o.teamName);
      html+=`
        <div class="contract-card">
          <h4>${o.teamName} <span class="badge badge-${o.teamTier==='topTier'?'purple':o.teamTier==='tier1'?'blue':'yellow'}">${getTierLabel(o.teamTier)}</span>${o.worldRank?` <span class="badge badge-gray">🌍 积分第 ${o.worldRank}</span>`:''}</h4>
          <div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${o.teamRegion}</span></div>
          <div class="stat-row"><span class="stat-label">月薪</span><span class="stat-value" style="color:var(--green)">${formatMoney(o.salary)}</span></div>
          <div class="stat-row"><span class="stat-label">合同</span><span class="stat-value">${o.contractLength}个月</span></div>
          <div class="stat-row"><span class="stat-label">位置</span><span class="stat-value">${o.isStarter?'★ 首发':'🪑 替补'}</span></div>
          <div style="margin-top:10px;text-align:right">
            ${teamId?`<button class="btn-secondary btn-small" onclick="showTeamDetail('${teamId}')" style="margin-right:4px">详情</button>`:''}
            <button class="btn-primary btn-small" onclick="showNegotiationModal(G._pendingOffers[${i}])" style="margin-right:4px">谈判</button>
            <button class="btn-success btn-small" onclick="acceptOffer(G._pendingOffers[${i}])">接受</button>
          </div>
        </div>
      `;
    });
    html+=`</div>`;
  }
  html+=`<div class="modal-buttons"><button class="btn-primary" onclick="closeMonthSummary()">确认</button></div>`;
  showModal(html);
}

function closeMonthSummary(){
  closeModal();
  if(G&&G._retirePromptPending){
    G._retirePromptPending=false;
    suggestRetirement();
  }
}

function showContractModal(offers){
  if(offers.length===0)return;
  let html=`<h2>📨 战队邀约</h2><p style="color:var(--text2);margin-bottom:16px">有战队对你感兴趣！</p>`;
  offers.forEach((o,i)=>{
    html+=`
      <div class="contract-card">
        <h4>${o.teamName} <span class="badge badge-${o.teamTier==='topTier'?'purple':o.teamTier==='tier1'?'blue':'yellow'}">${getTierLabel(o.teamTier)}</span>${o.worldRank?` <span class="badge badge-gray">🌍 积分第 ${o.worldRank}</span>`:''}</h4>
        <div class="stat-row"><span class="stat-label">地区</span><span class="stat-value">${o.teamRegion}</span></div>
        <div class="stat-row"><span class="stat-label">月薪</span><span class="stat-value" style="color:var(--green)">${formatMoney(o.salary)}</span></div>
        <div class="stat-row"><span class="stat-label">合同</span><span class="stat-value">${o.contractLength}个月</span></div>
        <div class="stat-row"><span class="stat-label">位置</span><span class="stat-value">${o.isStarter?'★ 首发':'🪑 替补'}</span></div>
        <div style="margin-top:10px;text-align:right">
          <button class="btn-success btn-small" onclick="acceptOffer(G._pendingOffers[${i}])">接受</button>
        </div>
      </div>
    `;
  });
  html+=`<div class="modal-buttons"><button class="btn-secondary" onclick="closeModal()">暂不考虑</button></div>`;
  G._pendingOffers=offers;
  showModal(html);
}

function showSaveSlots(){
  const saves=[];
  for(let i=0;i<3;i++){
    const key='cs_career_save_'+i;
    const data=localStorage.getItem(key);
    if(data){
      try{
        const parsed=JSON.parse(data);
        saves.push({slot:i,name:parsed.player?.name||'Unknown',date:parsed.savedAt||'未知',level:getCareerLabel(parsed.careerLevel||'amateur'),year:parsed.year,month:parsed.month});
      }catch(e){saves.push({slot:i,empty:true})}
    } else {
      saves.push({slot:i,empty:true});
    }
  }
  // Check autosave
  const auto=localStorage.getItem('cs_career_autosave');
  let autoInfo=null;
  if(auto){
    try{
      const parsed=JSON.parse(auto);
      autoInfo={name:parsed.player?.name,year:parsed.year,month:parsed.month,level:getCareerLabel(parsed.careerLevel||'amateur')};
    }catch(e){}
  }
  let html=`<h2>💾 存档管理</h2>`;
  if(autoInfo){
    html+=`<div class="save-slot" onclick="loadGame('autosave')"><div><strong>自动存档</strong><br><span class="save-slot-info">${autoInfo.name} | ${autoInfo.year}年${autoInfo.month}月 | ${autoInfo.level}</span></div><div><button class="btn-success btn-small" onclick="event.stopPropagation();loadGame('autosave')" style="margin-right:4px">读取</button><button class="btn-danger btn-small" onclick="event.stopPropagation();deleteSaveSlot('autosave')">删除</button></div></div>`;
  }
  saves.forEach(s=>{
    if(s.empty){
      html+=`<div class="save-slot" onclick="saveGame(${s.slot})"><div><strong>存档位 ${s.slot+1}</strong><br><span class="save-slot-info">空</span></div><span class="badge badge-blue">保存</span></div>`;
    } else {
      html+=`<div class="save-slot"><div><strong>存档位 ${s.slot+1}</strong><br><span class="save-slot-info">${s.name} | ${s.year}年${s.month}月 | ${s.level}</span></div><div><button class="btn-success btn-small" onclick="loadGame(${s.slot})" style="margin-right:4px">读取</button><button class="btn-primary btn-small" onclick="saveGame(${s.slot})" style="margin-right:4px">覆盖</button><button class="btn-danger btn-small" onclick="deleteSaveSlot(${s.slot})">删除</button></div></div>`;
    }
  });
  html+=`<div class="modal-buttons"><button class="btn-secondary" onclick="closeModal()">关闭</button></div>`;
  showModal(html);
}

function deleteSaveSlot(slot){
  if(!confirm('确定删除这个存档吗？删除后无法恢复。'))return;
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  localStorage.removeItem(key);
  showToast('存档已删除','info');
  showSaveSlots();
}

// ============================================================
// SAVE / LOAD
// ============================================================
function persistGame(silent){
  if(!G)return;
  try{localStorage.setItem('cs_career_autosave',JSON.stringify({...G,savedAt:new Date().toLocaleString()}));}catch(e){}
  if(!silent)showToast('保存成功！','success');
}
function saveGame(slot,silent){
  if(!G){showToast('没有可保存的游戏','error');return}
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  const data={...G,savedAt:new Date().toLocaleString()};
  localStorage.setItem(key,JSON.stringify(data));
  if(!silent){
    showToast('保存成功！','success');
    if(document.getElementById('modal-overlay').classList.contains('active')){
      showSaveSlots();
    }
  }
}

function loadGame(slot){
  const key=slot==='autosave'?'cs_career_autosave':'cs_career_save_'+slot;
  const data=localStorage.getItem(key);
  if(!data){showToast('存档不存在','error');return}
  try{
    G=JSON.parse(data);
    // Backward compatibility: initialize new stamina fields if missing
    if(G.stamina===undefined){
      G.stamina=0;
      G.staminaMax=0;
      G.staminaConsumed=0;
      G.pendingFatigueRecovery=0;
      G.monthTournamentCount=0;
      G.monthTrainingHours=0;
    }
    // Backward compatibility: initialize four-dim caps if missing
    if(!G.player.fourDimCaps){
      const fourDims=['aim','utility','communication','gameSense'];
      const caps=[rand(92,94),rand(92,94),rand(92,94),rand(98,100)];
      for(let i=caps.length-1;i>0;i--){
        const j=rand(0,i);
        [caps[i],caps[j]]=[caps[j],caps[i]];
      }
      G.player.fourDimCaps={};
      fourDims.forEach((dim,i)=>{
        G.player.fourDimCaps[dim]=caps[i];
      });
    }
    if(G.player.hasHitCapBefore===undefined){
      G.player.hasHitCapBefore=false;
    }
    // 积分榜迁移（第 35 轮）：老存档读入时初始化积分排名
    if(!G.teamPoints)ensureTeamPoints();
    if(!G.teamEra)G.teamEra={}; // 纪元迁移（第 36 轮）
    if(!G.pointsHistory)G.pointsHistory=[]; // 快照史迁移（第 36 轮）
    if(!G.training.intensity){
      G.training.intensity='moderate';
    }
    // Backward compatibility: initialize player state fields if missing
    if(G.player.fatigue===undefined)G.player.fatigue=0;
    if(G.player.mentalState===undefined)G.player.mentalState=70;
    if(G.player.form===undefined)G.player.form=50;
    // Sync training hours from intensity
    if(G.training.hours===undefined||G.training.hours<4){
      G.training.hours=getHoursByIntensity(G.training.intensity);
    }
    if(G.life)G.life.training=G.training.hours;
    // Backward compatibility: initialize log arrays if missing
    if(!G.eventLog)G.eventLog=[];
    if(!G.tournamentResults)G.tournamentResults=[];
    if(!G.career.monthlyLog)G.career.monthlyLog=[];
    if(!G.career.matchLog)G.career.matchLog=[];
    if(!G.career.ratingHistory)G.career.ratingHistory=[];
    if(!G.career.achievements)G.career.achievements=[];
    if(!G._triggeredHistoricalEvents)G._triggeredHistoricalEvents=[];
    if(!G._disabledHistoricalEvents)G._disabledHistoricalEvents=[];
    if(!G.rewrittenHistory)G.rewrittenHistory={};
    if(!G._eventCooldowns)G._eventCooldowns={};
    if(!G.qualifiedEvents)G.qualifiedEvents=[];
    // v1.1 backward compatibility
    G.version='1.1';
    if(!G.monthPlan){
      G.monthPlan={trainingIntensity:G.training.intensity||'moderate',restDays:G.life?G.life.rest:6,entertainment:G.life?G.life.entertainment:3,fitness:G.life?G.life.fitness:2,streamingCap:0,mapStrategy:'auto',bans:[],picks:[]};
    }else{
      if(G.monthPlan.streamingCap===undefined)G.monthPlan.streamingCap=0;
      if(!G.monthPlan.mapStrategy)G.monthPlan.mapStrategy='auto';
      if(!Array.isArray(G.monthPlan.bans))G.monthPlan.bans=[];
      if(!Array.isArray(G.monthPlan.picks))G.monthPlan.picks=[];
    }
    if(G.career.totalMaps===undefined){
      G.career.totalMaps=G.career.totalMatches||0;
      G.career.ratingSum=(G.career.avgRating||0)*G.career.totalMaps;
    }
    if(G.career.ratingSum===undefined)G.career.ratingSum=0;
    if(!Array.isArray(G.majorWins)){
      G.majorWins=Array.isArray(G._majorWins)?[...G._majorWins]:[];
    }else if(Array.isArray(G._majorWins)){
      G._majorWins.forEach(k=>{if(!G.majorWins.includes(k))G.majorWins.push(k);});
    }
    G._majorWins=G.majorWins;
    if(G.beatAstralis===undefined)G.beatAstralis=!!G._beatAstralis;
    G._beatAstralis=G.beatAstralis;
    G.qualifiedEvents=G.qualifiedEvents.map(q=>typeof q==='string'?{eventName:q,eventYear:G.year,eventMonth:G.month,teamId:G.team?G.team.id:null}:q);
    if(!G.streaming)G.streaming={followers:0,avgViewers:0,totalDonations:0,monthlyIncome:0,active:false,attraction:0,matchCount:0};
    if(G.streaming.active===undefined)G.streaming.active=false;
    if(!Array.isArray(G._pendingOffers))G._pendingOffers=[];
    delete G._forceSeriesWins;
    delete G._forceQualified;
    if(!G.monthSchedule||G.monthSchedule.year!==G.year||G.monthSchedule.month!==G.month){
      G.monthSchedule=null;
      ensureMonthSchedule(false);
    }
    // Backward compatibility: optimization systems
    if(G.fame===undefined)G.fame=0;
    if(!G.injury)G.injury=null;
    if(!G.mapProficiency)G.mapProficiency={Dust2:50,Mirage:50,Inferno:50,Nuke:50,Ancient:50,Anubis:50,Overpass:50};
    if(!G.honors)G.honors={matchMVP:0,eventMVP:0,eventEVP:0,top20:[],top1:false};
    if(G.honors.eventEVP===undefined)G.honors.eventEVP=0;
    if(!G._yearHonors)G._yearHonors={eventMVP:0,eventEVP:0,majorChampion:0,majorRunnerUp:0,majorTop4:0,superEliteChampion:0,tier1Champion:0};
    if(!G.unlockedAchievements)G.unlockedAchievements=[];
    if(!G.pendingNegotiation)G.pendingNegotiation=null;
    if(!G.inheritedAchievements)G.inheritedAchievements=[];
    if(!G.inheritedHonors)G.inheritedHonors=null;
    if(!G.runNumber)G.runNumber=1;
    // 读取时清理中断弹窗链可能遗留的运行时标志，避免污染新会话
    G._advanceActive=false;
    G._pendingAchPopups=[];
    G._eventPopupCallback=null;
    closeModal();
    showScreen('game-screen');
    renderAll();
    showToast('读取成功！','success');
  }catch(e){
    showToast('存档数据损坏','error');
  }
}

function loadAndContinue(){
  const auto=localStorage.getItem('cs_career_autosave');
  if(auto){
    loadGame('autosave');
  } else {
    for(let i=0;i<3;i++){
      const d=localStorage.getItem('cs_career_save_'+i);
      if(d){loadGame(i);return}
    }
    showToast('没有找到存档','error');
  }
}

function confirmQuit(){
  if(confirm('确定返回主页？游戏将自动保存。')){
    saveGame('autosave');
    showScreen('home-screen');
  }
}

// ============================================================
// INITIALIZATION
// ============================================================
function init(){
  // Check for existing saves
  const hasAuto=localStorage.getItem('cs_career_autosave');
  const hasSave=[0,1,2].some(i=>localStorage.getItem('cs_career_save_'+i));
  if(hasAuto||hasSave){
    document.getElementById('btn-continue').style.display='block';
  }
  // Tab navigation
  document.querySelectorAll('.nav-tab').forEach(tab=>{
    tab.addEventListener('click',()=>switchTab(tab.dataset.tab));
  });
  // Close modal on overlay click
  document.getElementById('modal-overlay').addEventListener('click',e=>{
    if(e.target===document.getElementById('modal-overlay')){
      if(G&&G._eventPopupCallback){closeEventPopup();}else{closeModal();}
    }
  });
  // Init creation screen defaults
  initCreationScreen();
}

// Start
init();
</script>
