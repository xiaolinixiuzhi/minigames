<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>高考模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;
  --card:rgba(255,255,255,0.06);--card-border:rgba(255,255,255,0.1);
  --text:#e8e8f0;--text-dim:rgba(255,255,255,0.5);
  --accent:#f6d365;--accent2:#fda085;
  --good:#43e97b;--bad:#f5576c;--care:#a18cd1;
  --timer-warn:#ff6b6b;
}
html,body{height:100%;font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--text);overflow:hidden}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.screen{display:none;width:100%;max-width:520px;animation:fadeIn .5s ease}
.screen.active{display:flex;flex-direction:column;align-items:center}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(246,211,101,.3)}50%{box-shadow:0 0 20px rgba(246,211,101,.6)}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes timerPulse{0%,100%{transform:scale(1);color:var(--text)}50%{transform:scale(1.15);color:var(--timer-warn)}}

body.phase-title{background:linear-gradient(135deg,#87CEEB 0%,#B0E0E6 40%,#E0F6FF 100%);position:relative;transition:background .8s ease}
body.phase-title::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 20% 30%,rgba(255,223,100,.15) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.2) 0%,transparent 50%);pointer-events:none;z-index:0}

body.phase-night{background:linear-gradient(135deg,#0a0818 0%,#151030 50%,#1a1540 100%);position:relative;transition:background .8s ease}
body.phase-night::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 60%,rgba(246,211,101,.08) 0%,rgba(253,160,133,.03) 30%,transparent 70%);pointer-events:none;z-index:0}

body.phase-question{background:linear-gradient(135deg,#87CEEB 0%,#A8D8EA 50%,#C8E6F0 100%);position:relative;transition:background .8s ease}
body.phase-question::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0}

body.phase-event{background:linear-gradient(135deg,#87CEEB 0%,#A8D8EA 50%,#C8E6F0 100%);position:relative;transition:background .8s ease}
body.phase-event::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,transparent 50%);pointer-events:none;z-index:0}

body.phase-care{background:linear-gradient(135deg,#FFE4C4 0%,#FFDAB9 40%,#FFD4A8 100%);position:relative;transition:background .8s ease}
body.phase-care::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 50%,rgba(255,200,150,.2) 0%,transparent 70%);pointer-events:none;z-index:0}

body.phase-ending{background:linear-gradient(135deg,#87CEEB 0%,#B0C4DE 40%,#C8D8E8 100%);position:relative;transition:background .8s ease}
body.phase-ending::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 50% 30%,rgba(255,223,100,.15) 0%,transparent 60%);pointer-events:none;z-index:0}

body.time-morning.phase-question::before,body.time-morning.phase-event::before,body.time-morning.phase-subject_intro::before,body.time-morning.phase-subject_done::before{background:radial-gradient(ellipse at 30% 10%,rgba(255,223,100,.25) 0%,rgba(255,223,100,.1) 30%,transparent 70%),radial-gradient(ellipse at 70% 20%,rgba(255,240,200,.2) 0%,transparent 50%)}

body.time-afternoon.phase-question::before,body.time-afternoon.phase-event::before,body.time-afternoon.phase-subject_intro::before,body.time-afternoon.phase-subject_done::before{background:radial-gradient(ellipse at 80% 15%,rgba(255,160,100,.3) 0%,rgba(255,180,100,.15) 30%,transparent 70%),radial-gradient(ellipse at 20% 40%,rgba(255,200,150,.15) 0%,transparent 50%)}

body.time-morning.phase-question,body.time-morning.phase-event,body.time-morning.phase-subject_intro,body.time-morning.phase-subject_done{background:linear-gradient(135deg,#87CEEB 0%,#A8D8EA 40%,#E0F0FF 100%)}
body.time-afternoon.phase-question,body.time-afternoon.phase-event,body.time-afternoon.phase-subject_intro,body.time-afternoon.phase-subject_done{background:linear-gradient(135deg,#FFB347 0%,#FFCC80 40%,#FFE0B2 100%)}

body.phase-title,body.phase-question,body.phase-event,body.phase-care,body.phase-ending,body.phase-subject_intro,body.phase-subject_done{--text:#1a1a2e;--text-dim:rgba(0,0,0,0.55);--card:rgba(255,255,255,0.45);--card-border:rgba(255,255,255,0.5)}
body.phase-title .btn-option,body.phase-question .btn-option,body.phase-event .btn-option,body.phase-care .btn-option,body.phase-ending .btn-option,body.phase-subject_intro .btn-option,body.phase-subject_done .btn-option{background:rgba(255,255,255,0.5);border-color:rgba(0,0,0,0.1);color:#1a1a2e}
body.phase-title .btn-option:hover,body.phase-question .btn-option:hover,body.phase-event .btn-option:hover,body.phase-care .btn-option:hover,body.phase-ending .btn-option:hover,body.phase-subject_intro .btn-option:hover,body.phase-subject_done .btn-option:hover{background:rgba(255,255,255,0.7);border-color:var(--accent)}
body.phase-title .btn-option.selected,body.phase-question .btn-option.selected,body.phase-event .btn-option.selected,body.phase-care .btn-option.selected,body.phase-ending .btn-option.selected{border-color:var(--accent);background:rgba(246,211,101,0.3)}
body.phase-title .btn-primary,body.phase-question .btn-primary,body.phase-event .btn-primary,body.phase-care .btn-primary,body.phase-ending .btn-primary{color:#1a1a2e}
body.phase-title h1,body.phase-question h1,body.phase-event h1,body.phase-care h1,body.phase-ending h1,body.phase-title h2,body.phase-question h2,body.phase-event h2,body.phase-care h2,body.phase-ending h2{background:linear-gradient(135deg,#d4a017,#e08040);-webkit-background-clip:text;background-clip:text}
body.phase-title .pressure-bar-wrap,body.phase-question .pressure-bar-wrap,body.phase-event .pressure-bar-wrap,body.phase-care .pressure-bar-wrap,body.phase-ending .pressure-bar-wrap{background:rgba(255,255,255,0.85)}
body.phase-title .pressure-bar,body.phase-question .pressure-bar,body.phase-event .pressure-bar,body.phase-care .pressure-bar,body.phase-ending .pressure-bar{background:rgba(0,0,0,.08)}
body.phase-title .char-card,body.phase-question .char-card,body.phase-event .char-card,body.phase-care .char-card,body.phase-ending .char-card{background:rgba(255,255,255,0.4);border-color:rgba(0,0,0,0.08)}
body.phase-title .char-card:hover,body.phase-question .char-card:hover,body.phase-event .char-card:hover,body.phase-care .char-card:hover,body.phase-ending .char-card:hover{border-color:#d4a017}
body.phase-title .subject-option,body.phase-question .subject-option,body.phase-event .subject-option,body.phase-care .subject-option,body.phase-ending .subject-option,body.phase-subject_intro .subject-option,body.phase-subject_done .subject-option{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.1);color:#1a1a2e}
body.phase-title .subject-option:hover,body.phase-question .subject-option:hover,body.phase-event .subject-option:hover,body.phase-care .subject-option:hover,body.phase-ending .subject-option:hover{border-color:#d4a017;background:rgba(0,0,0,.06)}
body.phase-title .subject-option.selected,body.phase-question .subject-option.selected,body.phase-event .subject-option.selected,body.phase-care .subject-option.selected,body.phase-ending .subject-option.selected{border-color:#d4a017;background:rgba(214,160,23,.15)}
body.phase-title .mod-tag,body.phase-question .mod-tag,body.phase-event .mod-tag,body.phase-care .mod-tag,body.phase-ending .mod-tag{background:rgba(0,0,0,.06);color:rgba(0,0,0,.5)}
body.phase-title .narrative,body.phase-question .narrative,body.phase-event .narrative,body.phase-care .narrative,body.phase-ending .narrative{background:rgba(255,255,255,.4);border-left-color:#b8860b}
body.phase-title .event-card.good,body.phase-question .event-card.good,body.phase-event .event-card.good,body.phase-care .event-card.good,body.phase-ending .event-card.good{background:rgba(34,139,34,.12);border-color:rgba(34,139,34,.35)}
body.phase-title .event-card.bad,body.phase-question .event-card.bad,body.phase-event .event-card.bad,body.phase-care .event-card.bad,body.phase-ending .event-card.bad{background:rgba(178,34,34,.1);border-color:rgba(178,34,34,.3)}
body.phase-title .care-card,body.phase-question .care-card,body.phase-event .care-card,body.phase-care .care-card,body.phase-ending .care-card{background:rgba(161,140,209,.15);border-color:rgba(120,100,180,.35)}
body.phase-title .pressure-fill.low,body.phase-question .pressure-fill.low,body.phase-event .pressure-fill.low,body.phase-care .pressure-fill.low,body.phase-ending .pressure-fill.low{background:#228B22}
body.phase-title .pressure-fill.mid,body.phase-question .pressure-fill.mid,body.phase-event .pressure-fill.mid,body.phase-care .pressure-fill.mid,body.phase-ending .pressure-fill.mid{background:#DAA520}
body.phase-title .pressure-fill.high,body.phase-question .pressure-fill.high,body.phase-event .pressure-fill.high,body.phase-care .pressure-fill.high,body.phase-ending .pressure-fill.high{background:#B22222}
body.phase-title .achievement-hint,body.phase-question .achievement-hint,body.phase-event .achievement-hint,body.phase-care .achievement-hint,body.phase-ending .achievement-hint{color:#b8860b}
body.phase-title .char-card .char-name,body.phase-question .char-card .char-name,body.phase-event .char-card .char-name,body.phase-care .char-card .char-name,body.phase-ending .char-card .char-name{color:#1a1a2e}
body.phase-title .timer-ring .bg,body.phase-question .timer-ring .bg,body.phase-event .timer-ring .bg,body.phase-care .timer-ring .bg,body.phase-ending .timer-ring .bg{stroke:rgba(0,0,0,.1)}
body.phase-title .btn-small,body.phase-question .btn-small,body.phase-event .btn-small,body.phase-care .btn-small,body.phase-ending .btn-small{background:rgba(0,0,0,.06);color:#1a1a2e;border-color:rgba(0,0,0,.1)}

#app{position:relative;z-index:1}

#brightness-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,20,.0);pointer-events:none;z-index:50;transition:background 1.2s ease}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:28px 24px;width:100%;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent)}

h1{font-size:2em;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:8px}
h2{font-size:1.4em;font-weight:700;text-align:center;margin-bottom:12px}
h3{font-size:1.1em;font-weight:600;margin-bottom:8px}
p{line-height:1.7;color:var(--text-dim);text-align:center}
.subtitle{font-size:.9em;color:var(--text-dim);margin-bottom:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 32px;border:none;border-radius:12px;font-size:1em;font-weight:600;cursor:pointer;transition:all .25s ease;width:100%;margin-top:10px;font-family:inherit;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1a2e}
.btn-primary:hover{box-shadow:0 4px 20px rgba(246,211,101,.4)}
.btn-option{background:rgba(255,255,255,.08);color:var(--text);border:1px solid rgba(255,255,255,.12);text-align:left;padding:12px 16px;font-size:.92em;line-height:1.5}
.btn-option:hover{background:rgba(255,255,255,.14);border-color:var(--accent)}
.btn-option.selected{border-color:var(--accent);background:rgba(246,211,101,.12)}
.btn-option.correct-reveal{border-color:var(--good);background:rgba(67,233,123,.1)}
.btn-option.wrong-reveal{border-color:var(--bad);background:rgba(245,87,108,.08)}
.btn-small{padding:10px 20px;font-size:.88em;width:auto}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-top:12px}
.char-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 8px;cursor:pointer;transition:all .25s ease;text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center}
.char-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.char-card .char-name{font-weight:700;font-size:.88em;margin-bottom:4px}
.char-card .char-desc{font-size:.7em;color:var(--text-dim);line-height:1.4;display:none}
.char-card .char-modifiers{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.char-card .mod-tag{font-size:.65em;padding:2px 6px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--text-dim)}
.char-card .achievement-hint{font-size:.6em;color:var(--accent);margin-top:4px;font-style:italic}

.achievements-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .3s ease}
.achievements-modal-content{background:linear-gradient(135deg,var(--bg1),var(--bg2));border:1px solid var(--card-border);border-radius:16px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;--text:#e8e8f0;--text-dim:rgba(255,255,255,0.5)}
.achievements-modal-title{font-size:1.2em;font-weight:700;color:var(--accent);text-align:center;margin-bottom:16px}
.achievements-modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-dim);font-size:1.5em;cursor:pointer}
.achievements-modal-close:hover{color:var(--text)}
.achievements-list{display:flex;flex-direction:column;gap:10px}
.achievement-item-new{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.achievement-item-new.unlocked{border-color:rgba(246,211,101,.3);background:rgba(246,211,101,.05)}
.achievement-item-new.locked{opacity:.5}
.achievement-icon-new{font-size:1.8em;flex-shrink:0}
.achievement-info{flex:1;text-align:left}
.achievement-name{font-weight:700;font-size:.95em;margin-bottom:2px}
.achievement-desc{font-size:.8em;color:var(--text-dim)}
.achievement-hint{font-size:.75em;color:var(--accent);font-style:italic;margin-top:4px}
.achievement-status{font-size:.8em;font-weight:700;color:var(--good)}

.pressure-bar-wrap{width:100%;margin:0;position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:6px 12px;background:rgba(15,12,41,.92);backdrop-filter:blur(8px);z-index:100;display:none;transition:all .3s ease}
.pressure-bar-wrap.visible{display:block}
.pressure-label{display:flex;justify-content:space-between;font-size:.72em;margin-bottom:3px;color:var(--text-dim)}
.pressure-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.pressure-fill{height:100%;border-radius:2px;transition:width .6s ease,background .6s ease;background:var(--good)}
.pressure-fill.low{background:var(--good)}
.pressure-fill.mid{background:var(--accent)}
.pressure-fill.high{background:var(--bad)}
.pressure-fill.flash-up{animation:flashUp .6s ease}
.pressure-fill.flash-down{animation:flashDown .6s ease}
.pressure-change{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.75em;font-weight:700;opacity:0;transition:opacity .3s ease}
.pressure-change.show{opacity:1;animation:fadeUp .8s ease forwards}
.pressure-change.positive{color:var(--bad)}
.pressure-change.negative{color:var(--good)}
@keyframes flashUp{0%{filter:brightness(1)}30%{filter:brightness(1.5);box-shadow:0 0 10px rgba(245,87,108,.8)}100%{filter:brightness(1);box-shadow:none}}
@keyframes flashDown{0%{filter:brightness(1)}30%{filter:brightness(1.3);box-shadow:0 0 10px rgba(67,233,123,.6)}100%{filter:brightness(1);box-shadow:none}}
@keyframes pressureBreathe{0%,100%{opacity:1;box-shadow:0 0 4px rgba(245,87,108,.3)}50%{opacity:.7;box-shadow:0 0 12px rgba(245,87,108,.6)}}
.pressure-fill.breathe{animation:pressureBreathe 2s ease-in-out infinite}
@keyframes fadeUp{0%{opacity:0;transform:translateY(-50%) translateX(10px)}20%{opacity:1;transform:translateY(-50%) translateX(0)}80%{opacity:1;transform:translateY(-50%) translateX(0)}100%{opacity:0;transform:translateY(-80%) translateX(0)}}
@keyframes streakGlow{0%{border-color:rgba(67,233,123,.8);box-shadow:0 0 8px rgba(67,233,123,.4)}50%{border-color:rgba(67,233,123,.4);box-shadow:0 0 16px rgba(67,233,123,.6)}100%{border-color:rgba(67,233,123,0);box-shadow:none}}
.btn-option.streak-flash{animation:streakGlow .8s ease forwards}
@keyframes triggerHighlight{0%{box-shadow:0 0 0 rgba(246,211,101,0)}30%{box-shadow:0 0 20px rgba(246,211,101,.6);border-color:rgba(246,211,101,.8)}100%{box-shadow:0 0 0 rgba(246,211,101,0);border-color:rgba(255,255,255,.1)}}
.char-card.trigger-glow{animation:triggerHighlight 2s ease forwards}

.timer-ring{position:fixed;top:calc(env(safe-area-inset-top,0) + 8px);right:12px;z-index:101;display:none}
.timer-ring.visible{display:block}
.timer-ring svg{width:40px;height:40px;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:2.5}
.timer-ring .bg{stroke:rgba(255,255,255,.1)}
.timer-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.timer-ring .fg.warn{stroke:var(--timer-warn)}
.timer-ring .time-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:700}
.timer-ring .time-text.warn{animation:timerPulse .5s ease infinite}
.timer-ring .fg.pressure-high{stroke:var(--bad)}
.timer-ring .time-text.pressure-high{animation:shake .4s ease infinite}
.timer-ring .fg.pressure-extreme{stroke:#ff0000;filter:drop-shadow(0 0 4px rgba(255,0,0,.5))}
.timer-ring .time-text.pressure-extreme{animation:shake .2s ease infinite}
@keyframes shakeHard{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}90%{transform:translateX(3px)}}
.timer-ring .time-text.pressure-extreme{animation:shakeHard .3s ease infinite}

.progress-text{position:fixed;top:calc(env(safe-area-inset-top,0) + 8px);left:12px;z-index:101;font-size:.75em;color:var(--text-dim);display:none}
.progress-text.visible{display:block}
.progress-text .subject-name{color:var(--accent);font-weight:600}

.question-area{width:100%;margin-top:8px}
.question-text{font-size:1em;line-height:1.8;color:var(--text);margin-bottom:16px;font-weight:500}
.question-subject-tag{display:inline-block;font-size:.75em;padding:3px 10px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1a2e;font-weight:700;margin-bottom:12px}
.options-list{display:flex;flex-direction:column;gap:8px}

.narrative{font-size:1em;line-height:2;color:var(--text);text-align:left;font-style:italic;padding:16px 20px;margin:16px 0;background:rgba(255,255,255,.04);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;animation:slideUp .6s ease}
.narrative::before{content:'"';font-size:1.4em;color:var(--accent);margin-right:4px}
.narrative::after{content:'"';font-size:1.4em;color:var(--accent);margin-left:4px}

.event-card{padding:20px;border-radius:12px;text-align:center;animation:fadeIn .5s ease}
.event-card.good{background:rgba(67,233,123,.1);border:1px solid rgba(67,233,123,.3)}
.event-card.bad{background:rgba(245,87,108,.1);border:1px solid rgba(245,87,108,.3)}
.event-card .event-icon{font-size:2em;margin-bottom:8px}
.event-card .event-text{font-size:.92em;line-height:1.7;color:var(--text)}

.care-card{background:rgba(161,140,209,.1);border:1px solid rgba(161,140,209,.3);border-radius:12px;padding:20px;text-align:center;animation:fadeIn .5s ease}
.care-card .care-icon{font-size:2em;margin-bottom:8px}
.care-card .care-text{font-size:.95em;line-height:1.8;color:var(--text)}

.subject-intro{text-align:center;padding:40px 0}
.subject-intro .subject-name{font-size:1.8em;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subject-intro .subject-desc{color:var(--text-dim);font-size:.9em}

.result-card{text-align:center;padding:20px 0}
.result-score{font-size:3em;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:16px 0}
.result-tier{font-size:1.2em;font-weight:700;margin-bottom:12px}
.result-summary{font-size:.92em;line-height:1.8;color:var(--text-dim);margin-bottom:16px;text-align:left}
.result-breakdown{width:100%;margin:16px 0;text-align:left}
.result-breakdown .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.88em}
.result-breakdown .row .subj-name{color:var(--text-dim)}
.result-breakdown .row .subj-score{font-weight:600;color:var(--accent)}

.unlock-banner{background:linear-gradient(135deg,rgba(246,211,101,.2),rgba(253,160,133,.15));border:2px solid rgba(246,211,101,.5);border-radius:16px;padding:20px;text-align:center;margin:20px 0;animation:glow 2s ease infinite}
.unlock-banner.auto-fade{animation:glow 2s ease infinite,fadeOutSlow 1s ease 2s forwards}
@keyframes fadeOutSlow{from{opacity:1;max-height:200px;margin:20px 0;padding:20px}to{opacity:0;max-height:0;margin:0;padding:0;overflow:hidden}}
.unlock-banner .unlock-title{font-size:1em;color:var(--accent);font-weight:700;margin-bottom:8px;text-shadow:0 0 10px rgba(246,211,101,.5)}
.unlock-banner .unlock-name{font-size:1.2em;font-weight:800;color:var(--text)}

.stars{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:breathe 3s ease infinite}

.final-msg{font-size:.95em;color:var(--care);text-align:center;margin-top:12px;font-style:italic;line-height:1.8}

.hidden{display:none!important}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}

.progress-dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.progress-dots .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15)}
.progress-dots .dot.done{background:var(--accent)}
.progress-dots .dot.current{background:var(--accent2);animation:pulse 1s ease infinite}

@media(max-width:480px){
  .card{padding:16px 14px;padding-top:48px}
  h1{font-size:1.4em}
  h2{font-size:1.1em}
  .btn{padding:14px 20px;min-height:48px}
  .btn-option{padding:14px 16px;font-size:.88em;min-height:48px}
  .question-text{font-size:.9em;line-height:1.7}
  .timer-ring svg{width:36px;height:36px}
  .timer-ring{right:10px}
  .progress-text{font-size:.7em}
  .narrative{font-size:.88em;line-height:1.8;padding:12px 14px}
  .pressure-bar-wrap{padding:5px 10px}
  .pressure-label{font-size:.68em}
  .pressure-bar{height:3px}
  .char-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .char-card{padding:10px 6px;min-height:80px}
  .char-card .char-name{font-size:.78em}
  .achievements-grid{grid-template-columns:1fr}
}

@media(max-width:360px){
  .card{padding:14px 12px;padding-top:44px}
  h1{font-size:1.2em}
  .btn{padding:12px 16px;font-size:.85em}
  .btn-option{padding:12px 14px;font-size:.82em}
  .timer-ring svg{width:32px;height:32px}
  .char-grid{gap:6px}
  .char-card{padding:8px 4px;min-height:70px}
  .char-card .char-name{font-size:.72em}
  .char-card .mod-tag{font-size:.6em;padding:1px 4px}
}

.subject-select{display:flex;flex-direction:column;gap:12px;margin:20px 0}
.subject-select-group{background:rgba(255,255,255,.04);border-radius:12px;padding:16px}
.subject-select-group-title{font-size:.88em;color:var(--accent);font-weight:700;margin-bottom:10px;text-align:center}
.subject-select-options{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.subject-option{padding:10px 16px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .25s ease;font-size:.88em;color:var(--text);min-width:70px;text-align:center}
.subject-option:hover{border-color:var(--accent);background:rgba(246,211,101,.08)}
.subject-option.selected{border-color:var(--accent);background:rgba(246,211,101,.15);color:var(--accent);font-weight:600}
.subject-option.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.subject-select-hint{text-align:center;font-size:.8em;color:var(--text-dim);margin-top:8px}

.result-breakdown-details summary{list-style:none}
.result-breakdown-details summary::-webkit-details-marker{display:none}
.result-breakdown-details[open] summary{margin-bottom:8px}
.result-breakdown-details[open] summary::before{content:'▼ '}
.result-breakdown-details:not([open]) summary::before{content:'► '}
</style>
</head>

function updateBodyPhase(){
  document.body.className=document.body.className.replace(/phase-\S+/g,'').replace(/time-\S+/g,'').trim();
  const phaseMap={title:'phase-title',subject_select:'phase-title',night:'phase-night',subject_intro:'phase-question',question:'phase-question',event:'phase-event',care:'phase-care',subject_done:'phase-question',ending:'phase-ending'};
  const phaseClass=phaseMap[state.phase];

    if(state.subjectIdx<2){
      document.body.classList.add('time-morning');
    }else{
      document.body.classList.add('time-afternoon');
    }
  }
}

function updateBrightness(bonusBright){
  const overlay=document.getElementById('brightness-overlay');
  if(!overlay)return;
  const morningSubjects=[0,3,4];
  const afternoonSubjects=[1,2,5];
  let opacity=0.0;
  let r=255,g=250,b=220;
  if(morningSubjects.includes(state.subjectIdx)){
    opacity=0.03;r=255;g=245;b=200;
  }else if(afternoonSubjects.includes(state.subjectIdx)){
    opacity=0.08;r=255;g=200;b=130;
  }
  if(bonusBright)opacity=Math.max(0,opacity-0.05);
  overlay.style.background=`rgba(${r},${g},${b},${opacity})`;
}

function calculateSubjectScore(subjId,baseScore){
  const char=getChar();
  const h=char.hidden;
  const timeSensitivityFactor=h.timeSensitivity/100;
  let randomMin=0.65-(timeSensitivityFactor*0.15);
  const randomMax=1.05;
  
  if(state.cramming&&state.subjectIdx===0){
    randomMin+=0.04;
  }else if(state.cramming&&state.subjectIdx>0){
    randomMin-=0.03;
  }
  
  const pressureDiff=Math.max(0,state.pressure-h.pressureResist);
  const pressureOverBy10=Math.floor(pressureDiff/10);
  if(pressureOverBy10>0){
    randomMin-=pressureOverBy10*0.05;
  }
  
  if(state.streakBonusActive&&!state.triggerUsed){
    randomMin+=0.03;
  }
  
  let randomCoeff=randomMin+Math.random()*(randomMax-randomMin);
  
  let score=h.strength*randomCoeff;
  
  if(pressureDiff>0){
    const pressurePenalty=pressureDiff*0.3;
    score-=pressurePenalty;
  }
  const lastSubjScore=state.lastSubjectScores[subjId]||0;
  if(lastSubjScore>0&&lastSubjScore<60){
    const resilienceBoost=h.resilience*0.15;
    score+=resilienceBoost;
  }
  if(h.subjectBias&&h.subjectBias[subjId]!==undefined){
    score+=h.subjectBias[subjId];
  }
  score=score*0.3+baseScore*0.7;
  
  if(state.charId==='repeat'&&state.triggered&&!state.triggerUsed&&state.subjectIdx===0){
    score+=15;
  }
  
  return Math.round(clamp(score,0,100));
}

function updateMaxPressure(){
  if(state.pressure>state.maxPressureReached){
    state.maxPressureReached=state.pressure;
  }
  const currentSubjectId=state.selectedSubjects[state.subjectIdx];
  if(currentSubjectId){
    if(!state.pressureBySubject[currentSubjectId]){
      state.pressureBySubject[currentSubjectId]=0;
    }
    if(state.pressure>state.pressureBySubject[currentSubjectId]){
      state.pressureBySubject[currentSubjectId]=state.pressure;
    }
  }
}

function checkHiddenTrigger(){
  if(state.triggered||state.triggerUsed)return;
  const char=getChar();
  const charId=state.charId;
  
  if(charId==='normal'){
    if(state.consecutiveGoodChoices>=2){
      state.triggered=true;
      showTriggerNotification('喝口热汤也挺好','全科目+8分');
    }
  }else if(charId==='repeat'){
    if(state.pressure>=60){
      state.triggered=true;
      showTriggerNotification('又是这个位置','第一科+15分');
    }
  }else if(charId==='art'){
    if(state.careSugarSoup){
      state.triggered=true;
      showTriggerNotification('集训之外的甜','全科目+10分');
    }
  }else if(charId==='science'){
    if(state.consecutiveScienceGood>=2){
      state.triggered=true;
      showTriggerNotification('这题我会','物理+20分');
    }
  }else if(charId==='biased'){
    if(state.pressure>=60){
      state.triggered=true;
      showTriggerNotification('偏得理直气壮','最高分科目+25');
    }
  }else if(charId==='nervous'){
    if(state.pressure>=50&&state.subjectIdx>=3){
      state.triggered=true;
      showTriggerNotification('手又开始抖了','后三科+12分');
    }
  }else if(charId==='county'){
    if(state.careParentSoup){
      state.triggered=true;
      showTriggerNotification('家里的味道','压力-20');
    }
  }else if(charId==='competition'){
    if(state.consecutiveCompGood>=2){
      state.triggered=true;
      showTriggerNotification('竞赛生的本能','物理/化学/生物各+10分');
    }
  }else if(charId==='leftbehind'){
    if(state.careParentSMS||state.careWarmFood){
      state.triggered=true;
      showTriggerNotification('有人惦记','最终分+15');
    }
  }else if(charId==='familyCrisis'){
    if(state.pressure>=65){
      state.triggered=true;
      showTriggerNotification('撑过就好','压力-25');
    }
  }else if(charId==='preadmit'){
    if(state.consecutiveGoodChoices>=2&&state.subjectIdx>=3){
      state.triggered=true;
      showTriggerNotification('还要证明一次','后三科+15分');
    }
  }else if(charId==='slackoff'){
    if(state.subjectIdx>=3&&state.consecutiveGoodChoices>=1){
      state.triggered=true;
      showTriggerNotification('现在开始也不晚','全科目+12分');
    }
  }
}

function showTriggerNotification(title,effect){
  const notification=document.createElement('div');
  notification.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(246,211,101,.95),rgba(253,160,133,.9));color:#1a1a2e;padding:24px 32px;border-radius:16px;z-index:300;text-align:center;animation:fadeIn .5s ease;box-shadow:0 8px 32px rgba(0,0,0,.3)';
  notification.innerHTML=`
    <div style="font-size:1.2em;font-weight:700;margin-bottom:8px">🎯 ${title}</div>
    <div style="font-size:.9em">${effect}</div>
  `;
  document.body.appendChild(notification);
  setTimeout(()=>{
    notification.style.transition='opacity .5s ease';
    notification.style.opacity='0';
    setTimeout(()=>notification.remove(),500);
  },2000);
}

function applyTriggerBonus(){
  if(!state.triggered||state.triggerUsed)return 0;
  const charId=state.charId;
  let bonus=0;
  
  if(charId==='normal'){
    bonus=8*state.selectedSubjects.length;
  }else if(charId==='repeat'){
    bonus=0;
  }else if(charId==='art'){
    bonus=10*state.selectedSubjects.length;
  }else if(charId==='science'&&state.selectedSubjects.includes('physics')){
    bonus=20;
  }else if(charId==='biased'){
    bonus=0;
  }else if(charId==='nervous'&&state.subjectIdx>=3){
    bonus=36;
  }else if(charId==='county'){
    state.pressure=clamp(state.pressure-20,0,100);
  }else if(charId==='competition'){
    const scienceSubjects=['physics','chemistry','biology'];
    bonus=state.selectedSubjects.filter(id=>scienceSubjects.includes(id)).length*10;
  }else if(charId==='leftbehind'){
    bonus=15;
  }else if(charId==='familyCrisis'){
    state.pressure=clamp(state.pressure-25,0,100);
  }else if(charId==='preadmit'&&state.subjectIdx>=3){
    bonus=45;
  }else if(charId==='slackoff'){
    bonus=12*state.selectedSubjects.length;
  }
  
  state.triggerUsed=true;
  state.streakBonusActive=false;
  return bonus;
}

function updatePressureUI(changeAmount){
  const p=state.pressure;
  updateMaxPressure();
  if(p>=70)state.pressureWasHigh=true;
  if(state.pressureWasHigh&&p<50&&changeAmount!==undefined&&changeAmount<0){
    state.pressureRecovered=true;
    state.pressureWasHigh=false;
  }
  $('pressureVal').textContent=p+'%';
  $('pressureFill').style.width=p+'%';
  let cls='pressure-fill '+(p<40?'low':p<70?'mid':'high');
  if(p>=70)cls+=' breathe';
  $('pressureFill').className=cls;
  if(changeAmount!==undefined&&changeAmount!==0){
    showPressureChange(changeAmount);
    const fill=$('pressureFill');
    if(changeAmount>0){
      fill.classList.add('flash-up');
      setTimeout(()=>fill.classList.remove('flash-up'),600);
    }else{
      fill.classList.add('flash-down');
      setTimeout(()=>fill.classList.remove('flash-down'),600);
    }
  }
}

function showPressureChange(amount){
  const changeEl=$('pressureChange');
  if(!changeEl)return;
  changeEl.textContent=(amount>0?'+':'')+amount+'%';
  changeEl.className='pressure-change show '+(amount>0?'positive':'negative');
  setTimeout(()=>{changeEl.className='pressure-change'},1500);
}

function updateProgressText(){
  const subjectId=state.selectedSubjects[state.subjectIdx];
  const subj=SUBJECTS.find(s=>s.id===subjectId);
  if(subj&&$('progressSubject')){
    $('progressSubject').textContent=subj.name;
    $('progressIndex').textContent=`第${state.subjectIdx+1}/${state.selectedSubjects.length}科`;
  }
}

function showProgressText(v){$('progressText')?.classList.toggle('visible',v)}

function showPressureBar(v){$('pressureWrap').classList.toggle('visible',v)}
function showTimer(v){$('timerRing').classList.toggle('visible',v)}

function updateTimerUI(){
  const t=state.timeLeft;
  const pct=state.timerTotal>0?t/state.timerTotal:0;
  const offset=CIRC*(1-pct);
  const circle=$('timerCircle');
  const text=$('timerText');
  circle.style.strokeDasharray=CIRC;
  circle.style.strokeDashoffset=offset;
  text.textContent=t;
  if(t<=5){circle.classList.add('warn');text.classList.add('warn')}
  else{circle.classList.remove('warn');text.classList.remove('warn')}
  if(state.pressure>=85){
    circle.classList.add('pressure-extreme');text.classList.add('pressure-extreme');
    circle.classList.remove('pressure-high');text.classList.remove('pressure-high');
  }else if(state.pressure>=70){
    circle.classList.add('pressure-high');text.classList.add('pressure-high');
    circle.classList.remove('pressure-extreme');text.classList.remove('pressure-extreme');
  }else{
    circle.classList.remove('pressure-high');text.classList.remove('pressure-high');
    circle.classList.remove('pressure-extreme');text.classList.remove('pressure-extreme');
  }
}

function startTimer(seconds,onDone){
  clearInterval(state.timerInterval);
  state.timeLeft=seconds;
  state.timerTotal=seconds;
  updateTimerUI();
  showTimer(true);
  state.timerInterval=setInterval(()=>{
    state.timeLeft--;
    updateTimerUI();
    if(state.timeLeft<=0){
      clearInterval(state.timerInterval);
      showTimer(false);
      onDone();
    }
  },1000);
}
function stopTimer(){clearInterval(state.timerInterval);showTimer(false)}

window.selectSecondSubject=function(subjectId){
  if(!state.secondSubjects)state.secondSubjects=[];
  
  const idx=state.secondSubjects.indexOf(subjectId);
  if(idx>-1){
    state.secondSubjects.splice(idx,1);
  }else{
    if(state.secondSubjects.length>=2){
      state.secondSubjects.shift();
    }
    state.secondSubjects.push(subjectId);
  }
  
  const options=document.querySelectorAll('#secondChoiceOptions .subject-option');
  options.forEach(opt=>{
    const isSelected=state.secondSubjects.includes(opt.dataset.subject);
    opt.classList.toggle('selected',isSelected);
    
    if(state.secondSubjects.length>=2&&!isSelected){
      opt.classList.add('disabled');
    }else{
      opt.classList.remove('disabled');
    }
  });
  
  const hint=document.getElementById('secondChoiceHint');
  if(hint){
    hint.textContent=`已选：${state.secondSubjects.length}/2`;
  }
  
  checkSubjectSelectionComplete();
};

  const btn=document.getElementById('confirmSubjectBtn');

    const firstSelected=!!state.firstSubject;

    btn.disabled=!(firstSelected&&secondSelected);
    if(firstSelected&&secondSelected){
      btn.textContent='开始考试';
      if(_subjectAutoTimer)clearTimeout(_subjectAutoTimer);
      _subjectAutoTimer=setTimeout(()=>{_subjectAutoTimer=null;if(!btn.disabled&&document.getElementById('confirmSubjectBtn'))confirmSubjects()},600);

function renderSubjectIntro(){
  state.phase='subject_intro';

  if(!subj){
    renderEnding();
    return;
  }
  const char=getChar();
  let subjectPressure=8;
  if(char.hidden.pressureResist>=70){
    subjectPressure=5;
  }else if(char.hidden.timeSensitivity>=75){
    subjectPressure=12;
  }
  state.pressure=clamp(state.pressure+subjectPressure,0,100);
  updatePressureUI(subjectPressure);
  updateBrightness();

function updateProgressDots(){
  const total=state.selectedSubjects.length;
  const done=state.subjectIdx;
  let dots='';
  for(let i=0;i<total;i++){
    const cls=i<state.subjectIdx?'dot done':i===state.subjectIdx?'dot current':'dot';
    dots+=`<div class="${cls}"></div>`;
  }
  const wrap=app.querySelector('.progress-dots');
  if(wrap)wrap.innerHTML=dots;
}

function renderQuestion(){
  const subjectId=state.selectedSubjects[state.subjectIdx];
  const subj=SUBJECTS.find(s=>s.id===subjectId);
  const charQuestions=QUESTIONS[subj.id];
  if(!charQuestions){
    renderSubjectDone();
    return;
  }
  const q=charQuestions[state.charId]||charQuestions.normal;
  state.totalQuestions++;
  
  const shuffledOpts=[...q.opts];
  for(let i=shuffledOpts.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffledOpts[i],shuffledOpts[j]]=[shuffledOpts[j],shuffledOpts[i]];
  }
  state.currentShuffledOpts=shuffledOpts;
  
  const optsHtml=shuffledOpts.map((o,i)=>{
    const labels=['A','B','C','D','E','F'];
    const label=labels[i]||String(i+1);
    const textWithoutLabel=o.text.replace(/^[A-F]\.\s*/, '');
    return `<button class="btn btn-option" data-idx="${i}" onclick="answerQuestion(${i})">${label}. ${textWithoutLabel}</button>`;
  }).join('');

  render(`
    <div class="card">
      <div class="progress-dots">${state.selectedSubjects.map((_,i)=>`<div class="${i<state.subjectIdx?'dot done':i===state.subjectIdx?'dot current':'dot'}"></div>`).join('')}</div>
      <div class="question-area">
        <span class="question-subject-tag">${subj.name}</span>
        <div class="question-text">${q.q}</div>
        <div class="options-list" id="optsList">${optsHtml}</div>
      </div>
    </div>`);

  startTimer(subj.time,()=>answerQuestion(-1));
}

window.answerQuestion=function(idx){
  stopTimer();
  const subjectId=state.selectedSubjects[state.subjectIdx];
  const subj=SUBJECTS.find(s=>s.id===subjectId);
  const charQuestions=QUESTIONS[subj.id];
  const q=charQuestions[state.charId]||charQuestions.normal;
  const opts=state.currentShuffledOpts||q.opts;
  let score;
  if(idx===-1){
    score=10;
  }else{
    score=opts[idx].score;
  }
  
  const bestIdx=opts.reduce((bi,o,j)=>o.score>opts[bi].score?j:bi,0);
  const sortedScores=[...opts.map(o=>o.score)].sort((a,b)=>b-a);
  const bestScore=sortedScores[0];
  const midScore=sortedScores[Math.floor(sortedScores.length/2)];
  
  let pressureChange=0;
  if(idx===-1){
    pressureChange=10;
  }else if(idx===bestIdx){
    pressureChange=state.pressure>=70?-3:-6;
  }else if(opts[idx].score>=midScore){
    pressureChange=2;
  }else{
    pressureChange=8;
  }
  state.pressure=clamp(state.pressure+pressureChange,0,100);
  updatePressureUI(pressureChange);
  
  const buttons=app.querySelectorAll('.btn-option');
  
  if(idx===bestIdx){
    state.consecutiveGoodChoices++;
    if(state.consecutiveGoodChoices>=2){
      state.streakBonusActive=true;
      const selBtn=buttons[idx];
      if(selBtn){selBtn.classList.add('streak-flash');setTimeout(()=>selBtn.classList.remove('streak-flash'),900);}
    }
    if(['math','physics'].includes(subjectId)){
      state.consecutiveScienceGood++;
    }
    if(['physics','chemistry','biology'].includes(subjectId)){
      state.consecutiveCompGood++;
    }
  }else{
    state.consecutiveGoodChoices=0;
    if(['math','physics'].includes(subjectId)){
      state.consecutiveScienceGood=0;
    }
    if(['physics','chemistry','biology'].includes(subjectId)){
      state.consecutiveCompGood=0;
    }
  }
  
  score=calculateSubjectScore(subj.id,score);
  state.lastSubjectScores[subj.id]=score;

  if(!state.scores[subj.id])state.scores[subj.id]=[];
  state.scores[subj.id].push(score);
  state.answeredQuestions++;
  
  checkHiddenTrigger();
  
  buttons.forEach((b,i)=>{
    b.disabled=true;
    b.onclick=null;
    if(i===idx){
      setTimeout(()=>b.classList.add('selected'),150);
    }
    if(i===bestIdx){
      setTimeout(()=>b.classList.add('correct-reveal'),400);
    }else if(i===idx&&idx!==bestIdx){
      setTimeout(()=>b.classList.add('wrong-reveal'),400);
    }
  });

  const narrative=generateNarrative(subj,q,idx,score);
  setTimeout(()=>{
    const narr=document.createElement('div');
    narr.className='narrative';
    narr.textContent=narrative;
    const card=app.querySelector('.card');
    if(card){card.appendChild(narr)}
    const nextBtn=document.createElement('button');
    nextBtn.className='btn btn-primary mt16';
    nextBtn.textContent='继续';
    nextBtn.style.animation='fadeIn .4s ease';
    nextBtn.onclick=()=>{
      renderSubjectDone();
    };
    if(card)card.appendChild(nextBtn);
    buttons.forEach(b=>{b.style.transition='opacity .3s ease';b.style.opacity='.5'});
    const qText=app.querySelector('.question-text');
    if(qText){qText.style.transition='opacity .3s ease';qText.style.opacity='.6'}
    const tag=app.querySelector('.question-subject-tag');
    if(tag){tag.style.transition='opacity .3s ease';tag.style.opacity='.4'}
  },800);
};

function generateNarrative(subj,q,optIdx,score){
  const c=state.charId;
  const charPersonality=CHAR_PERSONALITY[c]||{calm:'从容',struggle:'坚持'};
  let tone='normal';
  if(score>=85){
    tone='calm';
  }else if(score<60||state.pressure>70){
    tone='struggle';
  }
  const templates=NARRATIVE_TEMPLATES[subj.id];
  if(!templates||!templates[0]){
    return '你写完了答案，放下笔，深吸了一口气。';
  }
  const toneTemplates=templates[0][tone]||templates[0].normal;
  const idx=optIdx===-1?q.opts.length-1:optIdx;
  let narrative=toneTemplates[idx]||'你写完了答案，放下笔，深吸了一口气。';
  if(c==='repeat'&&tone==='struggle'){
    narrative=narrative.replace('你','去年的你也是这样，但今年的你');
  }else if(c==='science'&&tone==='calm'){
    narrative=narrative.replace('你','作为理科大神的你');
  }else if(c==='nervous'&&tone==='struggle'){
    narrative=narrative.replace('你','紧张的你');
  }else if(c==='county'&&tone==='struggle'){
    narrative=narrative.replace('你','来自县城的你');
  }else if(c==='leftbehind'&&tone==='calm'){
    narrative=narrative.replace('你','独立的你');
  }
  
  if(state.consecutiveGoodChoices>=3&&tone==='calm'){
    narrative+='（渐入佳境，越写越稳了。）';
  }else if(state.consecutiveGoodChoices>=2&&tone==='calm'){
    narrative+='（感觉顺了一点，继续稳住。）';
  }else if(state.consecutiveGoodChoices>=3&&tone==='struggle'){
    narrative+='（虽然状态不好，但你已经渐稳了。）';
  }else if(state.consecutiveGoodChoices>=2&&tone==='struggle'){
    narrative+='（虽然状态不好，但感觉比之前顺了一点。）';
  }
  
  if(state.pressure>70){
    const bodyDetailsCalm=['你深吸一口气，压下狂跳的心','额头上有细密的汗珠，但你的手很稳','疲惫感袭来，但你咬紧牙关'];
    const bodyDetailsStruggle=['你的手心微微出汗','你感觉呼吸有些急促','你的手有些发抖','你深吸一口气，试图让自己冷静下来'];
    const details=tone==='calm'?bodyDetailsCalm:bodyDetailsStruggle;
    const detail=details[Math.floor(Math.random()*details.length)];
    narrative+=`（${detail}）`;
  }
  
  if(state.triggered&&state.triggerUsed){
    const triggerHints={
      repeat:'（去年的遗憾，今年终于补上了。）',
      art:'（集训教会你的不只是画画，还有坚持。）',
      science:'（竞赛生的直觉，让你对答案深信不疑。）',
      biased:'（偏科又怎样？你用自己的方式证明了实力。）',
      nervous:'（手还在抖，但你已经不再害怕了。）',
      county:'（县城出来的你，比任何人都珍惜这次机会。）',
      competition:'（竞赛训练出的思维，在考场上一览无余。）',
      leftbehind:'（一个人的日子，让你比谁都坚强。）',
      familyCrisis:'（那些独自承受的夜晚，化作了笔下的力量。）',
      preadmit:'（没能保送的遗憾，此刻都变成了动力。）',
      slackoff:'（从摆烂到认真，你证明了自己可以改变。）',
      normal:'（那口热汤的温暖，一直陪着你。）'
    };
    narrative+=triggerHints[c]||'';
  }
  
  if(state.pressureRecovered){
    narrative+='（感觉缓过来了，呼吸也平稳了许多。）';
    state.pressureRecovered=false;
  }
  
  if(state.cramming&&state.subjectIdx===0){
    narrative+='（昨晚临时看的重点有些混在一起，有点慌，但还行。）';
  }
  
  if(optIdx===-1){
    const timeoutReactions={
      nervous:'（时间到了，你脑子一片空白，手还在抖。）',
      county:'（时间到了，你咬紧牙——县城出来的你，不甘心。)',
      repeat:'（时间到了，去年也是这样……但今年你至少写完了。）',
      science:'（时间到了，最后几步没来得及验证，有些遗憾。）',
      art:'（时间到了，你放下笔，心想集训时也没少赶工。）',
      leftbehind:'（时间到了，你一个人默默放下笔，已经习惯了。)',
      slackoff:'（时间到了，你心想曾经摆烂的自己可能连这都写不完。）',
      familyCrisis:'（时间到了，你深吸一口气，压下所有情绪。）',
      biased:'（时间到了，强项的部分应该没问题，弱项……随缘吧。）',
      competition:'（时间到了，竞赛训练的速度还是不够用。）',
      preadmit:'（时间到了，没能保送的你，连时间都不够用。）'
    };
    narrative+=timeoutReactions[state.charId]||'（时间到了，你放下笔，叹了口气。）';
  }
  
  return narrative;
}

function renderSubjectDone(){
  state.phase='subject_done';
  const subjectId=state.selectedSubjects[state.subjectIdx];
  const subj=SUBJECTS.find(s=>s.id===subjectId);
  const text='你走出了考场，深吸一口气。'+(state.subjectIdx>=state.selectedSubjects.length-1?'终于考完了！':'准备下一科吧。');
  const isLastSubject=state.subjectIdx>=state.selectedSubjects.length-1;
  render(`
    <div class="card">
      <h3 style="text-align:center;margin-bottom:16px">${subj.name} · 考试结束</h3>
      <div class="narrative" style="margin:0 0 20px">${text}</div>
      <button class="btn btn-primary" onclick="afterSubject()">${isLastSubject?'查看成绩':'继续'}</button>
    </div>`);
}

window.afterSubject=function(){
  state.subjectIdx++;

  if(state.subjectIdx>=state.selectedSubjects.length){
    renderEnding();
    return;
  }

  const afterSubjIdx=state.subjectIdx;
  const highPressureThreshold=70;
  const careCheckpoints=[2,4];
  
  if(state.pressure>=highPressureThreshold&&state.careEventTriggered===0){
    renderCareMoment(()=>{
      checkRandomEventOrContinue();
    });
    return;
  }
  
  if(careCheckpoints.includes(afterSubjIdx)){
    renderCareMoment(()=>{
      checkRandomEventOrContinue();
    });
    return;
  }
  
  if(state.pressure>=highPressureThreshold&&afterSubjIdx!==1&&afterSubjIdx!==5){
    renderCareMoment(()=>{
      checkRandomEventOrContinue();
    });
    return;
  }
  
  checkRandomEventOrContinue();
};

function checkRandomEventOrContinue(){

  state.phase='event';
  const charEvents=CHARACTER_EVENTS[state.charId];
  const useCharEvent=charEvents&&Math.random()<0.4;
  
  let evt,isCharEvent=false;
  if(useCharEvent){
    evt=rand(charEvents);
    isCharEvent=true;
  }else{
    const goodThreshold=state.pressure<40?0.7:state.pressure<70?0.5:0.3;
    const isGood=Math.random()<goodThreshold;
    const pool=isGood?RANDOM_EVENTS.good:RANDOM_EVENTS.bad;
    evt=rand(pool);
  }
  
  const charMods=getChar().mods;
  let effect=evt.effect;
  effect=Math.round(effect*(1-charMods.eventLuck/100));

function renderEnding(){
  state.phase='ending';
  showTimer(false);
  showPressureBar(false);

  const subjNames=state.selectedSubjects;
  const subjMaxes={chinese:150,math:150,english:150,physics:100,history:100,chemistry:100,biology:100,geography:100,politics:100};
  const subjScores={};
  let total=0;

  state.selectedSubjects.forEach(subjectId=>{
    const scores=state.scores[subjectId]||[];
    const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;
    const max=subjMaxes[subjectId]||150;
    const final=Math.round(avg/100*max);
    subjScores[subjectId]=final;
    total+=final;
  });

  if(state.charId==='biased'&&state.triggered&&state.triggerUsed){
    let maxSubj=null,maxScore=-1;
    Object.keys(subjScores).forEach(sid=>{
      if(subjScores[sid]>maxScore){maxScore=subjScores[sid];maxSubj=sid;}
    });
    if(maxSubj){
      const subjMax=subjMaxes[maxSubj]||150;
      subjScores[maxSubj]=Math.min(maxScore+25,subjMax);
      total=subjScores[maxSubj]-maxScore+total;

    if(charId==='leftbehind'&&unlockAchievement('trigger_leftbehind'))newAchievements.push('有人惦记');
    if(charId==='familyCrisis'&&unlockAchievement('trigger_familyCrisis'))newAchievements.push('撑过就好');
    if(charId==='preadmit'&&unlockAchievement('trigger_preadmit'))newAchievements.push('还要证明一次');
    if(charId==='slackoff'&&unlockAchievement('trigger_slackoff'))newAchievements.push('现在开始也不晚');
  }
  
  saveGlobalStats();

  const unlocks=[];
  if(globalStats.totalRounds>=1&&!CHARS.find(c=>c.id==='repeat').unlocked){CHARS.find(c=>c.id==='repeat').unlocked=true;unlocks.push('复读生');}
  if(globalStats.totalRounds>=2&&!CHARS.find(c=>c.id==='art').unlocked){CHARS.find(c=>c.id==='art').unlocked=true;unlocks.push('艺考生');}
  if(globalStats.totalRounds>=3&&!CHARS.find(c=>c.id==='science').unlocked){CHARS.find(c=>c.id==='science').unlocked=true;unlocks.push('理科大神');}
  if(globalStats.totalRounds>=4&&!CHARS.find(c=>c.id==='biased').unlocked){CHARS.find(c=>c.id==='biased').unlocked=true;unlocks.push('偏科战神');}
  if(total<90&&!CHARS.find(c=>c.id==='nervous').unlocked){CHARS.find(c=>c.id==='nervous').unlocked=true;unlocks.push('发挥失常型');}
  if(globalStats.totalRounds>=5&&!CHARS.find(c=>c.id==='county').unlocked){CHARS.find(c=>c.id==='county').unlocked=true;unlocks.push('县城考生');}
  if(globalStats.scienceGodUsed&&globalStats.scienceGodScore>=120&&!CHARS.find(c=>c.id==='competition').unlocked){CHARS.find(c=>c.id==='competition').unlocked=true;unlocks.push('竞赛生');}
  if(globalStats.totalRounds>=6&&!CHARS.find(c=>c.id==='leftbehind').unlocked){CHARS.find(c=>c.id==='leftbehind').unlocked=true;unlocks.push('留守儿童');}
  if(globalStats.roundsWithPressureOver85>=2&&!CHARS.find(c=>c.id==='familyCrisis').unlocked){CHARS.find(c=>c.id==='familyCrisis').unlocked=true;unlocks.push('家庭变故型');}
  if(total>=130&&!CHARS.find(c=>c.id==='preadmit').unlocked){CHARS.find(c=>c.id==='preadmit').unlocked=true;unlocks.push('保送边缘型');}
  if(globalStats.consecutiveLowScores>=2&&!CHARS.find(c=>c.id==='slackoff').unlocked){CHARS.find(c=>c.id==='slackoff').unlocked=true;unlocks.push('摆烂觉醒型');}
  saveUnlocks();
  
  const allCharsUnlocked=CHARS.every(c=>c.unlocked);
  if(allCharsUnlocked&&unlockAchievement('all_chars'))newAchievements.push('全角色解锁');

  const history=loadHistory();
  history.push({char:state.charId,total,scores:subjScores,pressure:state.maxPressureReached,date:new Date().toLocaleDateString()});
  saveHistory(history);

  let breakdownHtml=state.selectedSubjects.map(subjectId=>{
    const subj=SUBJECTS.find(s=>s.id===subjectId);
    return `<div class="row"><span class="subj-name">${subj.name}</span><span class="subj-score">${subjScores[subjectId]}分</span></div>`;
  }).join('');

  let unlockHtml='';
  if(unlocks.length){
    const unlockDetails=unlocks.map(name=>{
      const c=CHARS.find(ch=>ch.name===name);
      return c?`${c.name}（${c.tag}）`:name;
    });
    unlockHtml=`<div class="unlock-banner auto-fade"><div class="unlock-title">🔓 新角色解锁！</div><div class="unlock-name">${unlockDetails.join('、')}</div></div>`;
  }

  let achievementHtml='';
  if(newAchievements.length){
    achievementHtml=`<div class="unlock-banner auto-fade" style="background:linear-gradient(135deg,rgba(161,140,209,.2),rgba(96,165,250,.15));border-color:rgba(161,140,209,.5);margin-top:12px"><div class="unlock-title" style="color:var(--care)">🏆 新成就解锁！</div><div class="unlock-name">${newAchievements.join('、')}</div></div>`;
  }

  let reviewHtml='';
  const triggerStatus=state.triggered?'✨ 已触发':'○ 未触发';
  const triggerClass=state.triggered?'triggered':'not-triggered';
  const crammingStatus=state.cramming?'📚 抱佛脚':'😴 未抱佛脚';
  const careCount=state.careEventTriggered||0;
  const careStatus=careCount>0?`💝 ${careCount}次关怀`:'💝 无关怀';
  
  const peakSubjDisplay=peakPressureSubject||'未知';
  
  reviewHtml=`<div style="margin-top:12px;padding:10px;background:rgba(0,0,0,.04);border-radius:8px;font-size:.75em;color:var(--text-dim);text-align:center;line-height:1.8">
    <div>${crammingStatus} · ${careStatus}</div>
    <div>最高压力: <strong style="color:${maxPressure>70?'var(--bad)':maxPressure>50?'var(--accent)':'var(--good)'}">${maxPressure}%</strong>（${peakSubjDisplay}） · 
    隐藏属性: <strong style="color:${state.triggered?'var(--accent)':'var(--text-dim)'}" class="${triggerClass}">${triggerStatus}</strong></div>
  </div>`;

  showProgressText(false);

  render(`
    <div class="card">
      <div class="result-card">
        <h2>高考结束</h2>
        <div class="result-tier" style="color:${tierColor};font-size:1.4em;margin:12px 0">${tier}</div>
        <div class="result-score">${total}</div>
        ${charHighScore>0&&total>=charHighScore?'<div style="font-size:.82em;color:var(--accent);margin-bottom:8px">🏆 新历史最高！</div>':''}
        ${charHighScore>0&&total<charHighScore?`<div style="font-size:.78em;color:var(--text-dim);margin-bottom:8px">历史最高: ${charHighScore}分</div>`:''}
        ${reviewHtml}
        <div class="result-summary">${summary}</div>
        ${achievementHtml}
        ${unlockHtml}
        <details class="result-breakdown-details" style="margin:16px 0;text-align:left">
          <summary style="cursor:pointer;color:var(--text-dim);font-size:.88em;padding:8px 0;user-select:none">查看各科明细</summary>
          <div class="result-breakdown" style="margin-top:8px">${breakdownHtml}</div>
        </details>
        <div class="final-msg">希望所有学子都能考上理想的学校。<br>无论结果如何，你都是最棒的。</div>
        <button class="btn btn-primary mt24" onclick="renderTitle()">再来一局</button>
        <button class="btn btn-option mt8" style="text-align:center;font-weight:600" onclick="selectChar('${charId}')">用 ${char.name} 再来一次</button>
      </div>
    </div>`);
}

createStars();
renderTitle();
</script>
</body>
</html>
